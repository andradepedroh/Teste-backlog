# Regra 5 — transição de estado (atribuição a .status/.state)
id: state-transition-assignment-js
language: javascript
severity: hint
message: "Atribuição direta a campo de status/estado — transição de estado de entidade. Mapear a máquina de estados (de/para, quem pode) e redigir RN."
rule:
  pattern: $OBJ.$FIELD = $VAL
constraints:
  FIELD:
    regex: "(?i)^(status|state|situacao|estado|fase|etapa)$"
