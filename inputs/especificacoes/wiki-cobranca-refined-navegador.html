nte que atende critérios de ambos os eixos\n- **Quando** a segmentação executa\n- **Então** ele é atribuído a um único eixo conforme a regra de desempate. ⚠ NÃO IDENTIFICADO — definir regra.\n\n---\n\n## 3. Dados\n\n> Eixo `processo`: entidades derivam das atividades de definição/segmentação.\n\n### 3.1 Entidades canônicas usadas\n- **Critério de Qualificação** (ver [../modelo-dados.md](../modelo-dados.md)) — esta feature é a **lar**.\n- **Carteira** — formada aqui; lar.\n- **Contribuinte**, **Débito** — segmentados; referenciados.\n\n### 3.2 Entidades próprias da feature\n\n#### Execução de Segmentação  <!-- deriva de: atividade \"Segmentar/Sortear\"; referencia Carteira de ../modelo-dados.md -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| criterio_versao_ref | referência | → Critério de Qualificação (versão) |\n| total_massificada | número | Contagem |\n| total_qualificada | número | Contagem |\n| total_controle | número | Tamanho do grupo de controle |\n| data | data | Execução |\n\n### 3.3 Relações\n- Critério de Qualificação 1:N Execução de Segmentação 1:N Carteira (entidades canônicas de ../modelo-dados.md).\n\n---\n\n## Questões em aberto\n- ⚠ NÃO IDENTIFICADO — definir: regra de desempate massificada↔qualificada (RN-04); tamanho padrão do grupo de controle.\n\n## Fontes\n- Levantamento de Necessidades 2.6 (N1.2, N1.4, N2.1, N2.4); Planning_Poker (US 3, 11, 14); Diagnóstico de Situação Atual.\n\n## Relacionado\n- [Visão do produto](../visao.md)\n- [Modelo de dados (transversal)](../modelo-dados.md)\n- [Requisitos transversais](../requisitos-transversais.md)\n- [Telas comuns (arquétipos)](../telas-comuns.md)\n- [Ingestão e Carteira](ingestao-carteira.md)\n- [Réguas de Cobrança](reguas-cobranca.md)\n- [Scoring de Liquidez](scoring-liquidez.md)\n- [Índice do wiki](../index.md)\n"}, "requisitos/reguas-cobranca": {"title": "Réguas de Cobrança Massificada Multicanal — Contrato", "path": "refined/Requisitos/reguas-cobranca.md", "content": "# Réguas de Cobrança Massificada Multicanal — Contrato\n\n> Documento único da Camada de Requisitos desta feature (3 capítulos).\n>\n> **Pense transversalmente.** Consulte: [Modelo de dados](../modelo-dados.md), [Requisitos transversais](../requisitos-transversais.md), [Telas comuns](../telas-comuns.md).\n>\n> **Eixo:** `processo` — fluxo de **desenhar uma régua, disparar comunicações escalonadas por múltiplos canais e ajustar conforme o comportamento do contribuinte**.\n\n> **Regra de não-sobreposição:** persona+objetivo → §2.1; o que faz + RN → §2.2; prova → §2.4; entidades → [modelo-dados](../modelo-dados.md).\n\n---\n\n## 1. Telas & Fluxos\n\n### 1.1 Fluxo (Mermaid)\n\n```mermaid\nflowchart LR\n    Inicio([Carteira massificada disponível]) --> A[Selecionar régua por segmento RN-04]\n    A --> B[Executar etapa: gerar comunicação no canal RN-05]\n    B --> OI{Canal exige opt-in?}\n    OI -->|sim, sem opt-in| Skip[Pular canal / usar fallback RN-06]\n    OI -->|ok| Env[Enviar e registrar entrega RNF-T-OBS-01]\n    Skip --> Esp\n    Env --> Esp[Aguardar offset temporal]\n    Esp --> R{Regularizou? RN-02}\n    R -->|sim| Enc[Encerrar régua + marcar origem RN-08]\n    R -->|não| P{Há próxima etapa?}\n    P -->|sim| Int[Escalonar p/ próxima etapa RN-05]\n    P -->|não| FimR[Fim da régua / encaminhar p/ qualificada]\n    Int --> B\n    Enc --> Fim([Resultado mensurado])\n    FimR --> Fim\n```\n\n> **Segmentos de régua priorizados** (Executivo Soluções §2.6 — \"5 réguas prioritárias\"): **Parcelamentos Inadimplentes**, **IPVA**, **ITCD**, **ICMS Normal** e **ICMS Substituição Tributária**. São os perfis-alvo iniciais das réguas massificadas; cada um instancia o Editor de Régua (T-REG-01) com cadência/canais próprios. O IPVA, pelo grande volume (~1,8 mi contribuintes / ~15 mil veículos cobrados quase diariamente), é tratado prioritariamente por estratégia massiva.\n\n### 1.2 Telas detalhadas\n\n#### T-REG-01 — Editor de Régua\n- **Arquétipo:** A5 (Editor de Fluxo / Linha do Tempo)\n- **Objetivo:** desenhar a sequência de etapas, canais, offsets e condições de escalonamento (RN-05).\n\n```wireframe\n# Editor de Régua\n[Nome da régua____] [Segmento alvo v] [Tributo v]\ncard \"Etapas (linha do tempo)\":\n  [[ -5d e-mail | -2d SMS | 0d e-mail | +15d WhatsApp ]]\n  - condição: sem pagamento -> intensifica\n  - condição: regularizou -> encerra\n[Template por etapa____]\n[Adicionar etapa] [Simular] [Ativar régua] [Ver histórico de versões]\n```\n- **Conteúdo:** etapas ordenadas com offset, canal e template; condições de progressão.\n- **Ações:** adicionar/editar etapa, simular, ativar/pausar, versionar.\n- **Estados:** rascunho; ativa; pausada.\n- **Navegação:** ativa → execução (T-REG-02).\n- **Componentes:** toolbar, input, select, card, chip, button.\n\n#### T-REG-02 — Execução & Status de Disparo\n- **Arquétipo:** A2 (Lista / Fila) combinado com A6 (status de execução)\n- **Objetivo:** acompanhar e operar a execução das réguas ativas (status de entrega por comunicação).\n\n```wireframe\n# Execução de Réguas\n[[ Réguas ativas | Comunicações hoje | Falhas de entrega ]]\n[Régua v] [Canal v] [Status entrega v]\n| Contribuinte | Etapa | Canal | Status | Data |\n| reg | reg | reg | reg | reg |\n[Reenviar falhas] [Pausar régua] [Exportar]\n```\n- **Conteúdo:** comunicações em execução, status (enviado/entregue/aberto/falha).\n- **Ações:** reenviar falhas (fallback), pausar régua, exportar (RF-T-01).\n- **Estados:** sem disparos; lote em andamento; falhas pendentes.\n- **Navegação:** de T-REG-01; KPIs em T-REG-03.\n- **Componentes:** toolbar, card, select, table, button.\n\n#### T-REG-03 — Efetividade da Régua\n- **Arquétipo:** A1 (Painel de Indicadores)\n- **Objetivo:** monitorar taxas de resposta/regularização por segmento e etapa (N2.6).\n\n```wireframe\n# Efetividade das Réguas\n[Régua v] [Segmento v] [Período v]\n[[ Taxa de abertura | Taxa de regularização | Retorno R$ ]]\n[~ regularização por etapa ~]\ncard \"Por canal\":\n  | Canal | Enviados | Regularizados | Taxa |\n  | linha | linha | linha | linha |\n[Exportar]\n```\n- **Conteúdo:** taxas por etapa/canal/segmento; retorno financeiro.\n- **Ações:** filtrar, exportar; insumo para ajuste da régua (volta a T-REG-01).\n- **Estados:** sem dados (ciclo inicial); consolidado.\n- **Navegação:** de T-REG-02; compartilha dados com Monitoramento.\n- **Componentes:** toolbar, select, card, chart, table, button.\n\n### 1.3 Diagrama de navegação (Mermaid)\n\n```mermaid\nflowchart TD\n    T_REG_01[T-REG-01 — Editor de Régua] -->|ativar| T_REG_02[T-REG-02 — Execução & Status]\n    T_REG_02 -->|ver efetividade| T_REG_03[T-REG-03 — Efetividade]\n    T_REG_03 -->|ajustar régua| T_REG_01\n    T_REG_02 -->|sem retorno na régua| T_CQ_02[Cobrança Qualificada — Fila]\n```\n\n---\n\n## 2. Requisitos & Cenários de Teste\n\n> Origem: RN-04, RN-05, RN-06, RN-08, RN-02. Horizonte: **H1** (WhatsApp: **H2**, depende de contratação/opt-in).\n\n### 2.1 Personas & objetivos\n\n| Persona | Objetivo | JTBD |\n|---|---|---|\n| Coordenador de Cobrança | Disparar comunicação automatizada e escalonada sem confirmação manual | JTBD-03 |\n| Coordenador de Cobrança | Ajustar a estratégia da régua com base na efetividade observada | JTBD-06 |\n\n### 2.2 Requisitos Funcionais\n\n| ID | Enunciado | Prioridade | RNs | Persona |\n|---|---|---|---|---|\n| RF-01 | Desenhar régua parametrizável com etapas, offsets, canais e templates (N2.2) | Must | RN-05 | Coordenador |\n| RF-02 | Disparar comunicações automaticamente, sem confirmação manual em lote (N1.3, US4) | Must | RN-05 | Coordenador |\n| RF-03 | Escalonar ações conforme comportamento (renotificar/intensificar/encerrar) (N2.3) | Must | RN-05, RN-02 | Coordenador |\n| RF-04 | Operar múltiplos canais (e-mail, SMS, WhatsApp, SNE) com fallback (N2.8) | Must | RN-06 | Coordenador |\n| RF-05 | Respeitar opt-in/opt-out por canal (WhatsApp) com gestão de consentimento (US13) | Must | RN-06 | Coordenador |\n| RF-06 | Registrar status de entrega por comunicação e reenviar falhas (N2.8) | Must | RN-10 | Coordenador |\n| RF-07 | Marcar origem da regularização (canal/instrumento) (N — diagnóstico) | Must | RN-08 | Coordenador |\n| RF-08 | Monitorar a efetividade por segmento/etapa/canal (N2.6) | Should | RN-08 | Coordenador |\n| RF-09 | Encaminhar à cobrança qualificada contribuintes sem retorno na régua | Should | RN-04 | Coordenador |\n\n**Transversais aplicáveis:** RF-T-01, RF-T-02, RF-T-04 (marcação de origem — esta feature é a **lar**).\n\n### 2.3 Requisitos Não-Funcionais\n\n#### Performance\n- **RNF-P-01** — Disparo em lote de centenas de milhares de comunicações por ciclo sem degradar telas (diverge para mais que RNF-T-PERF-02).\n\n#### Segurança\n- **RNF-S-01** — Esta feature é a **lar** de RNF-T-SEG-02 (consentimento/privacidade — opt-in).\n\n**Transversais aplicáveis:** RNF-T-PERF-01/02, RNF-T-OBS-01 (status de entrega — lar), RNF-T-DISP-01 (canal indisponível → fallback), RNF-T-AUD-01, RNF-T-SEG-02 (lar).\n\n### 2.4 Cenários de Teste\n\n#### CT-01 — Disparo automático escalonado (verifica RF-02/RF-03)\n- **Dado** uma régua ativa com etapas -5d, -2d, 0d, +15d\n- **Quando** o contribuinte não paga após a 1ª etapa\n- **Então** o sistema avança automaticamente para a próxima etapa na data prevista, sem confirmação manual.\n\n#### CT-02 — Encerramento por regularização (verifica RF-03/RF-07/RN-02/RN-08)\n- **Dado** um contribuinte em régua que regulariza após uma notificação\n- **Quando** a atualização intraciclo detecta a regularização\n- **Então** a régua é encerrada para ele e a origem é marcada como \"resposta à cobrança\" pelo canal correspondente.\n\n#### CT-03 — Opt-in respeitado (verifica RF-05/RNF-T-SEG-02)\n- **Dado** um contribuinte sem opt-in de WhatsApp\n- **Quando** a etapa de WhatsApp é alcançada\n- **Então** o canal é pulado (fallback) e nenhuma mensagem de WhatsApp é enviada.\n\n#### CT-04 — Falha de entrega e reenvio (verifica RF-06/RNF-T-OBS-01)\n- **Dado** uma comunicação com falha de entrega de e-mail\n- **Quando** o coordenador aciona \"reenviar falhas\"\n- **Então** a comunicação é reenviada e o novo status é registrado.\n\n#### CT-05 — Encaminhamento à qualificada (verifica RF-09)\n- **Dado** um contribuinte que esgotou a régua massificada sem regularizar\n- **Quando** a régua termina\n- **Então** ele é elegível à carteira qualificada conforme RN-04.\n\n---\n\n## 3. Dados\n\n> Eixo `processo`: entidades derivam das atividades de execução da régua.\n\n### 3.1 Entidades canônicas usadas\n- **Régua** e sub-entidade **Etapa de Régua** (ver [../modelo-dados.md](../modelo-dados.md)) — esta feature é a **lar**.\n- **Comunicação** — gerada aqui; lar.\n- **Contribuinte**, **Débito**, **Carteira** — referenciados.\n\n### 3.2 Entidades próprias da feature\n\n#### Template de Comunicação  <!-- deriva de: atividade \"Gerar comunicação\"; referencia Etapa de Régua -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| canal | texto | e-mail / SMS / WhatsApp / SNE |\n| assunto / corpo | texto | Conteúdo (tom por situação) |\n| variaveis | lista | Campos de mesclagem (nome, valor, vencimento) |\n\n#### Consentimento de Canal  <!-- deriva de: decisão \"Canal exige opt-in?\"; referencia Contribuinte -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| contribuinte_ref | referência | → Contribuinte |\n| canal | texto | WhatsApp / SMS |\n| estado | texto | opt-in / opt-out |\n| data | data | Última alteração (log) |\n\n### 3.3 Relações\n- Régua 1:N Etapa de Régua 1:1 Template de Comunicação.\n- Régua 1:N Comunicação; Contribuinte 1:N Consentimento de Canal (entidades canônicas de ../modelo-dados.md).\n\n---\n\n## Questões em aberto\n- ⚠ NÃO IDENTIFICADO — definir: ordem de fallback entre canais; janela de atribuição (30d assumido); status do contrato de WhatsApp.\n\n## Fontes\n- Levantamento de Necessidades 2.6 (N1.3, N2.2, N2.3, N2.6, N2.8); Planning_Poker (US 2, 4, 13); DECK Cobrança Inteligente.\n\n## Relacionado\n- [Visão do produto](../visao.md)\n- [Modelo de dados (transversal)](../modelo-dados.md)\n- [Requisitos transversais](../requisitos-transversais.md)\n- [Telas comuns (arquétipos)](../telas-comuns.md)\n- [Qualificação da Carteira](qualificacao-carteira.md)\n- [Cobrança Qualificada](cobranca-qualificada.md)\n- [Monitoramento e KPIs](monitoramento-kpis.md)\n- [Índice do wiki](../index.md)\n"}, "requisitos/scoring-liquidez": {"title": "Scoring de Liquidez (Priorização Inteligente) — Contrato", "path": "refined/Requisitos/scoring-liquidez.md", "content": "# Scoring de Liquidez (Priorização Inteligente) — Contrato\n\n> Documento único da Camada de Requisitos desta feature (3 capítulos).\n>\n> **Pense transversalmente.** Consulte: [Modelo de dados](../modelo-dados.md), [Requisitos transversais](../requisitos-transversais.md), [Telas comuns](../telas-comuns.md).\n>\n> **Eixo:** `processo` — fluxo de **ingerir o score da UFMT, normalizá-lo, disponibilizá-lo como variável de priorização e recalibrar periodicamente**. O **desenvolvimento** do modelo é externo (UFMT) — ver não-objetivos da Visão; esta feature trata da **integração e do uso**.\n\n> **Regra de não-sobreposição:** persona+objetivo → §2.1; o que faz + RN → §2.2; prova → §2.4; entidades → [modelo-dados](../modelo-dados.md). A regra dependente de IA é `RN-AI-01` (Visão §3) — citada por ID, não reescrita.\n\n---\n\n## 1. Telas & Fluxos\n\n### 1.1 Fluxo (Mermaid)\n\n```mermaid\nflowchart LR\n    Inicio([Score UFMT publicado / ciclo de recálculo]) --> A[Consumir output do modelo via API/arquivo RN-AI-01]\n    A --> D{Output disponível e válido?}\n    D -->|não| FB[Marcar contribuintes como sem score / fallback RNF-T-DISP-01]\n    D -->|sim| N[Normalizar score p/ escala interna]\n    N --> P[Disponibilizar como variável de priorização RN-03]\n    P --> U[Exibir score no dossiê e na configuração de carteira]\n    U --> R[Registrar recálculo periódico com base em resultados observados]\n    FB --> Fim([Carteira/fila operam com/sem score])\n    R --> Fim\n```\n\n### 1.2 Telas detalhadas\n\n#### T-SC-01 — Painel do Score de Liquidez\n- **Arquétipo:** A6 (Painel de Status de Integração / Execução) + A1 (distribuição)\n- **Objetivo:** operar a ingestão do score e acompanhar cobertura/qualidade (uso, não desenvolvimento do modelo).\n\n```wireframe\n# Score de Liquidez (UFMT)\n[[ Versão do modelo | Última ingestão | Cobertura da carteira ]]\n(!) score indisponível — operando em fallback\n[~ distribuição do score na carteira ~]\ncard \"Cobertura por tributo\":\n  | Tributo | Com score | Sem score |\n  | linha | linha | linha |\n[Reimportar score] [Ver log de ingestão]\n```\n- **Conteúdo:** versão/última ingestão; cobertura (com/sem score); distribuição.\n- **Ações:** reimportar; ver log; (configuração do threshold ocorre em T-QC-01).\n- **Estados:** sem score (fallback); ingestão parcial; atualizado.\n- **Navegação:** alimenta Qualificação (threshold) e Cobrança Qualificada (priorização da fila).\n- **Componentes:** toolbar, card, chart, table, banner, button.\n\n> **Minimização de telas:** a feature não cria tela de configuração própria — o **uso** do score como critério é configurado na tela de critérios da Qualificação (T-QC-01) e exibido no Dossiê (T-CQ-03). Esta feature contribui apenas com a tela operacional T-SC-01.\n\n### 1.3 Diagrama de navegação (Mermaid)\n\n```mermaid\nflowchart TD\n    T_SC_01[T-SC-01 — Painel do Score] -->|usar como critério| T_QC_01[Qualificação — Critérios]\n    T_SC_01 -->|priorizar fila| T_CQ_02[Cobrança Qualificada — Fila]\n    T_SC_01 -->|exibir no dossiê| T_CQ_03[Cobrança Qualificada — Dossiê]\n```\n\n---\n\n## 2. Requisitos & Cenários de Teste\n\n> Origem: RN-AI-01, RN-03. Horizonte: **H2** (depende da entrega do modelo pela UFMT; dados de cobrança alimentam o modelo a partir de maio/26).\n\n### 2.1 Personas & objetivos\n\n| Persona | Objetivo | JTBD |\n|---|---|---|\n| Coordenador de Cobrança | Priorizar a cobrança por probabilidade de recuperação, não por empirismo | JTBD-02 |\n| Atendente de Cobrança | Ver o score do contribuinte para orientar a abordagem | JTBD-04 |\n\n### 2.2 Requisitos Funcionais\n\n| ID | Enunciado | Prioridade | RNs | Persona |\n|---|---|---|---|---|\n| RF-01 | Consumir o output do modelo de score (API ou arquivo) e normalizá-lo (US14) | Must | RN-AI-01 | Coordenador |\n| RF-02 | Disponibilizar o score como variável parametrizável de priorização (threshold em T-QC-01) (US14) | Must | RN-AI-01, RN-03 | Coordenador |\n| RF-03 | Exibir o score no dossiê e na configuração de carteira (US14) | Should | RN-AI-01 | Atendente |\n| RF-04 | Recalibrar/atualizar o score periodicamente com base em resultados observados | Should | RN-AI-01 | Coordenador |\n| RF-05 | Operar em fallback (sem score) quando o output estiver indisponível/ inválido | Must | RN-AI-01 | Coordenador |\n| RF-06 | Acompanhar cobertura e qualidade da ingestão do score por tributo | Should | RN-10 | Coordenador |\n\n**Transversais aplicáveis:** RF-T-01 (exportação), RF-T-03 (visão única — exibe score no contribuinte).\n\n### 2.3 Requisitos Não-Funcionais\n\n#### Disponibilidade\n- **RNF-D-01** — Esta feature reforça RNF-T-DISP-01: a indisponibilidade do score nunca bloqueia a qualificação/priorização (fallback determinístico, RN-AI-01).\n\n#### Observabilidade\n- **RNF-O-01** — Versão do modelo, data de ingestão e cobertura são registradas e visíveis (RNF-T-OBS-01).\n\n**Transversais aplicáveis:** RNF-T-DISP-01, RNF-T-OBS-01, RNF-T-AUD-01, RNF-T-PERF-02 (alta volumetria de dados do score).\n\n### 2.4 Cenários de Teste\n\n#### CT-01 — Ingestão e normalização (verifica RF-01)\n- **Dado** um arquivo de score da UFMT\n- **Quando** a ingestão executa\n- **Então** os scores são normalizados e associados aos contribuintes correspondentes.\n\n#### CT-02 — Score como critério (verifica RF-02/RN-AI-01/RN-03)\n- **Dado** um threshold de score configurado em T-QC-01\n- **Quando** a carteira é qualificada\n- **Então** apenas contribuintes acima do threshold entram conforme a regra, além dos demais critérios.\n\n#### CT-03 — Fallback sem score (verifica RF-05/RNF-T-DISP-01)\n- **Dado** o output do modelo indisponível\n- **Quando** a qualificação/priorização executa\n- **Então** opera apenas com critérios determinísticos e marca os contribuintes como \"sem score\".\n\n#### CT-04 — Score exibido no dossiê (verifica RF-03)\n- **Dado** um contribuinte com score ingerido\n- **Quando** o atendente abre o dossiê\n- **Então** o score aparece no resumo do contribuinte.\n\n#### CT-05 — Recálculo periódico (verifica RF-04)\n- **Dado** novos resultados de cobrança acumulados\n- **Quando** o ciclo de recálculo ocorre (modelo UFMT atualizado)\n- **Então** uma nova versão do score é ingerida e a versão é registrada.\n\n---\n\n## 3. Dados\n\n> Eixo `processo`: entidades derivam das atividades de ingestão/uso do score. A capacidade de IA é a `RN-AI-01` (Visão); aqui só o que é próprio da integração.\n\n### 3.1 Entidades canônicas usadas\n- **Contribuinte** (campo `score_liquidez`) (ver [../modelo-dados.md](../modelo-dados.md)) — enriquecido com o score; esta feature alimenta o campo.\n- **Critério de Qualificação** (threshold de score) — referenciado.\n\n### 3.2 Entidades próprias da feature\n\n#### Ingestão de Score  <!-- deriva de: atividade \"Consumir/Normalizar\"; referencia Contribuinte -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| versao_modelo | texto | Versão do modelo UFMT |\n| data_ingestao | data | Quando foi ingerido |\n| cobertura | número | % de contribuintes com score |\n| status | texto | OK / falha / parcial |\n\n### 3.3 Relações\n- Ingestão de Score 1:N Contribuinte (atualiza score_liquidez) — entidade canônica de ../modelo-dados.md.\n\n---\n\n## Questões em aberto\n- ⚠ NÃO IDENTIFICADO — definir: contrato técnico do output da UFMT (API vs. arquivo) e escala do score; periodicidade do recálculo; data efetiva de disponibilidade do modelo.\n\n## Fontes\n- Potenciais oportunidades P2.6 (Plataforma de priorização Inteligente — Scoring); Planning_Poker (US 14); DECK Cobrança Inteligente (Rating).\n\n## Relacionado\n- [Visão do produto](../visao.md)\n- [Modelo de dados (transversal)](../modelo-dados.md)\n- [Requisitos transversais](../requisitos-transversais.md)\n- [Telas comuns (arquétipos)](../telas-comuns.md)\n- [Qualificação da Carteira](qualificacao-carteira.md)\n- [Cobrança Qualificada](cobranca-qualificada.md)\n- [Índice do wiki](../index.md)\n"}, "wiki/modelo-dados": {"title": "Modelo de Dados (transversal)", "path": "refined/modelo-dados.md", "content": "# Modelo de Dados (transversal)\n\nModelo de dados canônico de **Cobrança Inteligente**, compartilhado por todas as features. Cada feature **referencia** estas entidades; no seu Cap. 3 (Dados) descreve apenas os campos e entidades **próprios** dela (configurações, logs, instâncias de execução), apontando para a entidade canônica de origem aqui. A terminologia segue o [Glossário](visao.md) (Visão §2); valores numéricos são parâmetros de instância (`RN-NN`, Visão §3). Inferências marcadas com `*(inferência)*`.\n\n> **Home feature.** Cada entidade canônica tem uma *feature-lar* que a define/alimenta; as demais apenas referenciam. Tabelas de execução/log de uma única feature **não** são canônicas — vivem no Cap. 3 daquela feature.\n\n---\n\n## Entidades\n\n### Contribuinte\n\nPessoa física ou jurídica sujeito do crédito; eixo da visão única. Origem cadastral é externa (2.2 B-Cadastro/Big Data); aqui é referenciado e enriquecido com dados de contato e consentimentos.\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave do contribuinte |\n| documento | texto | CPF/CNPJ (validado, RN-01) |\n| nome | texto | Nome/razão social |\n| tipo_pessoa | enum | física / jurídica |\n| contatos | lista | E-mail(s), telefone(s) — qualificados pelo 2.2 |\n| consentimentos | lista | Opt-in/opt-out por canal (RN-06) |\n| segmento_atual | enum | massificada / qualificada (RN-04) |\n| score_liquidez | número | Última pontuação UFMT, se houver (RN-AI-01) |\n\n**Usada em:** Ingestão e Carteira (home), Qualificação, Réguas, Cobrança Qualificada, Monitoramento.\n\n### Débito\n\nCrédito tributário em aberto. Consolidado de múltiplas fontes (RN-01).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave do débito |\n| contribuinte_ref | referência | → Contribuinte |\n| tributo | enum | ICMS / IPVA / ITCD / outros |\n| valor | monetário | Valor atualizado do débito |\n| vencimento | data | Data de vencimento |\n| tempo_atraso | número | Dias em atraso (derivado) |\n| instrumento | enum | Instrumento de constituição (NL, NAI, TAD, ACF…) |\n| fonte_origem | enum | CCF / MPI / Big Data / IPVA / ITCD / SNE (RN-12) |\n| status | enum | aberto / em_cobranca / regularizado / parcelado |\n| origem_regularizacao | enum | espontânea / cobrança-ativa(canal/instrumento) (RN-08) |\n\n**Usada em:** Ingestão e Carteira (home), Qualificação, Réguas, Cobrança Qualificada, Monitoramento.\n\n### Parcelamento\n\nAcordo de parcelamento de débito(s); monitorado quanto à inadimplência (risco de denúncia do contrato).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| contribuinte_ref | referência | → Contribuinte |\n| debitos_ref | lista | → Débito(s) abrangidos |\n| status | enum | ativo / em_atraso / rompido |\n| parcelas_em_atraso | número | Nº de parcelas vencidas (alerta de risco) |\n\n**Usada em:** Ingestão e Carteira (home), Cobrança Qualificada, Monitoramento.\n\n### Carteira\n\nRecorte de débitos/contribuintes formado pela aplicação de um conjunto de critérios; pode ser massificada ou qualificada.\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| nome | texto | Identificação da carteira/ciclo |\n| tipo | enum | massificada / qualificada (RN-04) |\n| criterios_ref | referência | → Critério de Qualificação (versão aplicada, RN-03) |\n| ciclo | texto | Ciclo de cobrança |\n| contribuintes | lista | → Contribuinte (membros) |\n| grupo_controle | booleano (por membro) | Marca membro reservado ao grupo de controle (RN-09) |\n\n**Usada em:** Qualificação da Carteira (home), Réguas, Cobrança Qualificada, Monitoramento.\n\n### Critério de Qualificação\n\nConjunto versionado de regras de formação de carteira (RN-03).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| versao | texto | Versão (imutável após publicação) |\n| condicoes | lista | Valor mínimo, tributo, atraso, instrumento, exclusões, threshold de score |\n| tipo_alvo | enum | massificada / qualificada |\n| ativo | booleano | Vigente |\n\n**Usada em:** Qualificação da Carteira (home), Scoring, Réguas.\n\n### Régua\n\nModelo configurado de sequência de ações de cobrança para um segmento (RN-05).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| nome | texto | Ex.: Régua ICMS Contas-Declaração |\n| segmento_alvo | referência | → segmento/critério aplicável |\n| etapas | lista | → Etapa de Régua (ordenadas) |\n| status | enum | rascunho / ativa / pausada |\n\n**Usada em:** Réguas (home), Monitoramento.\n\nSub-entidade **Etapa de Régua** (linhas da Régua): `ordem`, `offset_temporal` (ex.: -5d, +15d), `canal` (e-mail/SMS/WhatsApp/SNE), `template_ref`, `condicao_progressao` (RN-05), `acao` (notificar/renotificar/intensificar/encerrar).\n\n### Comunicação\n\nDisparo individual realizado por uma etapa de régua a um contribuinte (instância de execução da régua).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| contribuinte_ref | referência | → Contribuinte |\n| debito_ref | referência | → Débito |\n| regua_ref / etapa_ref | referência | → Régua / Etapa |\n| canal | enum | e-mail / SMS / WhatsApp / SNE |\n| status_entrega | enum | enviado / entregue / aberto / falha (RF-T) |\n| data_envio | data | Timestamp do disparo |\n\n**Usada em:** Réguas (home), Cobrança Qualificada (histórico), Monitoramento.\n\n### Caso\n\nUnidade de trabalho da cobrança qualificada: vínculo contribuinte ↔ atendente, com andamento.\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| contribuinte_ref | referência | → Contribuinte |\n| atendente_ref | referência | → Usuário (atendente) |\n| carteira_ref | referência | → Carteira (qualificada) |\n| status | enum | aberto / em_andamento / regularizado / encerrado |\n| prioridade | número | Derivada de score/estágio (RN-07) |\n| interacoes | lista | → Interação |\n\n**Usada em:** Cobrança Qualificada (home), Monitoramento.\n\nSub-entidade **Interação** (linhas do Caso): `data`, `tipo` (ligação/e-mail/visita/anotação), `resultado`, `texto_livre`, `autor_ref`.\n\n### Dossiê\n\nVisão consolidada (read-model) de um contribuinte para a cobrança qualificada; montado automaticamente — não é fonte primária, agrega Débito, Parcelamento, Comunicação, Interação e sinalizações coercitivas externas.\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| contribuinte_ref | referência | → Contribuinte |\n| debitos | lista | → Débito |\n| parcelamentos | lista | → Parcelamento |\n| historico_contatos | lista | → Comunicação + Interação |\n| sinalizacoes_coercitivas | lista | Notificações ativas em outras coordenadorias (CCF/SNE/SUCOM) |\n| completude | enum | indicador de completude p/ encaminhamento |\n\n**Usada em:** Cobrança Qualificada (home), Réguas (contexto).\n\n### Indicador (KPI)\n\nMétrica instrumentada da cobrança (RN-08, RN-09).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| nome | texto | Ex.: regularização por tributo/canal/instrumento/atendente |\n| dimensao | enum | tributo / canal / instrumento / atendente / segmento / etapa |\n| valor | número | Valor apurado |\n| meta | número | Meta formal (ICMS/IPVA/ITCD) |\n| ciclo | texto | Período de apuração |\n\n**Usada em:** Monitoramento (home).\n\n### Usuário (entidade transversal global)\n\nServidor da SEFAZ que opera a plataforma; perfil define visibilidade (RN-11).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| nome | texto | Nome do servidor |\n| perfil | enum | coordenador / atendente |\n| vinculos | lista | Contadores/contribuintes vinculados (RN-07) |\n\n**Usada em:** todas as features (referenciada).\n\n### Evento de Auditoria (entidade transversal global)\n\nRegistro imutável de ação relevante (RN-10).\n\n| Campo | Tipo conceitual | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| ator_ref | referência | → Usuário (ou sistema) |\n| acao | texto | Tipo da ação |\n| timestamp | data | Momento |\n| payload | composto | Dados da ação |\n| resultado | texto | Sucesso/erro |\n\n**Usada em:** todas as features (referenciada).\n\n---\n\n## Relações\n\n- **Contribuinte 1:N Débito** — um contribuinte possui vários débitos.\n- **Contribuinte 1:N Parcelamento** — um contribuinte pode ter vários parcelamentos.\n- **Parcelamento N:N Débito** — um parcelamento abrange um ou mais débitos.\n- **Carteira N:N Contribuinte** — uma carteira contém vários contribuintes; um contribuinte pode estar em carteiras de ciclos distintos.\n- **Critério de Qualificação 1:N Carteira** — uma versão de critérios forma várias carteiras.\n- **Régua 1:N Etapa de Régua**; **Régua 1:N Comunicação** — uma régua gera muitas comunicações.\n- **Contribuinte 1:N Comunicação**; **Débito 1:N Comunicação**.\n- **Caso 1:1 Contribuinte (por ciclo qualificado)**; **Usuário(atendente) 1:N Caso**; **Caso 1:N Interação**.\n- **Dossiê 1:1 Contribuinte** (read-model agregando Débito/Parcelamento/Comunicação/Interação).\n- **Usuário 1:N Evento de Auditoria**; toda entidade pode originar Evento de Auditoria.\n\n```mermaid\nerDiagram\n    CONTRIBUINTE ||--o{ DEBITO : possui\n    CONTRIBUINTE ||--o{ PARCELAMENTO : tem\n    PARCELAMENTO }o--o{ DEBITO : abrange\n    CARTEIRA }o--o{ CONTRIBUINTE : contem\n    CRITERIO_QUALIFICACAO ||--o{ CARTEIRA : forma\n    REGUA ||--o{ ETAPA_REGUA : compoe\n    REGUA ||--o{ COMUNICACAO : gera\n    CONTRIBUINTE ||--o{ COMUNICACAO : recebe\n    DEBITO ||--o{ COMUNICACAO : referencia\n    USUARIO ||--o{ CASO : atende\n    CONTRIBUINTE ||--o| CASO : sujeito_de\n    CARTEIRA ||--o{ CASO : origina\n    CASO ||--o{ INTERACAO : registra\n    CONTRIBUINTE ||--o| DOSSIE : consolida\n    USUARIO ||--o{ EVENTO_AUDITORIA : produz\n    INDICADOR }o--|| CARTEIRA : mensura\n```\n\n> Notação `erDiagram`: `||--o{` = 1:N · `}o--o{` = N:N · `||--o|` = 1:1 (opcional).\n\n---\n\n## Relacionado\n- [Índice do wiki](index.md)\n- [Visão do produto](visao.md)\n- [Requisitos transversais](requisitos-transversais.md)\n- [Telas comuns (arquétipos)](telas-comuns.md)\n"}, "wiki/requisitos-transversais": {"title": "Requisitos Transversais", "path": "refined/requisitos-transversais.md", "content": "# Requisitos Transversais\n\n> Camada de Requisitos · Requisitos cross-cutting · Spec-Driven Development\n> Pergunta-mãe: *Quais requisitos valem para todas (ou quase todas) as features, de modo que não precisem ser repetidos em cada uma?*\n\nConsolida os requisitos não-funcionais e funcionais que se repetem ao longo das features de **Cobrança Inteligente**. Cada feature apenas **referencia** estes IDs no seu Cap. 2 (ex.: \"aplica-se `RNF-T-SEG-01`\"), reservando o capítulo ao que é genuinamente próprio. IDs estáveis; valores numéricos são parâmetros configuráveis por instância. Marcadores: `*(inferência)*`, `⚠ NÃO IDENTIFICADO`.\n\n---\n\n## RNF transversais\n\n### Segurança\n\n#### RNF-T-SEG-01 — Controle de acesso por perfil\nAcesso e visibilidade são governados pelo perfil do usuário (coordenador / atendente, RN-11): o atendente vê apenas a própria carteira/casos e visões não-comparativas; o coordenador vê tudo. Toda tela e dado respeita o field-level access.\n*Subsume:* RN-11; visibilidade por perfil presente em Monitoramento e Cobrança Qualificada.\n\n#### RNF-T-SEG-02 — Consentimento e privacidade do contribuinte\nDados de contato e consentimentos (opt-in/opt-out) são tratados conforme a base legal (LGPD); disparos em canais sujeitos a consentimento exigem opt-in vigente (RN-06).\n*Subsume:* gestão de opt-in das réguas.\n\n### Auditoria\n\n#### RNF-T-AUD-01 — Trilha imutável de ações\nToda ação relevante (disparo, distribuição, alteração de regra/régua/critério, encerramento de caso, registro de interação, recálculo de score) gera Evento de Auditoria imutável com ator, timestamp, payload e resultado (RN-10).\n*Subsume:* requisitos de rastreabilidade em todas as features.\n\n#### RNF-T-AUD-02 — Versionamento de configuração\nCritérios de qualificação e modelos de régua são versionados; a versão aplicada a uma carteira/ciclo é registrada e imutável após publicação (RN-03).\n*Subsume:* versionamento de regras (Qualificação) e de réguas.\n\n### Performance\n\n#### RNF-T-PERF-01 — Atualização quase-real do ciclo\nA consolidação de débitos e a atualização de status de regularização/parcelamento ocorrem em ciclo periódico (diário *(inferência)* ou mais frequente), refletindo no painel e na carteira em tempo quase-real (RN-02). Valores de frequência específicos por feature prevalecem quando declarados.\n*Subsume:* atualização intraciclo (Réguas, Monitoramento), monitoramento de parcelamentos.\n\n#### RNF-T-PERF-02 — Processamento em lote de alto volume\nIngestão, qualificação e disparo operam sobre carteira de ~1,8 milhão de contribuintes / múltiplas fontes, em janelas de lote, sem degradar as telas interativas.\n*Subsume:* volumetria de Ingestão, Réguas.\n\n### Disponibilidade\n\n#### RNF-T-DISP-01 — Degradação segura por fonte\nFalha ou indisponibilidade de uma fonte/integração (CCF, MPI/Big Data, IPVA, ITCD, SNE, canal de mensageria, score UFMT) não derruba o sistema: a feature opera com as fontes disponíveis e sinaliza a lacuna; o score ausente cai no fallback determinístico (RN-AI-01).\n*Subsume:* tolerância a falhas de integração em Ingestão, Scoring, Réguas.\n\n### Observabilidade\n\n#### RNF-T-OBS-01 — Status de integração e de entrega rastreáveis\nO status de cada integração (última sincronização, registros lidos, erros) e de cada comunicação (enviado/entregue/aberto/falha) é observável e registrado para rastreabilidade.\n*Subsume:* rastreabilidade de envio (Réguas), status de sincronização (Ingestão).\n\n### Conformidade\n\n#### RNF-T-CONF-01 — Validação de identificadores\nCPF/CNPJ são validados (11/14 dígitos, zero à esquerda) na entrada/vínculo; documentos inválidos não são gravados, evitando cruzamentos e cobranças equivocadas.\n*Subsume:* validação cadastral na Ingestão/vínculo.\n\n#### RNF-T-CONF-02 — Continuidade na transição de fonte\nA migração MPI→Big Data preserva a operação e a equivalência das regras de elegibilidade, sem ruptura da carteira (RN-12).\n*Subsume:* requisito de transição na Ingestão.\n\n---\n\n## RF transversais\n\n#### RF-T-01 — Exportação rastreável\nListas e painéis (carteira, casos, KPIs, comunicações) podem ser exportados (CSV/PDF) respeitando o acesso por perfil, com registro da exportação em trilha de auditoria.\n*Subsume:* exportação em Monitoramento, Qualificação, Cobrança Qualificada.\n\n#### RF-T-02 — Busca e filtro padronizados\nToda coleção (carteira, contribuintes, casos, comunicações, réguas) oferece busca e filtros consistentes (por contribuinte/documento, tributo, status, atraso, segmento, atendente).\n*Subsume:* filtros recorrentes em todas as listas/filas.\n\n#### RF-T-03 — Consolidação por contribuinte (visão única)\nQualquer feature que exiba dados de um contribuinte usa a visão consolidada (RN-01): débitos, parcelamentos, contatos e histórico, independente da fonte de origem.\n*Subsume:* visão única (Ingestão N1.7) reutilizada por Dossiê e telas de contribuinte.\n\n#### RF-T-04 — Marcação de origem da regularização\nQuando um débito é regularizado, o sistema registra a origem (espontânea vs. resposta à cobrança, por canal/instrumento) (RN-08).\n*Subsume:* marcação de causalidade usada por Réguas e Monitoramento.\n\n---\n\n## Notas de uso\n\n- Cada feature **referencia os IDs acima** no Cap. 2 e lista apenas requisitos **específicos** (thresholds próprios, regras exclusivas, CTs particulares).\n- Quando um valor diverge do piso transversal, o valor da feature **prevalece** e fica documentado nela.\n- A feature-lar de cada cross-cutting (ex.: Ingestão para visão única RF-T-03; Réguas para marcação de origem RF-T-04) trata parte destes transversais como requisito **próprio**.\n\n## Relacionado\n- [Índice do wiki](index.md)\n- [Visão do produto](visao.md)\n- [Modelo de dados (transversal)](modelo-dados.md)\n- [Telas comuns (arquétipos)](telas-comuns.md)\n"}, "wiki/telas-comuns": {"title": "Telas Comuns (arquétipos transversais)", "path": "refined/telas-comuns.md", "content": "# Telas Comuns (arquétipos transversais)\n\nArquétipos de tela reutilizáveis de **Cobrança Inteligente**: padrões de layout/comportamento que se repetem nas features. Uma tela de feature que segue um arquétipo **referencia-o e descreve só o que muda** (colunas, filtros, ações, estados). Objetivo: **minimizar o número de telas** — pensar telas transversalmente e **fundir** vistas (abas, drawers, painéis laterais). Cada `#### T-NN` declara seu `**Arquétipo:** A-NN`. Componentes citados seguem [componentes.md](componentes.md).\n\n> IDs estáveis `A1`…`A-NN`. Novo padrão recorrente (≥ 2 features) vira arquétipo aqui, não nasce duplicado.\n\n## Arquétipos\n\n### A1 — Painel de Indicadores (Dashboard)\nPainel de KPIs com filtros, cartões de indicador, gráfico principal e tabela de detalhe; visão muda por perfil (RN-11).\n\n```wireframe\n# Painel\n[Ciclo v] [Tributo v] [Canal v]\n[[ Recuperado | Taxa regularização | Incremental vs controle ]]\n(!) alerta de meta\n[~ tendência por ciclo ~]\ncard \"Detalhe por dimensão\":\n  | Dimensão | Valor | Meta | Δ |\n  | linha | valor | meta | delta |\n[Exportar] [Configurar visão]\n```\n- **Quando usar:** visão gerencial agregada e comparativa; NÃO usar para trabalhar um registro individual.\n- **Componentes:** toolbar, select, card, chart, table, button.\n- **Instâncias:** Monitoramento · T-MON-01; Réguas · T-REG-03 (efetividade); Cobrança Qualificada · T-CQ-01 (carga por atendente — combinada com A3).\n\n### A2 — Lista / Fila com Filtros\nColeção pesquisável e filtrável com ações por linha e em lote; base para carteiras, contribuintes, casos, comunicações.\n\n```wireframe\n# Coleção\n[Buscar____] [Tributo v] [Status v] [Segmento v] [Ordenar por v]\n| Contribuinte | Tributo | Valor | Atraso | Status | Ação |\n| reg | reg | reg | reg | reg | [Abrir] |\n[Selecionar lote] [Ação em lote] [Exportar]\n```\n- **Quando usar:** navegar/triar muitos registros homogêneos; ações em lote.\n- **Componentes:** toolbar, input, select, table, checkbox, button.\n- **Instâncias:** Ingestão · T-ING-02 (carteira consolidada); Qualificação · T-QC-02 (prévia); Réguas · T-REG-02 (execução); Cobrança Qualificada · T-CQ-02 (minha fila); Monitoramento · T-MON-02 (comunicações).\n\n### A3 — Formulário de Configuração (parametrização + versionamento)\nFormulário de parâmetros com validação, fundamentação e ação de validar/publicar versão (RN-03, RNF-T-AUD-02).\n\n```wireframe\n# Configurar\ncard \"Parâmetros\":\n  [Valor mínimo____] [Tributo v]\n  [Tempo de atraso____] [Threshold de score____]\n  - exclusões selecionáveis\n(!) regra/validação\n[Versão____]\n[Validar] [Publicar versão] [Ver histórico]\n```\n- **Quando usar:** definir/versionar critérios, réguas, metas; NÃO usar para dados operacionais do dia a dia.\n- **Componentes:** toolbar, card, input, select, checkbox, banner, button.\n- **Instâncias:** Qualificação · T-QC-01 (critérios); Réguas · T-REG-01 (editor de régua); Monitoramento · T-MON-03 (metas/grupo de controle); Cobrança Qualificada · T-CQ-01 (regras de distribuição — combinada com A1).\n\n### A4 — Detalhe / Visão 360 do Registro (com abas)\nPainel de detalhe de um registro com resumo no topo e abas/seções de contexto; funde várias vistas em abas para minimizar telas.\n\n```wireframe\n# Detalhe do Contribuinte\ncard \"Resumo\":\n  [[ Documento | Segmento | Score ]]\n(!) sinalização coercitiva ativa\n## Abas: Débitos | Parcelamentos | Histórico | Interações\ncard \"Conteúdo da aba\":\n  | Coluna | Coluna | Coluna |\n  | linha | linha | linha |\n[Ação contextual] [Registrar interação]\n```\n- **Quando usar:** consolidar tudo de um único registro (contribuinte/dossiê/caso) em uma tela com abas.\n- **Componentes:** toolbar, card, tabs, table, list, banner, button.\n- **Instâncias:** Cobrança Qualificada · T-CQ-03 (dossiê/caso); Ingestão · T-ING-03 (visão única — somente leitura).\n\n### A5 — Editor de Fluxo / Linha do Tempo (canvas de etapas)\nEditor visual sequencial de etapas com offsets temporais e ramificações condicionais; representa a régua e seu escalonamento (RN-05).\n\n```wireframe\n# Editor de Régua\n[Nome da régua____] [Segmento alvo v]\ncard \"Etapas (linha do tempo)\":\n  [[ -5d e-mail | -2d e-mail | 0d SMS | +15d WhatsApp ]]\n  - condição: sem pagamento -> intensifica\n  - condição: regularizou -> encerra\n[Adicionar etapa] [Simular] [Ativar régua]\n```\n- **Quando usar:** desenhar sequência temporal/condicional de ações; NÃO usar para uma lista simples.\n- **Componentes:** toolbar, input, select, card, chip, button.\n- **Instâncias:** Réguas · T-REG-01.\n\n### A6 — Painel de Status de Integração / Execução\nPainel operacional de fontes/jobs: última sincronização, volume, erros, e ação de reprocessar (RNF-T-OBS-01, RNF-T-DISP-01).\n\n```wireframe\n# Integrações & Execução\n[[ Fontes OK | Última sync | Pendências ]]\n(!) falha em uma fonte\n| Fonte | Última sync | Registros | Status |\n| CCF | data | n | OK |\n[Reprocessar] [Ver log]\n```\n- **Quando usar:** operar/monitorar integrações e jobs de lote.\n- **Componentes:** toolbar, card, table, banner, button.\n- **Instâncias:** Ingestão · T-ING-01; Scoring · T-SC-01; Réguas · T-REG-02 (status de disparo).\n\n## Relacionado\n- [Índice do wiki](index.md)\n- [Visão do produto](visao.md)\n- [Modelo de dados (transversal)](modelo-dados.md)\n- [Requisitos transversais](requisitos-transversais.md)\n- [Vocabulário de componentes](componentes.md)\n"}, "wiki/componentes": {"title": "Componentes", "path": "refined/componentes.md", "content": "# Componentes\n\nO vocabulário de componentes é **genérico de front-end** — os componentes comuns que se repetem em qualquer UI (button, input, select, table, list, card, tabs, dialog, toolbar, chart…), **agnóstico de framework**. As telas (Cap. 1.2 de cada `Requisitos/<feature>.md`) referenciam o componente pelo **nome genérico** (campo **Componentes:**) e esboçam o layout no bloco ` ```wireframe `. Cada projeto **mapeia** esse vocabulário para a sua lib concreta — aqui o alvo provável é o catálogo de UI do **ServiceNow (Now Experience / componentes nativos)** *(inferência)*; Material Angular, MUI, shadcn/ui e HTML nativo são equivalências possíveis. Este arquivo é só a **referência canônica de vocabulário**.\n\n> Conjunto canônico de exemplo (um entre vários): Material Angular — https://material.angular.dev/components/categories.\n\n## Vocabulário genérico (por categoria)\n\n- **Entrada de dados:** input, select, checkbox, radio, slider, switch, datepicker, form-field.\n- **Navegação:** toolbar, tabs, menu, breadcrumb, stepper, sidenav, paginator.\n- **Layout:** card, grid, divider, expansion-panel, list.\n- **Ações & indicadores:** button, fab, chip, badge, progress, spinner, tooltip.\n- **Popups & modais:** dialog, bottom-sheet, snackbar, banner.\n- **Dados/tabela:** table, sort, chart.\n\n## DSL wireframe → componente genérico\n\n| Sintaxe | Nó | Componente (genérico) |\n|---|---|---|\n| `# Texto` | barra de título (largura total) | toolbar |\n| `## Texto` | subtítulo / cabeçalho de seção | — |\n| `[[ a \\| b \\| c ]]` | linha de N células iguais | grid / card row |\n| `card \"Título\":` + linhas indentadas | card/região; conteúdo = linhas filhas | card |\n| `[Rótulo____]` (≥2 underscores finais) | input | input / form-field |\n| `[~ legenda ~]` | placeholder de gráfico | chart |\n| `[Texto]` (1+ por linha, sem underscores) | botão(ões) | button |\n| `(!) texto` | alerta/banner | banner |\n| `- item` | item de lista | list |\n| `\\| a \\| b \\|` (linhas consecutivas) | tabela; 1ª linha = cabeçalho | table |\n| `texto` (livre) | label/parágrafo | — |\n| linha em branco | espaçamento vertical | — |\n\n> Render do navegador é **fat marker, só-layout** (sem texto legível): a **forma** indica o componente.\n\n## Relacionado\n- [Índice do wiki](index.md)\n- [Telas comuns (arquétipos)](telas-comuns.md)\n"}};

const PATH_TO_ID = {};
for (const [id, d] of Object.entries(DOCS)) { if (d.path) PATH_TO_ID[d.path] = id; }

function resolvePath(fromPath, href) {
  href = (href || '').split('#')[0].split('?')[0];
  if (!href || !fromPath) return null;
  const stack = fromPath.split('/').slice(0, -1);
  for (const p of href.split('/')) {
    if (p === '..') stack.pop();
    else if (p === '.' || p === '') continue;
    else stack.push(p);
  }
  return stack.join('/');
}

function rewireLinks(scope, doc) {
  scope.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (/^https?:/i.test(href)) return;
    if (!/\.md($|#|\?)/.test(href)) return;
    const tid = PATH_TO_ID[resolvePath(doc.path, href)];
    if (tid) {
      a.addEventListener('click', e => { e.preventDefault(); renderDoc(tid); });
    } else {
      a.classList.add('deadlink');
    }
  });
}

function renderBlueprint(id, doc) {
  const art = document.getElementById('article');
  document.getElementById('toc').innerHTML = '';
  let head = '<div class="crumb">Wiki</div><div class="docpath">' + doc.path + '</div>'
    + '<h1>' + (doc.title || 'Blueprint') + '</h1>'
    + '<p class="bp-hint">Cadeia de valor — clique numa feature para abrir a página.</p>';
  let chain = '';
  const etapas = doc.etapas || [];
  etapas.forEach((e, i) => {
    let feats = '';
    e.features.forEach(f => {
      let badges = '';
      if (f.ator) badges += '<span class="bp-badge ator">' + f.ator + '</span>';
      if (f.ia) badges += '<span class="bp-badge ia">IA</span>';
      const tid = PATH_TO_ID[resolvePath(doc.path, f.href)];
      feats += '<a class="bp-feat' + (tid ? '' : ' deadlink') + '"'
        + (tid ? ' data-bpid="' + tid + '"' : '') + '>'
        + '<span class="bp-nome">' + f.nome + '</span>' + badges
        + '<span class="bp-resumo">' + f.resumo + '</span></a>';
    });
    chain += '<div class="bp-stage"><div class="bp-stage-h">' + e.etapa + '</div>' + feats + '</div>';
    if (i < etapas.length - 1) chain += '<div class="bp-arrow">&rarr;</div>';
  });
  art.innerHTML = head + '<div class="bp-chain">' + chain + '</div>';
  art.querySelectorAll('.bp-feat[data-bpid]').forEach(a =>
    a.addEventListener('click', () => renderDoc(a.dataset.bpid)));
  document.querySelector('main').scrollTop = 0;
  location.hash = encodeURIComponent(id);
}

/* ---------- DBML → Mermaid erDiagram ---------- */
function dbmlToMermaid(dbml) {
  const lines = dbml.split('\n');
  const tables = []; const refs = [];
  let cur = null; let depth = 0; let inIndexes = false;
  const clean = t => (t || '').split('(')[0].replace(/[^A-Za-z0-9_]/g, '') || 'x';
  for (let raw of lines) {
    const line = raw.replace(/\/\/.*$/, '').trim();
    if (!line) continue;
    const mt = line.match(/^Table\s+"?([A-Za-z0-9_]+)"?/);
    if (mt && !cur) { cur = { name: mt[1], cols: [] }; depth = 0; inIndexes = false;
                      if (line.includes('{')) depth = 1; continue; }
    if (!cur) continue;
    if (/^indexes\s*\{/.test(line)) { inIndexes = true; depth += 1; continue; }
    const opens = (line.match(/\{/g) || []).length;
    const closes = (line.match(/\}/g) || []).length;
    if (inIndexes) { depth += opens - closes; if (depth <= 1) inIndexes = false; continue; }
    depth += opens - closes;
    if (depth <= 0) { tables.push(cur); cur = null; continue; }
    const cm = line.match(/^"?([A-Za-z0-9_]+)"?\s+([A-Za-z0-9_]+(?:\([^)]*\))?)(.*)$/);
    if (cm) {
      const cname = cm[1], ctype = clean(cm[2]), rest = cm[3] || '';
      let key = '';
      if (/\[pk\]|primary key|\bpk\b/i.test(rest)) key = 'PK';
      const rf = rest.match(/ref:\s*[<>-]\s*"?([A-Za-z0-9_]+)"?\.\s*"?([A-Za-z0-9_]+)"?/);
      if (rf) { key = key ? 'PK' : 'FK'; refs.push([cur.name, rf[1], cname]); }
      cur.cols.push({ name: cname, type: ctype, key });
    }
  }
  if (cur) tables.push(cur);
  if (!tables.length) return null;
  let out = 'erDiagram\n';
  for (const t of tables) {
    out += '  ' + t.name + ' {\n';
    for (const c of t.cols.slice(0, 30))
      out += '    ' + c.type + ' ' + c.name + (c.key ? ' ' + c.key : '') + '\n';
    out += '  }\n';
  }
  const seen = new Set();
  for (const [from, to, col] of refs) {
    const k = from + '>' + to;
    if (seen.has(k) || from === to) continue;
    seen.add(k);
    if (tables.find(t => t.name === to))
      out += '  ' + from + ' }o--|| ' + to + ' : "' + col + '"\n';
  }
  return out;
}

/* ---------- Wireframe fat-marker (parser + render, layout + texto) ---------- */
function parseInline(text) {
  const re = /\[~[^\]]*~\]|\[[^\]]*?_{2,}\]|\[[^\]]+\]|[^\[]+/g;
  const out = []; let m;
  while ((m = re.exec(text)) !== null) {
    const t = m[0].trim(); if (!t) continue;
    if (/^\[~.*~\]$/.test(t)) out.push({t:'chart', s:t.replace(/^\[~|~\]$/g,'').trim()});
    else if (/^\[.*_{2,}\]$/.test(t)) out.push({t:'input', s:t.replace(/[\[\]]/g,'').replace(/_+/g,'').trim()});
    else if (/^\[.+\]$/.test(t)) out.push({t:'button', s:t.slice(1,-1).trim()});
    else out.push({t:'label', s:t});
  }
  return out;
}
function parseWireframe(src) {
  const lines = src.replace(/\t/g,'  ').split('\n');
  let i = 0;
  function indentOf(s){ return s.match(/^ */)[0].length; }
  function block(minIndent) {
    const nodes = [];
    while (i < lines.length) {
      const raw = lines[i];
      if (raw.trim() === '') { i++; continue; }
      const ind = indentOf(raw);
      if (ind < minIndent) break;
      const s = raw.trim();
      let mm;
      if ((mm = s.match(/^card\s+"?(.*?)"?:$/))) { i++; const kids = block(ind+1); nodes.push({t:'card', s:mm[1], kids}); continue; }
      if (s[0] === '|') {
        const rows = [];
        while (i < lines.length && lines[i].trim()[0] === '|') {
          const cells = lines[i].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
          if (!cells.every(c=>/^[-:]+$/.test(c))) rows.push(cells);
          i++;
        }
        nodes.push({t:'table', rows}); continue;
      }
      if (s.startsWith('- ')) {
        const items = [];
        while (i < lines.length && lines[i].trim().startsWith('- ')) { items.push(lines[i].trim().slice(2)); i++; }
        nodes.push({t:'list', items}); continue;
      }
      i++;
      if (s.startsWith('# ')) nodes.push({t:'title', s:s.slice(2)});
      else if (s.startsWith('## ')) nodes.push({t:'sub', s:s.slice(3)});
      else if ((mm = s.match(/^\[\[(.+)\]\]$/))) nodes.push({t:'row', cells: mm[1].split('|').map(c=>parseInline(c.trim()))});
      else if (s.startsWith('(!)')) nodes.push({t:'alert', s:s.slice(3).trim()});
      else nodes.push({t:'line', items: parseInline(s)});
    }
    return nodes;
  }
  return block(0);
}
const WF = {W:560, PAD:12, GAP:8, TITLE:34, SUB:22, ROW:54, LINE:34, CHART:88, ALERT:32, LI:22, TR:28, CH:26, CPAD:9};
function wfMeasure(nodes) { let h=0; for (const n of nodes) h += wfH(n) + WF.GAP; return h; }
function wfH(n) {
  switch(n.t){
    case 'title': return WF.TITLE; case 'sub': return WF.SUB; case 'row': return WF.ROW;
    case 'alert': return WF.ALERT; case 'list': return Math.max(1,n.items.length)*WF.LI;
    case 'table': return Math.max(1,n.rows.length)*WF.TR;
    case 'line': return n.items.some(x=>x.t==='chart') ? WF.CHART : WF.LINE;
    case 'card': return WF.CH + WF.CPAD*2 + wfMeasure(n.kids);
    default: return WF.LINE;
  }
}
function renderWireframe(src) {
  const SVG='http://www.w3.org/2000/svg';
  const nodes = parseWireframe(src);
  const W = WF.W, total = wfMeasure(nodes) + WF.PAD*2;
  const svg = document.createElementNS(SVG,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+total);
  svg.setAttribute('width','100%'); svg.setAttribute('style','max-width:'+W+'px;height:auto');
  const rc = rough.svg(svg);
  const FM = {roughness:2.1, strokeWidth:2.2, stroke:'#2a2a2a'};
  const g = el => svg.appendChild(el);
  const FONT = '"Comic Sans MS","Segoe Print","Bradley Hand",Chalkboard,cursive';
  function txt(x,y,s,maxw,size,anchor,weight){
    if(!s) return;
    const fs = size||13.5;
    const cap = Math.max(1, Math.floor(maxw/(fs*0.52)));
    let str = String(s); if (str.length>cap) str = str.slice(0,Math.max(1,cap-1))+'…';
    const t = document.createElementNS(SVG,'text');
    t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('font-family',FONT);
    t.setAttribute('font-size',fs); t.setAttribute('fill','#222');
    t.setAttribute('dominant-baseline','middle');
    if (anchor) t.setAttribute('text-anchor',anchor);
    if (weight) t.setAttribute('font-weight','700');
    t.textContent = str; g(t);
  }
  function drawNodes(nodes, x, w, y) { for (const n of nodes) { y = drawNode(n,x,w,y) + WF.GAP; } return y; }
  function drawNode(n,x,w,y){
    const h = wfH(n);
    if (n.t==='title'){ g(rc.rectangle(x,y,w,WF.TITLE-4,{...FM,fill:'#dadaea',fillStyle:'hachure',hachureGap:6})); txt(x+12,y+(WF.TITLE-4)/2,n.s,w-24,15,null,true); }
    else if (n.t==='sub'){ txt(x+2,y+WF.SUB/2,n.s,w,13,null,true); }
    else if (n.t==='alert'){ g(rc.rectangle(x,y,w,WF.ALERT-4,{...FM,fill:'#f6dada',fillStyle:'hachure',hachureGap:7})); g(rc.line(x+3,y+3,x+3,y+WF.ALERT-7,{stroke:'#b03030',strokeWidth:5,roughness:1})); txt(x+14,y+(WF.ALERT-4)/2,'⚠ '+(n.s||''),w-22,12.5); }
    else if (n.t==='list'){ let yy=y; for(const it of n.items){ g(rc.circle(x+6,yy+WF.LI/2,5,FM)); txt(x+16,yy+WF.LI/2,it,w-22,13); yy+=WF.LI; } }
    else if (n.t==='table'){ const R=n.rows.length||1, C=(n.rows[0]||['','']).length||2, cw=w/C; g(rc.rectangle(x,y,w,R*WF.TR,FM)); for(let r=1;r<R;r++) g(rc.line(x,y+r*WF.TR,x+w,y+r*WF.TR,{roughness:1.6,strokeWidth:1.4,stroke:'#666'})); for(let c=1;c<C;c++) g(rc.line(x+c*cw,y,x+c*cw,y+R*WF.TR,{roughness:1.6,strokeWidth:1.4,stroke:'#666'})); for(let r=0;r<R;r++) for(let c=0;c<(n.rows[r]||[]).length;c++) txt(x+c*cw+7,y+r*WF.TR+WF.TR/2,n.rows[r][c],cw-12,12.5,null,r===0); }
    else if (n.t==='row'){ const N=n.cells.length, cw=(w-(N-1)*WF.GAP)/N; for(let c=0;c<N;c++){ const cx=x+c*(cw+WF.GAP); g(rc.rectangle(cx,y,cw,WF.ROW-4,{...FM,strokeWidth:2})); drawInline(n.cells[c],cx+8,cw-16,y+(WF.ROW-4)/2,true); } }
    else if (n.t==='line'){ if(n.items.some(it=>it.t==='chart')) drawChart(x,y,w,n.items.find(it=>it.t==='chart').s); else drawInline(n.items,x,w,y+WF.LINE/2,false); }
    else if (n.t==='card'){ g(rc.rectangle(x,y,w,h,{...FM,strokeWidth:2})); txt(x+12,y+WF.CH/2,n.s,w-24,13.5,null,true); drawNodes(n.kids,x+WF.CPAD,w-WF.CPAD*2,y+WF.CH+WF.CPAD); }
    return y+h;
  }
  function drawChart(x,y,w,cap){ const hh=WF.CHART-22; g(rc.rectangle(x,y,w,hh,FM)); g(rc.line(x+12,y+hh-10,x+w-10,y+hh-10,{roughness:1.4,strokeWidth:2,stroke:'#666'})); g(rc.line(x+12,y+8,x+12,y+hh-10,{roughness:1.4,strokeWidth:2,stroke:'#666'})); const bw=(w-44)/4; for(let b=0;b<4;b++){ const bh=12+((b*37)%(hh-26)); g(rc.rectangle(x+20+b*bw,y+hh-10-bh,bw*0.6,bh,{...FM,strokeWidth:1.6,fill:'#cfcfe6',fillStyle:'hachure',hachureGap:4})); } txt(x+w/2,y+hh+10,cap||'gráfico',w-16,12,'middle'); }
  function drawInline(items,x,w,cy,center){
    const onlyLabels = items.every(it=>it.t==='label');
    if (center && onlyLabels){ txt(x+w/2,cy,items.map(it=>it.s).join(' '),w,13.5,'middle'); return; }
    let cur=x;
    for (const it of items){
      const avail = x+w-cur;
      if (it.t==='button'){ const bw=Math.min(it.s.length*8+22,Math.max(40,avail)); g(rc.rectangle(cur,cy-13,bw,26,{...FM,strokeWidth:2,fill:'#eef0f6',fillStyle:'solid'})); txt(cur+bw/2,cy,it.s,bw-12,12.5,'middle'); cur+=bw+8; }
      else if (it.t==='input'){ const iw=Math.min(Math.max(it.s.length*8+30,90),avail); g(rc.rectangle(cur,cy-13,iw,26,{roughness:1.5,strokeWidth:2,stroke:'#444'})); txt(cur+7,cy,it.s,iw-12,12.5); cur+=iw+8; }
      else if (it.t==='chart'){ /* tratado em drawChart */ }
      else { txt(cur,cy,it.s,avail,13); cur += Math.min(it.s.length*7+8, avail); }
      if (cur > x+w-6) break;
    }
  }
  drawNodes(nodes, WF.PAD, W-WF.PAD*2, WF.PAD);
  return svg;
}
let mermaidSeq = 0;
function renderDoc(id) {
  const doc = DOCS[id];
  const art = document.getElementById('article');
  if (!doc) { art.innerHTML = '<div class="empty">Documento não encontrado.</div>'; return; }
  document.querySelectorAll('.doc').forEach(d =>
    d.classList.toggle('active', d.dataset.id === id));

  if (doc.kind === 'blueprint') { renderBlueprint(id, doc); return; }

  let html = marked.parse(doc.content);
  const wrap = document.createElement('div');
  wrap.innerHTML = html;

  // converter blocos de código mermaid / dbml / wireframe
  wrap.querySelectorAll('pre > code').forEach(code => {
    const cls = code.className || '';
    const txt = code.textContent;
    if (/language-wireframe/.test(cls)) {
      const div = document.createElement('div');
      div.className = 'wireframe';
      div.dataset.src = txt;
      code.parentElement.replaceWith(div);
      return;
    }
    let diagram = null;
    if (/language-mermaid/.test(cls)) diagram = txt;
    else if (/language-dbml/.test(cls)) diagram = dbmlToMermaid(txt);
    if (diagram) {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.dataset.src = diagram;
      code.parentElement.replaceWith(div);
    }
  });

  const head = '<div class="crumb">' + (id.split('/').slice(0, -1).join(' / ') || '') +
    '</div><div class="docpath">' + doc.path + '</div>';
  art.innerHTML = head;
  art.appendChild(wrap);

  rewireLinks(wrap, doc);

  // renderizar mermaid
  wrap.querySelectorAll('.mermaid').forEach(async div => {
    const src = div.dataset.src;
    const gid = 'mmd' + (mermaidSeq++);
    try {
      const { svg } = await mermaid.render(gid, src);
      div.innerHTML = svg;
    } catch (e) {
      div.innerHTML = '<div class="mermaid-err">⚠ Não foi possível renderizar o diagrama</div>' +
        '<pre><code>' + src.replace(/</g, '&lt;') + '</code></pre>';
    }
  });

  // renderizar wireframes (fat marker, só layout, sem texto)
  wrap.querySelectorAll('.wireframe').forEach(div => {
    try { div.replaceChildren(renderWireframe(div.dataset.src)); }
    catch (e) { div.innerHTML = '<div class="mermaid-err">⚠ wireframe inválido</div>'; }
  });

  buildToc(wrap);
  highlightSearch();
  document.querySelector('main').scrollTop = 0;
  location.hash = encodeURIComponent(id);
}

/* ---------- TOC ---------- */
function buildToc(scope) {
  const toc = document.getElementById('toc');
  const heads = [...scope.querySelectorAll('h1, h2, h3')];
  if (heads.length < 2) { toc.innerHTML = ''; return; }
  let html = '<h4>Neste documento</h4>';
  heads.forEach((h, i) => {
    const slug = 'h_' + i;
    h.id = slug;
    const lvl = h.tagName === 'H3' ? ' lvl3' : '';
    if (h.tagName === 'H1') return;
    html += '<a class="toclink' + lvl + '" href="#" data-slug="' + slug + '">' +
      h.textContent + '</a>';
  });
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => a.onclick = e => {
    e.preventDefault();
    document.getElementById(a.dataset.slug)
      .scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ---------- Sidebar ---------- */
function buildTree(nodes, container) {
  for (const n of nodes) {
    if (n.type === 'group') {
      const g = document.createElement('div');
      g.className = 'node-group';
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="caret">▼</span><span>' + n.label + '</span>';
      const kids = document.createElement('div');
      kids.className = 'children';
      row.onclick = () => g.classList.toggle('collapsed');
      g.appendChild(row); g.appendChild(kids);
      container.appendChild(g);
      buildTree(n.children || [], kids);
    } else {
      const d = document.createElement('a');
      d.className = 'doc';
      d.dataset.id = n.id;
      d.textContent = n.label;
      d.title = (DOCS[n.id] && DOCS[n.id].title) || n.label;
      d.onclick = () => renderDoc(n.id);
      container.appendChild(d);
    }
  }
}

/* ---------- Busca ---------- */
let searchTerm = '';
function applySearch() {
  const q = searchTerm.toLowerCase().trim();
  const docEls = [...document.querySelectorAll('.doc')];
  if (!q) {
    docEls.forEach(d => { d.classList.remove('hidden', 'hit'); });
    document.querySelectorAll('.node-group').forEach(g => g.classList.remove('hidden'));
    return;
  }
  let hits = 0;
  docEls.forEach(d => {
    const id = d.dataset.id;
    const doc = DOCS[id];
    const inName = d.textContent.toLowerCase().includes(q) ||
      (doc && doc.title.toLowerCase().includes(q));
    const inBody = doc && doc.content.toLowerCase().includes(q);
    const match = inName || inBody;
    d.classList.toggle('hidden', !match);
    d.classList.toggle('hit', !!(inBody && match));
    if (match) hits++;
  });
  // esconder grupos sem filhos visíveis
  document.querySelectorAll('.node-group').forEach(g => {
    const anyVisible = g.querySelector('.doc:not(.hidden)');
    g.classList.toggle('hidden', !anyVisible);
    if (anyVisible) g.classList.remove('collapsed');
  });
}
function highlightSearch() {
  const q = searchTerm.trim();
  if (q.length < 2) return;
  const art = document.getElementById('article');
  const needle = q.toLowerCase();
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');
  const walk = node => {
    if (node.nodeType === 3) {
      if (node.nodeValue.toLowerCase().includes(needle)) {
        const rx = new RegExp('(' + esc + ')', 'gi');
        const span = document.createElement('span');
        span.innerHTML = escapeHtml(node.nodeValue).replace(rx, '<mark>$1</mark>');
        node.replaceWith(span);
      }
    } else if (node.nodeType === 1 &&
               !['PRE', 'CODE', 'SCRIPT', 'STYLE'].includes(node.tagName) &&
               !node.classList.contains('mermaid')) {
      [...node.childNodes].forEach(walk);
    }
  };
  [...art.childNodes].forEach(walk);
}

/* ---------- Init ---------- */
buildTree(TREE, document.getElementById('sidebar'));

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  applySearch();
});
document.getElementById('theme').onclick = () => {
  document.body.classList.toggle('dark');
  const dark = document.body.classList.contains('dark');
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral',
                       securityLevel: 'loose' });
  try { localStorage.setItem('nav-theme', dark ? 'dark' : 'light'); } catch (e) {}
  const cur = location.hash.slice(1);
  if (cur) renderDoc(decodeURIComponent(cur));
};
let allExpanded = true;
document.getElementById('expand').onclick = () => {
  allExpanded = !allExpanded;
  document.querySelectorAll('.node-group').forEach(g =>
    g.classList.toggle('collapsed', !allExpanded));
  document.getElementById('expand').textContent =
    allExpanded ? 'Recolher tudo' : 'Expandir tudo';
};
try {
  if (localStorage.getItem('nav-theme') === 'dark') {
    document.body.classList.add('dark');
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
  }
} catch (e) {}

// abrir doc do hash, ou o primeiro
const initial = location.hash.slice(1);
if (initial && DOCS[decodeURIComponent(initial)]) renderDoc(decodeURIComponent(initial));
else { const first = Object.keys(DOCS)[0]; if (first) renderDoc(first); }
</script>
