<head>

<title>Navegador — 2.6-cobranca/refined</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

<style>
  :root {
    --bg: #F9F9F9; --panel: #FFFFFF; --ink: #272727; --muted: #6B6E7A;
    --line: #D8DAE0; --accent: #0C1BA8; --accent-soft: #EEF2FE;
    --sidebar-w: 312px; --toc-w: 224px;
    --code-bg: #F0F2F7; --hl: #FFF3CD;
  }
  body.dark {
    --bg: #16161c; --panel: #20202b; --ink: #e8e8ee; --muted: #9a9aa8;
    --line: #34343f; --accent: #9DB0F5; --accent-soft: #262b46;
    --code-bg: #26262f; --hl: #3a3420;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.6 'Outfit', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 54px 1fr; height: 100vh; overflow: hidden;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  header .spacer { flex: 1; }
  #search {
    width: 320px; max-width: 40vw; padding: 7px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px;
  }
  #search:focus { outline: 2px solid var(--accent-soft); }
  .btn {
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }

  aside {
    border-right: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 10px 8px 40px;
  }
  .node-group > .row {
    font-weight: 600; cursor: pointer; user-select: none;
    padding: 5px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: center;
  }
  .node-group > .row:hover { background: var(--accent-soft); }
  .node-group .caret { color: var(--muted); transition: transform .15s; font-size: 11px; }
  .node-group.collapsed .caret { transform: rotate(-90deg); }
  .node-group.collapsed > .children { display: none; }
  .children { margin-left: 13px; border-left: 1px solid var(--line); padding-left: 6px; }
  .doc {
    cursor: pointer; padding: 4px 8px; border-radius: 6px; color: var(--ink);
    font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .doc:hover { background: var(--accent-soft); }
  .doc.active { background: var(--accent); color: #fff; }
  .doc.hit { box-shadow: inset 2px 0 0 var(--accent); }
  .hidden { display: none !important; }

  main { overflow-y: auto; position: relative; }
  .layout { display: grid; grid-template-columns: 1fr var(--toc-w);
            max-width: 1180px; margin: 0 auto; }
  article { padding: 30px 38px 120px; min-width: 0; }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .docpath { color: var(--muted); font-size: 12px; font-family: 'Roboto Mono', ui-monospace, monospace; }

  nav.toc {
    padding: 30px 16px; font-size: 12.5px; position: sticky; top: 0;
    align-self: start; max-height: 100vh; overflow-y: auto;
  }
  nav.toc h4 { margin: 0 0 8px; color: var(--muted); text-transform: uppercase;
               letter-spacing: .6px; font-size: 11px; }
  nav.toc a { display: block; color: var(--muted); text-decoration: none;
              padding: 2px 0; border-left: 2px solid transparent; padding-left: 8px; }
  nav.toc a:hover { color: var(--accent); }
  nav.toc a.lvl3 { padding-left: 18px; font-size: 12px; }
  nav.toc a.active { color: var(--accent); border-left-color: var(--accent); }

  article h1 { font-size: 26px; letter-spacing: -.4px; margin: .2em 0 .5em; }
  article h2 { font-size: 20px; margin-top: 1.6em; padding-bottom: 4px;
               border-bottom: 1px solid var(--line); }
  article h3 { font-size: 16px; margin-top: 1.4em; }
  article h4 { font-size: 14px; color: var(--muted); }
  article code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
                 font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 13px; }
  article pre { background: var(--code-bg); padding: 13px 15px; border-radius: 9px;
                overflow-x: auto; border: 1px solid var(--line); }
  article pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
  article table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 13px; }
  article th, article td { border: 1px solid var(--line); padding: 6px 9px;
                           text-align: left; vertical-align: top; }
  article th { background: var(--accent-soft); }
  article tr:nth-child(even) td { background: var(--code-bg); }
  article blockquote { margin: 1em 0; padding: 6px 14px; border-left: 3px solid var(--accent);
                       background: var(--code-bg); border-radius: 0 8px 8px 0; color: var(--muted); }
  article a { color: var(--accent); }
  article hr { border: none; border-top: 1px solid var(--line); margin: 1.8em 0; }
  .mermaid { background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
             padding: 14px; margin: 1em 0; text-align: center; overflow-x: auto; }
  .mermaid-err { color: #b04a3a; font-size: 12px; }
  .wireframe { background: #fff; border: 1px solid var(--line); border-radius: 9px;
               padding: 10px; margin: 1em 0; overflow-x: auto; }
  .wireframe svg { display: block; }
  body.dark .wireframe { background: #f7f7fa; }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }

  .empty { color: var(--muted); padding: 60px 38px; text-align: center; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 20px;
           background: var(--accent-soft); color: var(--accent); margin-left: 6px;
           vertical-align: middle; }
  .searchcount { font-size: 12px; color: var(--muted); padding: 4px 10px; }
  .bp-hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .bp-chain { display: flex; overflow-x: auto; padding: 4px 0 24px; align-items: stretch; }
  .bp-stage { min-width: 230px; flex: 1; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; }
  .bp-stage-h { background: var(--accent-soft); color: var(--accent); font-weight: 700;
    padding: 9px 12px; border-radius: 10px 10px 0 0; border-bottom: 1px solid var(--line); }
  .bp-arrow { display: flex; align-items: center; color: var(--muted); font-size: 20px; padding: 0 3px; }
  .bp-feat { display: block; padding: 9px 12px; border-bottom: 1px solid var(--line);
    color: var(--ink); text-decoration: none; cursor: pointer; }
  .bp-feat:last-child { border-bottom: none; }
  .bp-feat:hover { background: var(--accent-soft); }
  .bp-nome { font-weight: 600; }
  .bp-resumo { display: block; color: var(--muted); font-size: 12.5px; }
  .bp-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 20px; margin-left: 6px; }
  .bp-badge.ator { background: var(--accent-soft); color: var(--accent); }
  .bp-badge.ia { background: var(--accent); color: #fff; }
  a.deadlink { color: var(--muted) !important; text-decoration: line-through; cursor: default; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo svg { height: 22px; width: auto; display: block; }
  .brand-txt { font-weight: 700; letter-spacing: -.2px; }
  body.dark .brand-logo svg { filter: invert(1) brightness(1.7); }
</style>
</head>

<script>
const DOCS = {"wiki/overview": {"title": "Wiki Cobrança Inteligente", "path": "refined/overview.md", "content": "# Wiki Cobrança Inteligente\n\nA **Cobrança Inteligente** (P2.6 — *Sistema de Cobrança Implantado*, SEFAZ-MT / Profisco II) é a plataforma única de gestão da cobrança administrativa do crédito tributário. Este wiki destila o conhecimento de produto — visão, vocabulário, regras, telas e requisitos — necessário para especificar e prototipar a solução, que substitui a operação fragmentada atual (CCF, MPI, IPVA, ITCD, SNE, planilhas) por consolidação, qualificação parametrizável, réguas automatizadas, dossiê e mensuração causal.\n\nO conteúdo foi destilado das fontes curadas em `trusted/` da Receita Digital: o diagnóstico e o desenho da solução de cobrança, o levantamento de necessidades 2.6 (necessidades N1.x e N2.x), o material de priorização (Executivo Soluções, Planning Poker) e o acervo metodológico EloGroup de cobrança inteligente (réguas, dossiê, rating). A plataforma-alvo de implementação é o ServiceNow *(inferência do modelo de execução)*.\n\nO wiki segue o modelo wikiLLM (spec-kit v2): a **Camada de Intenção** num único documento (a [Visão](visao.md), com Produto/Personas/Jobs, Glossário e Regras & Métricas) e a **Camada de Requisitos** com um documento por feature em [Requisitos/](Requisitos/), cada um com Telas & Fluxos (Mermaid + wireframes), Requisitos & Cenários e Dados. O comum vive uma vez nos **transversais** ([modelo-dados](modelo-dados.md), [requisitos-transversais](requisitos-transversais.md), [telas-comuns](telas-comuns.md)) e cada feature os referencia. O [blueprint](blueprint.md) organiza as features na cadeia de valor.\n\n**Para começar:** entenda o produto pela [Visão](visao.md); para uma funcionalidade concreta, vá ao doc da feature em [Requisitos/](Requisitos/); para a evolução do wiki, veja o [log](log.md).\n\n## Mapa do wiki\n- [Índice completo](index.md)\n- [Log de evolução](log.md)\n- Camada de Intenção: [Visão](visao.md)\n- Camada de Requisitos: [Requisitos/](Requisitos/)\n- Transversais: [modelo-dados](modelo-dados.md) · [requisitos-transversais](requisitos-transversais.md) · [telas-comuns](telas-comuns.md)\n- Componentes (vocabulário genérico): [componentes.md](componentes.md)\n- Blueprint: [blueprint.md](blueprint.md)\n\n## Relacionado\n- [Índice do wiki](index.md)\n"}, "wiki/index": {"title": "Índice do Wiki", "path": "refined/index.md", "content": "# Índice do Wiki\n\nCatálogo de todas as páginas do wiki, por categoria. Ler PRIMEIRO ao responder uma query.\n\n## Visão geral\n- [overview](overview.md) — síntese e mapa do wiki\n- [blueprint](blueprint.md) — visão geral da solução (cadeia de valor)\n\n## Camada de Intenção\n- [Visão](visao.md) — produto/personas/jobs, glossário, regras & métricas (3 capítulos)\n\n## Camada de Requisitos\n- [Ingestão e Carteira Consolidada](Requisitos/ingestao-carteira.md) — eixo: processo — consolidação de débitos de múltiplas fontes e visão única do contribuinte\n- [Qualificação e Parametrização da Carteira](Requisitos/qualificacao-carteira.md) — eixo: processo — critérios versionados, segmentação e grupo de controle\n- [Scoring de Liquidez (Priorização Inteligente)](Requisitos/scoring-liquidez.md) — eixo: processo — integração e uso do score da UFMT (IA)\n- [Réguas de Cobrança Massificada Multicanal](Requisitos/reguas-cobranca.md) — eixo: processo — réguas automatizadas, escalonamento e canais\n- [Cobrança Qualificada — Operação do Atendente](Requisitos/cobranca-qualificada.md) — eixo: processo — distribuição, dossiê e interações\n- [Monitoramento, KPIs e Grupo de Controle](Requisitos/monitoramento-kpis.md) — eixo: processo — KPIs, origem da regularização, efeito incremental\n\n## Transversais\n- [Modelo de dados](modelo-dados.md) — modelo de dados canônico (erDiagram)\n- [Requisitos transversais](requisitos-transversais.md) — RNF-T-* / RF-T-*\n- [Telas comuns](telas-comuns.md) — arquétipos de tela A1–A6\n- [componentes](componentes.md) — vocabulário genérico de componentes de front (ponteiro fino)\n\n## Fontes\n- trusted/transversal/execucao (docs \"Cobran\"/\"2.6\") · trusted/transversal/gestao-projeto (docs \"2.6\"/\"Cobran\") · trusted/ref-spec-prioridade (Executivo Soluções, Planning_Poker_dados)\n"}, "wiki/log": {"title": "Log do Wiki", "path": "refined/log.md", "content": "# Log do Wiki\n\nHistórico append-only. Cada entrada: `## [YYYY-MM-DD] <op> | <título>`.\nOperações: ingest · query · lint · migration · scaffold.\nConsulta rápida: `grep \"^## \\[\" log.md | tail -5`\n\n## [2026-06-15] scaffold+ingest | wiki Cobrança Inteligente criado e preenchido\n- Estrutura FLAT criada em refined/ (index, log, overview, blueprint, visao, componentes, 3 transversais, Requisitos/).\n- Visão escrita (3 capítulos): 4 personas (Coordenador, Atendente; Contribuinte e UFMT fora do escopo), 7 JTBD, 12 RN + 1 RN-AI (score UFMT), NSM = crédito recuperado atribuível à cobrança (líquido do grupo de controle) + 2 guard-rails.\n- Transversais: modelo-dados canônico (12 entidades + erDiagram), requisitos-transversais (RNF-T-SEG/AUD/PERF/DISP/OBS/CONF + RF-T-01..04), telas-comuns (arquétipos A1–A6).\n- 6 features (todas eixo=processo) derivadas dos 5 épicos + 3ª oportunidade priorizada: ingestao-carteira, qualificacao-carteira, scoring-liquidez, reguas-cobranca, cobranca-qualificada, monitoramento-kpis.\n- Blueprint em 5 etapas de cadeia de valor.\n- Fontes: trusted execucao/gestao-projeto (docs Cobran/2.6) + ref-spec-prioridade (Executivo Soluções §2.6, Planning_Poker Produto 6 US1-14).\n- Lacunas marcadas (⚠): escopo de coerção, desempate massificada/qualificada, frequência de ciclo, plataforma ServiceNow, janela de atribuição, contrato técnico do score UFMT.\n\n## [2026-06-15] lint+audit | Loop de validação 1 — auditoria e correção da spec\n- spec-lint executado: links relativos (0 quebrados), órfãs (0), 3 capítulos por feature (OK nas 6), Mermaid bem-formado (13 blocos + 6 fluxos + erDiagram), IDs RN/RN-AI/JTBD/RF-T/RNF-T resolvem 100%, arquétipo por tela (15/15).\n- Correções aplicadas (acionáveis):\n  1. telas-comuns A1: referência dangling **T-CQ-04** corrigida para **T-CQ-01** (carga por atendente); T-CQ-01 também adicionada às Instâncias de A3 (declara A3+A1).\n  2. blueprint.md ganhou seção `## Relacionado` (estava ausente).\n  3. **JTBD-07** (intraciclo → não reabordar) estava órfão de tração: adicionado às §2.1 de ingestao-carteira e cobranca-qualificada.\n  4. reguas-cobranca: documentados os **5 segmentos de régua priorizados** (Parcelamentos Inadimplentes, IPVA, ITCD, ICMS Normal, ICMS ST) do Executivo Soluções §2.6 — antes ausentes.\n- Navigator regenerado (15 docs, 146 KB).\n- Verificação de fatos contra fonte: ~1,8mi contribuintes, 30,9%/22,5% quitação, ~500 grupo de controle, 5,15% retorno réguas, score UFMT a partir de maio/26, \"qualificada ≈ ativa\", 3 lacunas estratégicas (PGE, coerção, Big Data) — todos confirmados, sem fabricação.\n- Pendências que dependem do cliente (não corrigíveis na spec; ⚠ mantidos): escopo de instrumentos coercitivos (sinalizar vs. operar); regra de desempate massificada↔qualificada (RN-04); periodicidade exata do ciclo intraciclo; confirmação da plataforma ServiceNow; janela de atribuição causal (30d assumido) + modelo por canal; contrato técnico/escala do score UFMT (API vs. arquivo) e data efetiva; capacidade máxima por atendente; níveis do dossiê (grupo econômico/situação patrimonial) e fontes.\n\n## [2026-06-16] priorização | passe de priorização Planning Poker P6 + Executivo §2.6\n- Backlog canônico filtrado (Produto 6): 14 histórias, todas ID_Projeto 1; 100% no escopo, confirmadas pelo Executivo §2.6 (5 épicos + 5 réguas + habilitadores UFMT/Big Data).\n- Cobertura verificada: 6 features mapeiam as 14 histórias (US1/5/12→ingestao; US3/11/14→qualificacao+scoring; US2/4/13→reguas; US6/7→cobranca-qualificada; US8/9/10/11→monitoramento). Nada desescopado; nada faltando.\n- Protótipo reordenado para a ordem dos épicos do backlog (Identificação→Qualificação→Massificada→Qualificada→Monitoramento); telas renumeradas 01–12; landing = Integrações; prototipo.html reconstruído.\n- Navigator regenerado. PRIORIZACAO.md criado na raiz do produto.\n\n## [2026-06-16] lint | Loop 1/3 escopo — rastreabilidade US1..US14 completada\n- Verificação de aderência ao Executivo §2.6 (5 épicos, 12 oportunidades, 5 réguas, 3 habilitadores) e ao backlog Planning Poker (14 histórias, ID_Projeto 1).\n- Veredito: aderente. Nada FALTANDO, nada SOBRANDO. 6 features = 5 épicos (Qualificação desdobrada por IA); 12 telas no protótipo (01–12) na ordem dos épicos.\n- Correção: adicionadas tags de rastreabilidade US1/US2/US3/US5/US6/US12 nos RFs correspondentes (ingestao-carteira RF-01/03/04/06, qualificacao-carteira RF-01/02, cobranca-qualificada RF-01). Conteúdo já existia; só faltava o tag US explícito. Escopo inalterado.\n"}, "wiki/visao": {"title": "Visão — Cobrança Inteligente", "path": "refined/visao.md", "content": "# Visão — Cobrança Inteligente\n> Camada de Intenção · Spec-Driven Development\n> Pergunta-mãe: *Quem somos, para quem, com que vocabulário e sob quais leis?*\n\nDocumento canônico da Camada de Intenção do produto **Cobrança Inteligente** (P2.6 — *Sistema de Cobrança Implantado*, SEFAZ-MT / Profisco II). Consolida em três capítulos a descrição do produto-alvo: **Produto** (quem somos e para quem), **Glossário** (qual é o vocabulário) e **Regras & Métricas** (quais são as leis e como nos medimos). As fontes que sustentam cada afirmação estão agrupadas na seção \"Fontes\", ao final.\n\n> **Convenção de marcadores.** Inferências marcadas com `*(inferência)*`; lacunas com `⚠ NÃO IDENTIFICADO — definir: <pergunta>`. IDs (`JTBD-NN`, `RN-NN`, `RN-AI-NN`, `IM-NN`) são estáveis e referenciados pela Camada de Requisitos — não renumerar.\n\n---\n\n## 1. Produto\n\n> *Quem somos e para quem?*\n\n### Visão\n\nA **Cobrança Inteligente** é a plataforma única de gestão da cobrança administrativa do crédito tributário da SEFAZ-MT. Ela substitui um modelo fragmentado — débitos espalhados entre Conta Corrente Fiscal, MPI, IPVA, ITCD, SNE e planilhas, integrados manualmente e sem visão única do contribuinte — por um sistema que **consolida débitos de múltiplas fontes, qualifica a carteira por regras parametrizáveis e risco, executa réguas de cobrança automatizadas e multicanal, distribui a cobrança qualificada entre atendentes com dossiê centralizado, e mensura em tempo real a efetividade da cobrança** (incluindo a causalidade entre ação e regularização, via grupo de controle).\n\nA transformação que promove: sair de uma cobrança reativa, empírica e de baixo alcance, para uma cobrança **proativa, segmentada, auditável e mensurável**, que maximiza a recuperação de crédito por contribuinte e minimiza o custo da cobrança massiva. O produto é implantado sobre a plataforma **ServiceNow** *(inferência — modelo de execução do Profisco II adota ServiceNow para todos os produtos)*.\n\n### Proposta de Valor\n\nPara a **equipe de cobrança da SEFAZ-MT** (coordenação e atendentes da CPRF) que hoje opera a cobrança de forma fragmentada, manual e sem base analítica, a **Cobrança Inteligente** é uma **plataforma de gestão e automação da cobrança** que consolida toda a carteira em uma visão única, automatiza as réguas de comunicação e instrumentaliza a cobrança qualificada com dossiê e indicadores. Diferente do mosaico atual de sistemas legados e planilhas, ela entrega **rastreabilidade ponta a ponta do ciclo do crédito** e **decisão baseada em dados**.\n\nDiferenciais:\n\n- **Visão única do contribuinte** — toda a carteira (ICMS, IPVA, ITCD, parcelamentos) consolidada por contribuinte, independente do sistema de origem.\n- **Réguas automatizadas e multicanal** — disparo sem confirmação manual, com escalonamento progressivo por comportamento e canais e-mail/SMS/WhatsApp (opt-in).\n- **Qualificação parametrizável e auditável** — critérios de formação de carteira configuráveis e versionados, deixando de depender do conhecimento tácito do coordenador; preparado para incorporar o score de liquidez da UFMT.\n- **Dossiê centralizado** — histórico completo do contribuinte (débitos, parcelamentos, contatos, notificações coercitivas) em tela única, antes do contato qualificado.\n- **Mensuração causal** — grupo de controle automático e atribuição da origem da regularização (ativa vs. espontânea), permitindo medir o efeito incremental da cobrança.\n\n### Personas\n\n#### Persona 1 — Coordenador de Cobrança\n\n**Quem é.** Gestor da coordenadoria de cobrança (CPRF). Responsável por definir a estratégia de cobrança, parametrizar as carteiras e réguas, distribuir o trabalho da equipe e prestar contas dos resultados (KPIs por tributo, canal e instrumento).\n\n**Contexto de uso.** Define e versiona os critérios de qualificação da carteira e os modelos de régua; acompanha painéis institucionais; ajusta a estratégia a cada ciclo com base na efetividade observada; configura o grupo de controle.\n\n**Dores.**\n- Seleção da carteira qualificada baseada em conhecimento empírico, não auditável nem replicável.\n- Distribuição manual da carteira via planilhas e Google Drive.\n- Falta de visão gerencial em tempo real; KPIs dependem de extração e cruzamento manual.\n- Disparo de cobrança exige confirmações manuais em lote; sem régua estruturada.\n- Grupo de controle montado por sorteio manual, sem cálculo sistemático do efeito incremental.\n\n#### Persona 2 — Atendente de Cobrança\n\n**Quem é.** Servidor da equipe de cobrança qualificada, que conduz o atendimento individualizado dos contribuintes da carteira.\n\n**Contexto de uso.** Recebe casos distribuídos automaticamente; consulta o dossiê do contribuinte antes do contato; registra interações e andamentos; acompanha o status de regularização e parcelamento dos seus casos.\n\n**Dores.**\n- Precisa consultar múltiplos sistemas (CCF, SNE, SUCOM) para montar o histórico do contribuinte antes de um contato.\n- Risco de abordar contribuinte que já regularizou (status atualizado apenas em \"foto mensal\").\n- Histórico de interações disperso, sem registro estruturado por caso.\n\n#### Persona 3 — Contribuinte — fora do escopo (ator externo)\n\nO **contribuinte** (pessoa física ou jurídica) é o destinatário das notificações e o sujeito do crédito, mas **não é usuário da plataforma**. Ele interage de forma indireta: recebe comunicações das réguas (e-mail/SMS/WhatsApp), regulariza ou parcela débitos nos canais próprios da SEFAZ, e gere seu opt-in de mensageria. Sua experiência é endereçada pela qualidade e cadência das comunicações, não por telas do produto.\n\n#### Persona 4 — Cientista/parceiro do modelo de score (UFMT) — fora do escopo de operação\n\nA **UFMT** desenvolve, por convênio, o **score de liquidez** (probabilidade de recuperação). O produto **consome** o score como insumo de priorização, mas o desenvolvimento e a recalibração do modelo ocorrem fora da plataforma *(inferência — convênio externo)*; a feature de scoring no produto trata da **integração e do uso** do score, não de sua construção.\n\n### Jobs / Necessidades\n\n- **JTBD-01** — Quando há débitos espalhados por vários sistemas, quero consolidá-los automaticamente em uma carteira única por contribuinte, para enxergar o ciclo do crédito sem varredura manual.\n- **JTBD-02** — Quando preciso decidir quem cobrar e como, quero qualificar e segmentar a carteira por critérios parametrizáveis (valor, tributo, atraso, perfil, risco/score), para que a seleção seja auditável e replicável.\n- **JTBD-03** — Quando um lote de devedores precisa ser comunicado, quero disparar réguas automatizadas e escalonadas por múltiplos canais, para maximizar o retorno minimizando o esforço manual.\n- **JTBD-04** — Quando atendo um contribuinte da carteira qualificada, quero acessar um dossiê centralizado e registrar as interações em um caso, para conduzir a cobrança com contexto completo e histórico rastreável.\n- **JTBD-05** — Quando a carteira qualificada cresce, quero que os casos sejam distribuídos automaticamente entre atendentes por regras e prioridade, para eliminar a planilha e equilibrar a carga.\n- **JTBD-06** — Quando presto contas da cobrança, quero painéis com KPIs em tempo real e a origem da regularização, para decidir com dados e medir o efeito incremental via grupo de controle.\n- **JTBD-07** — Quando um contribuinte regulariza durante um ciclo, quero que o status atualize quase em tempo real e o caso encerre, para não abordá-lo novamente.\n\n### Não-objetivos\n\n- **Desenvolver o modelo de score de liquidez.** A construção/recalibração do modelo é da UFMT; o produto integra e usa o score (RN-AI-01).\n- **Inscrição em dívida ativa e execução fiscal.** O produto trata da cobrança **administrativa**; o encaminhamento à PGE/PAT e o contencioso ficam em outros produtos da Receita Digital (2.4 Contencioso) e na PGE.\n- **Operação dos instrumentos coercitivos** (protesto, cautelar fiscal, negativação, etc.). São lacunas estratégicas mapeadas, concentradas em outras áreas/PGE; o produto pode **sinalizar** elegibilidade no dossiê, mas não os executa. ⚠ NÃO IDENTIFICADO — definir: escopo de coerção dentro do produto.\n- **Portal/autoatendimento do contribuinte.** O contribuinte recebe comunicações e regulariza em canais próprios, não em telas deste produto.\n- **Cadastro-base do contribuinte.** A qualidade cadastral e a base de contatos vêm do produto 2.2 (B-Cadastro/Big Data); a Cobrança Inteligente consome, não mantém o cadastro mestre.\n\n---\n\n## 2. Glossário\n\n> *Qual é o vocabulário?*\n\n### Termos do domínio\n\n#### Atendente\n**Definição**: Servidor da equipe de cobrança qualificada que conduz o atendimento individualizado de contribuintes que lhe foram distribuídos.\n**Sinônimos a evitar**: \"operador\" (genérico), \"agente\".\n**Exemplo**: O atendente abre o dossiê antes de ligar para o contribuinte.\n\n#### Carteira\n**Definição**: Conjunto de débitos/contribuintes selecionados para uma ação de cobrança, formado pela aplicação de critérios de qualificação. Pode ser **massificada** (lote, comunicação automatizada) ou **qualificada** (atendimento individualizado).\n**Sinônimos a evitar**: \"base\" (designa a totalidade de débitos, não o recorte).\n**Exemplo**: A carteira qualificada de ICMS deste ciclo tem 1.200 contribuintes acima de R$ 500 mil.\n\n#### Cobrança Massificada\n**Definição**: Eixo de atuação centrado no grande volume de contribuintes, com foco em prevenção e autorregularização, via comunicação automatizada e ações em lote (réguas). Minimiza o custo da cobrança.\n**Sinônimos a evitar**: \"cobrança em massa\" (use \"massificada\").\n**Exemplo**: A régua de IPVA dispara lembretes massificados antes do vencimento.\n\n#### Cobrança Qualificada\n**Definição**: Eixo de atuação centrado nos grandes/contumazes devedores, com foco em investigação, dossiê, atendimento individualizado e coerção. Maximiza o retorno por contribuinte.\n**Sinônimos a evitar**: \"cobrança ativa\" (no MT, o que se chama \"qualificada\" hoje se assemelha à cobrança ativa; padronizar como \"qualificada\").\n**Exemplo**: O caso entrou na cobrança qualificada por débito acima do limite e bom histórico de recuperação.\n\n#### Conta Corrente Fiscal (CCF)\n**Definição**: Sistema legado que registra a situação dos débitos do contribuinte; fonte primária do status de regularização e de parcelamentos.\n**Sinônimos a evitar**: \"conta corrente\" sem qualificar.\n**Exemplo**: A consulta diária ao CCF detecta a regularização e encerra o caso.\n\n#### Débito\n**Definição**: Crédito tributário em aberto devido por um contribuinte, identificado por tributo, valor, vencimento e instrumento de constituição.\n**Sinônimos a evitar**: \"dívida\" (reservar para \"dívida ativa\").\n**Exemplo**: O débito de ICMS foi consolidado a partir do MPI.\n\n#### Dossiê\n**Definição**: Visão consolidada e estruturada de um contribuinte para uso na cobrança qualificada: débitos, parcelamentos, histórico de contatos, notificações e sinalizações coercitivas, montado automaticamente a partir de múltiplas fontes.\n**Sinônimos a evitar**: \"ficha\", \"prontuário\".\n**Exemplo**: O dossiê mostra notificações coercitivas ativas em outra coordenadoria.\n\n#### Grupo de Controle\n**Definição**: Subconjunto de contribuintes elegíveis deliberadamente **não** submetidos à ação de cobrança, sorteado para permitir medir o efeito incremental (causal) da cobrança.\n**Sinônimos a evitar**: \"amostra\".\n**Exemplo**: ~500 elegíveis ficam no grupo de controle por ciclo.\n\n#### Macroprocesso\n**Definição**: Agrupamento de processos da cobrança. No produto: Identificação e Qualificação de Débitos, Cobrança Massificada, Cobrança Qualificada, Indicadores e Monitoramento.\n**Sinônimos a evitar**: \"módulo\".\n**Exemplo**: A régua pertence ao macroprocesso de Cobrança Massificada.\n\n#### MPI\n**Definição**: Sistema legado de varredura/identificação de débitos, em descontinuação — será substituído pelo **Big Data** (produto 2.2). A integração deve contemplar a transição.\n**Sinônimos a evitar**: —.\n**Exemplo**: As regras de elegibilidade hoje no MPI migrarão para o Big Data.\n\n#### Opt-in\n**Definição**: Consentimento estruturado do contribuinte para receber comunicações por um canal (notadamente WhatsApp), com gestão de opt-out e logs.\n**Sinônimos a evitar**: \"aceite\".\n**Exemplo**: O disparo via WhatsApp respeita o opt-in vigente.\n\n#### Régua de Cobrança\n**Definição**: Instrumento que consolida, para um perfil de devedor/dívida, a sequência temporal de ações de comunicação (cadência, periodicidade, canais, critérios de segmentação e escalonamento) ao longo do ciclo.\n**Sinônimos a evitar**: \"fluxo de e-mail\" (a régua é multicanal e condicional).\n**Exemplo**: A régua do ICMS Contas-Declaração envia lembrete -5d, -2d, 0d e notificação +15d.\n\n#### Score de Liquidez\n**Definição**: Estimativa (modelo da UFMT) da probabilidade de recuperação/capacidade de pagamento de um débito/contribuinte, usada como critério de priorização da carteira.\n**Sinônimos a evitar**: \"rating\" (relacionado, mas o termo do convênio é \"score de liquidez\").\n**Exemplo**: O score prioriza a fila do atendente.\n\n#### SNE / DT-e\n**Definição**: Sistema de Notificação Eletrônica (SNE) e Domicílio Tributário Eletrônico (DT-e) — canal oficial de notificação e de ciência do contribuinte. Hoje, baixa abertura limita a efetividade.\n**Sinônimos a evitar**: —.\n**Exemplo**: A régua usa canais diretos (e-mail/WhatsApp) sem depender só do DT-e.\n\n### Convenções de nomenclatura\n\n1. **Massificada vs. Qualificada**: usar sempre \"cobrança massificada\" e \"cobrança qualificada\"; não usar \"ativa\".\n2. **Débito vs. Dívida**: \"débito\" = crédito em aberto na cobrança administrativa; \"dívida ativa\" = pós-inscrição (fora do escopo).\n3. **Carteira vs. Base**: \"carteira\" = recorte qualificado para ação; \"base\" = totalidade consolidada de débitos.\n4. **Régua vs. Notificação**: \"régua\" = sequência configurada de ações; \"notificação\"/\"comunicação\" = um disparo individual da régua.\n5. **Caso**: instância de cobrança qualificada associada a um contribuinte e a um atendente (a unidade de trabalho do atendente).\n\n---\n\n## 3. Regras & Métricas\n\n> *Quais são as leis do produto, e como saber se ele cumpre a missão?*\n\n### Regras de Negócio\n\n#### RN-01 — Consolidação por contribuinte\n**Enunciado**: Débitos de fontes distintas (CCF, MPI/Big Data, IPVA, ITCD, SNE) que pertencem ao mesmo contribuinte (mesmo CPF/CNPJ) são vinculados a uma única visão de contribuinte; a duplicidade entre fontes é resolvida por regra de sobreposição.\n**Justificativa**: Visão única é a base de toda a operação.\n**Impacta**: Ingestão, Dossiê, Carteira.\n\n#### RN-02 — Atualização intraciclo de regularização\n**Enunciado**: O status de regularização/parcelamento é atualizado periodicamente (diária *(inferência)*) durante o ciclo; ao detectar regularização, o caso/ação correspondente é encerrado e o contribuinte não é mais abordado naquele ciclo.\n**Justificativa**: Evita abordar quem já regularizou; substitui a \"foto mensal\".\n**Impacta**: Réguas, Cobrança Qualificada, Monitoramento.\n\n#### RN-03 — Critérios de qualificação parametrizáveis e versionados\n**Enunciado**: A formação de carteira usa critérios configuráveis (valor mínimo, tributo, tempo de atraso, instrumento, exclusões como contumazes, perfil/risco); cada conjunto de critérios é versionado e auditável, sem depender de conhecimento tácito.\n**Justificativa**: Seleção auditável e replicável.\n**Impacta**: Qualificação da Carteira.\n\n#### RN-04 — Separação massificada vs. qualificada\n**Enunciado**: A carteira é dividida automaticamente entre abordagem massificada e qualificada por critérios de valor, risco e histórico; um contribuinte segue um único eixo por ciclo. ⚠ NÃO IDENTIFICADO — definir: regra de desempate quando o contribuinte se enquadra nos dois.\n**Justificativa**: Estratégias e custos distintos por eixo.\n**Impacta**: Qualificação, Réguas, Cobrança Qualificada.\n\n#### RN-05 — Escalonamento progressivo da régua\n**Enunciado**: As ações da régua escalonam conforme o comportamento do contribuinte (sem resposta → renotificação → intensificação; com regularização → encerramento), respeitando a cadência temporal configurada.\n**Justificativa**: Aumenta a percepção de risco e a efetividade.\n**Impacta**: Réguas.\n\n#### RN-06 — Consentimento de canal (opt-in)\n**Enunciado**: Disparos por WhatsApp (e demais canais sujeitos a consentimento) só ocorrem para contribuintes com opt-in vigente; opt-out é respeitado imediatamente e registrado.\n**Justificativa**: Base legal e relacionamento.\n**Impacta**: Réguas, Gestão de canais.\n\n#### RN-07 — Distribuição automática equilibrada\n**Enunciado**: Casos da carteira qualificada são distribuídos automaticamente entre atendentes por regras (ex.: vínculo contador↔atendente, balanceamento de carga, prioridade por score/estágio), sem montagem manual de planilhas.\n**Justificativa**: Elimina planilha; equilibra carga.\n**Impacta**: Cobrança Qualificada.\n\n#### RN-08 — Rastreabilidade da origem da regularização\n**Enunciado**: Toda regularização é marcada quanto à origem — espontânea vs. resposta à cobrança (por canal/instrumento) — permitindo atribuição causal.\n**Justificativa**: Mensurar efeito da cobrança.\n**Impacta**: Monitoramento, Réguas.\n\n#### RN-09 — Grupo de controle\n**Enunciado**: Um subconjunto de elegíveis é sorteado automaticamente para o grupo de controle (não cobrado) por ciclo; sua taxa de regularização é comparada à da carteira cobrada para calcular o efeito incremental.\n**Justificativa**: Causalidade da cobrança.\n**Impacta**: Qualificação, Monitoramento.\n\n#### RN-10 — Trilha de auditoria de ações e configurações\n**Enunciado**: Toda ação relevante (disparo, distribuição, alteração de regra/régua, encerramento de caso, registro de interação) é registrada com ator, data/hora e payload, de forma imutável.\n**Justificativa**: Cobrança auditável e defensável.\n**Impacta**: Todas as features.\n\n#### RN-11 — Visibilidade por perfil\n**Enunciado**: O coordenador tem visão completa (toda a carteira, comparativos, KPIs); o atendente tem visão individual (sua carteira/casos), não comparativa entre atendentes.\n**Justificativa**: Governança e privacidade interna.\n**Impacta**: Monitoramento, Cobrança Qualificada.\n\n#### RN-12 — Continuidade de fonte na transição MPI→Big Data\n**Enunciado**: A identificação de débitos deve permanecer operante na transição do MPI para o Big Data (P2.2); as regras de elegibilidade são mapeadas na nova fonte sem ruptura da carteira.\n**Justificativa**: MPI será descontinuado.\n**Impacta**: Ingestão.\n\n### Regras dependentes de IA\n\n#### RN-AI-01 — Priorização por score de liquidez\n**Enunciado**: Quando disponível, o score de liquidez da UFMT (probabilidade de recuperação/capacidade de pagamento) é consumido como variável parametrizável na qualificação da carteira e na priorização da fila do atendente, com threshold configurável pelo coordenador.\n**Justificativa**: Substituir progressivamente a seleção empírica por base analítica.\n**Fallback**: Na ausência/indisponibilidade do score, a qualificação e a priorização operam apenas com os critérios determinísticos de RN-03 (valor, atraso, histórico, etc.); o caso é tratado como \"sem score\".\n**Impacta**: Qualificação da Carteira, Cobrança Qualificada, Scoring.\n\n> Observação: o **escalonamento** da régua (RN-05), a **segmentação** (RN-03/RN-04), o **grupo de controle** (RN-09) e a **atribuição de origem** (RN-08) são lógica **determinística** — não entram aqui.\n\n### Métricas de sucesso\n\n**North Star Metric (NSM): Crédito tributário recuperado atribuível à cobrança.**\n\n```\nNSM = Σ valor regularizado atribuído à ação de cobrança (por tributo, canal, instrumento)\n      / Σ valor da carteira acionada\n      — líquido do baseline do grupo de controle (efeito incremental)\n```\n\nConta no numerador o valor regularizado por contribuintes acionados, marcado como resposta à cobrança (RN-08), descontada a taxa de regularização espontânea observada no grupo de controle (RN-09). Atribuição: regularização em até 30 dias da comunicação (regra geral) *(inferência — convenção das réguas EloGroup)*.\n\n**Cadência.** Por ciclo de cobrança e consolidação mensal.\n\n**Por que esta métrica.** Traduz a missão (recuperar crédito) e, ao descontar o grupo de controle, distingue **efeito da cobrança** de regularização que ocorreria de qualquer forma.\n\n**Baseline de referência.** Histórico de quitação: ICMS Normal ~30,9% / ICMS ST ~22,5%; taxa de retorno de réguas em referência EloGroup ~5,15% (valor pago em até 30 dias). *(inferência — números de carteira/benchmark, não meta imposta.)*\n\n**Guard-rails**\n\n- **IM-01 — Taxa de regularização espontânea (grupo de controle).** Mantida para isolar o efeito incremental; queda relativa do incremental indica perda de efetividade da cobrança.\n- **IM-02 — Reclamações/opt-out por canal.** Não deve crescer enquanto a NSM é otimizada; mede pressão excessiva ou comunicação inadequada.\n\n---\n\n## Questões em aberto\n\n- ⚠ Escopo dos instrumentos coercitivos dentro do produto (sinalizar vs. operar).\n- ⚠ Regra de desempate massificada↔qualificada para contribuinte elegível a ambos (RN-04).\n- ⚠ Periodicidade exata da consolidação/atualização intraciclo (diária assumida).\n- ⚠ Confirmação de que a plataforma-alvo é ServiceNow para todos os módulos.\n- ⚠ Janela de atribuição causal definitiva (30 dias assumido) e modelo de atribuição por canal.\n\n---\n\n## Fontes\n\n- **Cap. 1 (Produto/Personas/Jobs)**: \"[SEFAZ-MT] Executivo Cobrança\", \"Desenho Solução de Cobrança (Interno)\", \"Diagnóstico de Situação Atual - Cobrança\", \"Levantamento de Necessidades - 2.6 Cobrança\", \"Executivo Soluções\" (seção 2.6).\n- **Cap. 2 (Glossário)**: \"DECK Cobrança Inteligente - Estratégia Digital\", \"Diagnóstico de Situação Atual - Cobrança\".\n- **Cap. 3 (Regras & Métricas)**: \"Planning_Poker_dados\" (Produto 6 — Sistema de Cobrança, US 1-14), \"Potenciais oportunidades - P2.6\", réguas/retorno do DECK.\n\n## Relacionado\n- [Blueprint](blueprint.md)\n- [Modelo de dados (transversal)](modelo-dados.md)\n- [Requisitos transversais](requisitos-transversais.md)\n- [Telas comuns (arquétipos)](telas-comuns.md)\n- [Índice do wiki](index.md)\n\n---\n\n*Camada de Intenção. Documento canônico — descreve o produto-alvo: quem é, com que vocabulário e sob quais leis.*\n"}, "wiki/blueprint": {"title": "Blueprint — Cobrança Inteligente", "path": "refined/blueprint.md", "content": "# Blueprint — Cobrança Inteligente\n\nVisão geral da solução organizada pela **cadeia de valor da cobrança administrativa**: do dado bruto de débitos à recuperação mensurada do crédito. Cada etapa agrupa as features que a compõem. Marcadores: `[ator:<ator>]` = persona principal; `[ia]` = feature com componente de IA.\n\n## 1. Identificação e Consolidação\n- [Ingestão e Carteira Consolidada](Requisitos/ingestao-carteira.md) — consolida débitos de CCF/MPI/Big Data/IPVA/ITCD/SNE em visão única por contribuinte, com atualização intraciclo.  [ator:Coordenador]\n\n## 2. Qualificação e Priorização\n- [Qualificação e Parametrização da Carteira](Requisitos/qualificacao-carteira.md) — forma carteiras por critérios versionados, segmenta massificada/qualificada e sorteia grupo de controle.  [ator:Coordenador]\n- [Scoring de Liquidez (Priorização Inteligente)](Requisitos/scoring-liquidez.md) — integra e usa o score da UFMT como critério de priorização (com fallback).  [ator:Coordenador] [ia]\n\n## 3. Cobrança Massificada\n- [Réguas de Cobrança Massificada Multicanal](Requisitos/reguas-cobranca.md) — desenha e dispara réguas escalonadas por e-mail/SMS/WhatsApp/SNE, com opt-in e marcação de origem.  [ator:Coordenador]\n\n## 4. Cobrança Qualificada\n- [Cobrança Qualificada — Operação do Atendente](Requisitos/cobranca-qualificada.md) — distribui casos, consolida dossiê e registra interações no atendimento individualizado.  [ator:Atendente]\n\n## 5. Monitoramento e Aprendizado\n- [Monitoramento, KPIs e Grupo de Controle](Requisitos/monitoramento-kpis.md) — apura KPIs por tributo/canal/instrumento, calcula efeito incremental e gera insumos de revisão.  [ator:Coordenador]\n\n## Relacionado\n- [Visão do produto](visao.md)\n- [Modelo de dados (transversal)](modelo-dados.md)\n- [Requisitos transversais](requisitos-transversais.md)\n- [Telas comuns (arquétipos)](telas-comuns.md)\n- [Índice do wiki](index.md)\n", "kind": "blueprint", "etapas": [{"etapa": "1. Identificação e Consolidação", "features": [{"nome": "Ingestão e Carteira Consolidada", "href": "Requisitos/ingestao-carteira.md", "resumo": "consolida débitos de CCF/MPI/Big Data/IPVA/ITCD/SNE em visão única por contribuinte, com atualização intraciclo.", "ator": "Coordenador", "ia": false}]}, {"etapa": "2. Qualificação e Priorização", "features": [{"nome": "Qualificação e Parametrização da Carteira", "href": "Requisitos/qualificacao-carteira.md", "resumo": "forma carteiras por critérios versionados, segmenta massificada/qualificada e sorteia grupo de controle.", "ator": "Coordenador", "ia": false}, {"nome": "Scoring de Liquidez (Priorização Inteligente)", "href": "Requisitos/scoring-liquidez.md", "resumo": "integra e usa o score da UFMT como critério de priorização (com fallback).", "ator": "Coordenador", "ia": true}]}, {"etapa": "3. Cobrança Massificada", "features": [{"nome": "Réguas de Cobrança Massificada Multicanal", "href": "Requisitos/reguas-cobranca.md", "resumo": "desenha e dispara réguas escalonadas por e-mail/SMS/WhatsApp/SNE, com opt-in e marcação de origem.", "ator": "Coordenador", "ia": false}]}, {"etapa": "4. Cobrança Qualificada", "features": [{"nome": "Cobrança Qualificada — Operação do Atendente", "href": "Requisitos/cobranca-qualificada.md", "resumo": "distribui casos, consolida dossiê e registra interações no atendimento individualizado.", "ator": "Atendente", "ia": false}]}, {"etapa": "5. Monitoramento e Aprendizado", "features": [{"nome": "Monitoramento, KPIs e Grupo de Controle", "href": "Requisitos/monitoramento-kpis.md", "resumo": "apura KPIs por tributo/canal/instrumento, calcula efeito incremental e gera insumos de revisão.", "ator": "Coordenador", "ia": false}]}, {"etapa": "Relacionado", "features": [{"nome": "Visão do produto", "href": "visao.md", "resumo": "", "ator": null, "ia": false}, {"nome": "Modelo de dados (transversal)", "href": "modelo-dados.md", "resumo": "", "ator": null, "ia": false}, {"nome": "Requisitos transversais", "href": "requisitos-transversais.md", "resumo": "", "ator": null, "ia": false}, {"nome": "Telas comuns (arquétipos)", "href": "telas-comuns.md", "resumo": "", "ator": null, "ia": false}, {"nome": "Índice do wiki", "href": "index.md", "resumo": "", "ator": null, "ia": false}]}]}, "requisitos/cobranca-qualificada": {"title": "Cobrança Qualificada — Operação do Atendente — Contrato", "path": "refined/Requisitos/cobranca-qualificada.md", "content": "# Cobrança Qualificada — Operação do Atendente — Contrato\n\n> Documento único da Camada de Requisitos desta feature (3 capítulos).\n>\n> **Pense transversalmente.** Consulte: [Modelo de dados](../modelo-dados.md), [Requisitos transversais](../requisitos-transversais.md), [Telas comuns](../telas-comuns.md).\n>\n> **Eixo:** `processo` — fluxo de **distribuir casos entre atendentes, consultar o dossiê e conduzir o atendimento individualizado registrando interações**.\n\n> **Regra de não-sobreposição:** persona+objetivo → §2.1; o que faz + RN → §2.2; prova → §2.4; entidades → [modelo-dados](../modelo-dados.md).\n\n---\n\n## 1. Telas & Fluxos\n\n### 1.1 Fluxo (Mermaid)\n\n```mermaid\nflowchart LR\n    Inicio([Carteira qualificada formada]) --> A[Distribuir casos entre atendentes RN-07]\n    A --> B[Atendente abre sua fila priorizada por score/estágio RN-AI-01]\n    B --> C[Consultar dossiê do contribuinte RN-01]\n    C --> D[Realizar contato e registrar interação RN-10]\n    D --> R{Contribuinte regularizou/parcelou? RN-02}\n    R -->|sim| Enc[Encerrar caso + marcar origem RN-08]\n    R -->|não| F{Próxima ação?}\n    F -->|agendar follow-up| D\n    F -->|esgotou| Sig[Sinalizar elegibilidade coercitiva / encaminhar]\n    Enc --> Fim([Caso fechado])\n    Sig --> Fim\n```\n\n### 1.2 Telas detalhadas\n\n#### T-CQ-01 — Distribuição de Carteira (coordenador)\n- **Arquétipo:** A3 (Formulário de Configuração) + A1 (visão de carga)\n- **Objetivo:** configurar regras de distribuição e ver a carga por atendente (RN-07).\n\n```wireframe\n# Distribuição de Carteira\ncard \"Regras de distribuição\":\n  - vínculo contador <-> atendente\n  - balanceamento de carga\n  - prioridade por score/estágio\n(!) atendente sobrecarregado\n[[ Atendente A: n | Atendente B: n | Não atribuídos: n ]]\n[Distribuir automaticamente] [Reatribuir caso]\n```\n- **Conteúdo:** regras de vínculo/balanceamento; carga atual por atendente.\n- **Ações:** distribuir automaticamente; reatribuir; ver carga.\n- **Estados:** carteira não distribuída; desequilíbrio sinalizado.\n- **Navegação:** alimenta a fila do atendente (T-CQ-02).\n- **Componentes:** toolbar, card, list, banner, button.\n\n#### T-CQ-02 — Minha Fila (atendente)\n- **Arquétipo:** A2 (Lista / Fila com Filtros)\n- **Objetivo:** trabalhar a fila de casos priorizada (visão individual, RN-11).\n\n```wireframe\n# Minha Fila\n[Buscar____] [Status v] [Prioridade v] [Tributo v]\n| Contribuinte | Valor | Score | Estágio | Status | Ação |\n| reg | reg | reg | reg | reg | [Abrir] |\n[Abrir caso]\n```\n- **Conteúdo:** apenas os casos do atendente, ordenados por prioridade (score/estágio).\n- **Ações:** abrir caso; filtrar (RF-T-02).\n- **Estados:** fila vazia; casos novos; com status atualizado intraciclo.\n- **Navegação:** abre T-CQ-03.\n- **Componentes:** toolbar, input, select, table, button.\n\n#### T-CQ-03 — Dossiê / Caso\n- **Arquétipo:** A4 (Detalhe / Visão 360 com abas)\n- **Objetivo:** consolidar o dossiê e operar o caso (consultar contexto + registrar interações).\n\n```wireframe\n# Dossiê do Contribuinte\ncard \"Resumo\":\n  [[ Documento | Segmento | Score | Total em aberto ]]\n(!) notificação coercitiva ativa em outra coordenadoria\n## Abas: Débitos | Parcelamentos | Comunicações | Interações | Grupo econômico\ncard \"Conteúdo da aba\":\n  | Coluna | Coluna | Coluna |\n  | linha | linha | linha |\n[Registrar interação] [Agendar follow-up] [Encerrar caso]\n```\n- **Conteúdo:** débitos, parcelamentos, histórico de contatos (comunicações da régua + interações), sinalizações coercitivas, grupo econômico/situação patrimonial *(inferência — níveis do dossiê)*.\n- **Ações:** registrar interação (campo estruturado + livre); agendar follow-up; encerrar caso; ações são auditadas (RN-10).\n- **Estados:** dossiê incompleto (fontes faltantes); caso aberto/encerrado.\n- **Navegação:** de T-CQ-02 e de Ingestão (T-ING-03).\n- **Componentes:** toolbar, card, tabs, table, list, banner, button.\n\n### 1.3 Diagrama de navegação (Mermaid)\n\n```mermaid\nflowchart TD\n    T_CQ_01[T-CQ-01 — Distribuição] -->|distribuir| T_CQ_02[T-CQ-02 — Minha Fila]\n    T_CQ_02 -->|abrir caso| T_CQ_03[T-CQ-03 — Dossiê/Caso]\n    T_CQ_03 -->|registrar/seguir| T_CQ_03\n    T_CQ_03 -->|encerrar| T_CQ_02\n    T_ING_03[Ingestão — Visão Única] -->|ver dossiê| T_CQ_03\n```\n\n---\n\n## 2. Requisitos & Cenários de Teste\n\n> Origem: RN-07, RN-01, RN-02, RN-08, RN-10, RN-11, RN-AI-01. Horizonte: **H1**.\n\n### 2.1 Personas & objetivos\n\n| Persona | Objetivo | JTBD |\n|---|---|---|\n| Coordenador de Cobrança | Distribuir casos automaticamente e equilibrar a carga | JTBD-05 |\n| Atendente de Cobrança | Acessar dossiê completo e registrar interações por caso | JTBD-04 |\n| Atendente de Cobrança | Trabalhar uma fila priorizada por score/estágio | JTBD-04, JTBD-05 |\n| Atendente de Cobrança | Encerrar o caso assim que o contribuinte regulariza, sem reabordá-lo | JTBD-07 |\n\n### 2.2 Requisitos Funcionais\n\n| ID | Enunciado | Prioridade | RNs | Persona |\n|---|---|---|---|---|\n| RF-01 | Distribuir automaticamente casos por regras (vínculo, balanceamento, prioridade) (N1.5, N2.5, US6) | Must | RN-07 | Coordenador |\n| RF-02 | Priorizar a fila do atendente por score/estágio (N2.5, US14) | Should | RN-07, RN-AI-01 | Atendente |\n| RF-03 | Montar dossiê consolidado automaticamente de múltiplas fontes (N1.5, US7) | Must | RN-01 | Atendente |\n| RF-04 | Sinalizar no dossiê notificações coercitivas ativas em outras coordenadorias (US7) | Should | RN-01 | Atendente |\n| RF-05 | Registrar interações por caso (campo estruturado + livre) com histórico (N1.5) | Must | RN-10 | Atendente |\n| RF-06 | Encerrar caso ao detectar regularização e marcar origem (N1.5) | Must | RN-02, RN-08 | Atendente |\n| RF-07 | Restringir a visão do atendente à própria carteira (não comparativa) | Must | RN-11 | Atendente |\n\n**Transversais aplicáveis:** RF-T-01, RF-T-02, RF-T-03 (visão única consumida), RF-T-04 (marcação de origem).\n\n### 2.3 Requisitos Não-Funcionais\n\n#### Segurança\n- **RNF-S-01** — Esta feature é a **lar** de RNF-T-SEG-01 (controle de acesso por perfil; atendente vê só a própria carteira — RN-11).\n\n**Transversais aplicáveis:** RNF-T-SEG-01 (lar), RNF-T-AUD-01, RNF-T-PERF-01, RNF-T-DISP-01 (dossiê com fontes faltantes).\n\n### 2.4 Cenários de Teste\n\n#### CT-01 — Distribuição automática equilibrada (verifica RF-01/RN-07)\n- **Dado** uma carteira qualificada nova e atendentes com cargas diferentes\n- **Quando** o coordenador aciona \"distribuir automaticamente\"\n- **Então** os casos são atribuídos respeitando vínculos e balanceando a carga.\n\n#### CT-02 — Fila priorizada por score (verifica RF-02/RN-AI-01)\n- **Dado** casos com diferentes scores de liquidez\n- **Quando** o atendente abre a fila\n- **Então** os casos de maior probabilidade de recuperação aparecem no topo; sem score, ordena por critérios determinísticos.\n\n#### CT-03 — Dossiê consolidado (verifica RF-03/RF-04/RN-01)\n- **Dado** um contribuinte com débitos em CCF e notificação no SNE de outra coordenadoria\n- **Quando** o atendente abre o dossiê\n- **Então** todos os débitos e a sinalização coercitiva aparecem em tela única.\n\n#### CT-04 — Registro de interação auditado (verifica RF-05/RNF-T-AUD-01)\n- **Dado** um caso aberto\n- **Quando** o atendente registra uma ligação com resultado\n- **Então** a interação é gravada no histórico do caso e um evento de auditoria é criado.\n\n#### CT-05 — Encerramento por regularização (verifica RF-06/RN-02/RN-08)\n- **Dado** um contribuinte de caso que parcela o débito\n- **Quando** a atualização intraciclo detecta o parcelamento\n- **Então** o caso é encerrado e a origem é marcada como \"resposta à cobrança qualificada\".\n\n#### CT-06 — Isolamento por perfil (verifica RF-07/RNF-T-SEG-01)\n- **Dado** dois atendentes com carteiras distintas\n- **Quando** um deles acessa \"Minha Fila\"\n- **Então** ele vê apenas seus próprios casos, sem comparativo com outros.\n\n---\n\n## 3. Dados\n\n> Eixo `processo`: entidades derivam das atividades de distribuição/atendimento.\n\n### 3.1 Entidades canônicas usadas\n- **Caso** e sub-entidade **Interação** (ver [../modelo-dados.md](../modelo-dados.md)) — esta feature é a **lar**.\n- **Dossiê** (read-model) — montado aqui; lar.\n- **Contribuinte**, **Débito**, **Parcelamento**, **Comunicação**, **Usuário** — referenciados.\n\n### 3.2 Entidades próprias da feature\n\n#### Regra de Distribuição  <!-- deriva de: atividade \"Distribuir casos\"; referencia Caso/Usuário -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| tipo | texto | vínculo / balanceamento / prioridade |\n| parametros | composto | Ex.: peso de score, capacidade por atendente |\n| ativa | booleano | Vigente |\n\n### 3.3 Relações\n- Regra de Distribuição 1:N Caso (origina atribuições); Usuário(atendente) 1:N Caso 1:N Interação (entidades canônicas de ../modelo-dados.md).\n\n---\n\n## Questões em aberto\n- ⚠ NÃO IDENTIFICADO — definir: níveis do dossiê efetivamente disponíveis (grupo econômico, situação patrimonial) e fontes; capacidade máxima por atendente.\n\n## Fontes\n- Levantamento de Necessidades 2.6 (N1.5, N2.5); Planning_Poker (US 6, 7); DECK Cobrança Inteligente.\n\n## Relacionado\n- [Visão do produto](../visao.md)\n- [Modelo de dados (transversal)](../modelo-dados.md)\n- [Requisitos transversais](../requisitos-transversais.md)\n- [Telas comuns (arquétipos)](../telas-comuns.md)\n- [Ingestão e Carteira](ingestao-carteira.md)\n- [Qualificação da Carteira](qualificacao-carteira.md)\n- [Scoring de Liquidez](scoring-liquidez.md)\n- [Índice do wiki](../index.md)\n"}, "requisitos/ingestao-carteira": {"title": "Ingestão e Carteira Consolidada — Contrato", "path": "refined/Requisitos/ingestao-carteira.md", "content": "# Ingestão e Carteira Consolidada — Contrato\n\n> Documento único da Camada de Requisitos desta feature (3 capítulos). Responde: *como o usuário interage* (Cap. 1), *o que cumpre, para quem e como provar* (Cap. 2) e *que informação manipula* (Cap. 3).\n>\n> **Pense transversalmente.** Consulte: [Modelo de dados](../modelo-dados.md), [Requisitos transversais](../requisitos-transversais.md), [Telas comuns](../telas-comuns.md).\n>\n> **Eixo:** `processo` — a feature é o fluxo de **consolidar débitos de múltiplas fontes em uma carteira/visão única, mantendo o status atualizado intraciclo**.\n\n> **Regra de não-sobreposição:** persona+objetivo → §2.1; o que faz + RN → §2.2; prova → §2.4; entidades canônicas → [modelo-dados](../modelo-dados.md); arquétipos → [telas-comuns](../telas-comuns.md).\n\n---\n\n## 1. Telas & Fluxos\n\n### 1.1 Fluxo (Mermaid)\n\n> Legenda: `[ ]` = informação/ação/resultado · `{ }` = decisões · `([ ])` = gatilho/saídas.\n\n```mermaid\nflowchart LR\n    Inicio([Ciclo de sincronização]) --> A[Conectar fontes CCF/MPI/Big Data/IPVA/ITCD/SNE]\n    A --> V{Documento CPF/CNPJ válido?}\n    V -->|não| Erro[Rejeitar registro + log RNF-T-CONF-01]\n    V -->|sim| C[Consolidar débito e vincular ao contribuinte RN-01]\n    C --> D{Já existe em outra fonte?}\n    D -->|sim| M[Resolver sobreposição]\n    D -->|não| N[Criar débito]\n    M --> U[Atualizar visão única do contribuinte]\n    N --> U\n    U --> S[Atualizar status: aberto/regularizado/parcelado RN-02]\n    S --> P{Parcelamento em atraso?}\n    P -->|sim| AL[Gerar alerta de risco de rompimento]\n    P -->|não| Fim([Carteira consolidada disponível])\n    AL --> Fim\n    Erro --> Fim\n```\n\n### 1.2 Telas detalhadas\n\n#### T-ING-01 — Integrações & Sincronização\n- **Arquétipo:** A6 (Painel de Status de Integração / Execução)\n- **Objetivo:** operar e monitorar a consolidação periódica das fontes.\n\n```wireframe\n# Integrações & Sincronização\n[[ Fontes OK | Última sync | Registros rejeitados ]]\n(!) falha de integração em uma fonte\n| Fonte | Última sync | Registros | Status |\n| CCF | data | n | OK |\n| MPI/Big Data | data | n | OK |\n[Reprocessar fonte] [Ver log de rejeições]\n```\n- **Conteúdo:** status por fonte (última sync, volume, erros), fila de transição MPI→Big Data.\n- **Ações:** reprocessar uma fonte; abrir log de rejeições (CPF/CNPJ inválidos).\n- **Estados:** todas OK; fonte em falha (degradação segura RNF-T-DISP-01); transição em andamento.\n- **Navegação:** porta de entrada operacional; leva à carteira consolidada.\n- **Componentes:** toolbar, card, table, banner, button.\n\n#### T-ING-02 — Carteira Consolidada (base)\n- **Arquétipo:** A2 (Lista / Fila com Filtros)\n- **Objetivo:** navegar a base consolidada de débitos/contribuintes.\n\n```wireframe\n# Carteira Consolidada\n[Buscar contribuinte/documento____] [Tributo v] [Status v] [Atraso v] [Ordenar por v]\n| Contribuinte | Tributo | Valor | Atraso | Parcelamento | Status |\n| reg | reg | reg | reg | reg | reg |\n[Abrir contribuinte] [Exportar]\n```\n- **Conteúdo:** débitos consolidados; coluna de alerta de parcelamento em atraso.\n- **Ações:** filtrar/buscar (RF-T-02), abrir contribuinte, exportar (RF-T-01).\n- **Estados:** vazio (sem sync); carregando lote; com alertas.\n- **Navegação:** de T-ING-01; abre T-ING-03.\n- **Componentes:** toolbar, input, select, table, button.\n\n#### T-ING-03 — Visão Única do Contribuinte\n- **Arquétipo:** A4 (Detalhe / Visão 360, somente leitura)\n- **Objetivo:** consolidar tudo de um contribuinte (RF-T-03) — base do dossiê.\n\n```wireframe\n# Visão Única do Contribuinte\ncard \"Resumo\":\n  [[ Documento | Segmento | Total em aberto ]]\n(!) parcelamento em atraso\n## Abas: Débitos | Parcelamentos | Comunicações\ncard \"Conteúdo da aba\":\n  | Tributo | Valor | Vencimento | Fonte | Status |\n  | linha | linha | linha | linha | linha |\n[Ver dossiê completo]\n```\n- **Conteúdo:** débitos por tributo/fonte, parcelamentos, comunicações já enviadas.\n- **Ações:** alternar abas; ir ao dossiê (Cobrança Qualificada).\n- **Estados:** sem débitos; com sinalização de parcelamento em risco.\n- **Navegação:** de T-ING-02; conecta ao Dossiê (T-CQ-03).\n- **Componentes:** toolbar, card, tabs, table, banner, button.\n\n### 1.3 Diagrama de navegação (Mermaid)\n\n```mermaid\nflowchart TD\n    T_ING_01[T-ING-01 — Integrações] -->|abrir carteira| T_ING_02[T-ING-02 — Carteira Consolidada]\n    T_ING_02 -->|abrir contribuinte| T_ING_03[T-ING-03 — Visão Única]\n    T_ING_03 -->|ver dossiê| T_CQ_03[T-CQ-03 — Dossiê/Caso]\n    T_ING_02 -->|voltar| T_ING_01\n```\n\n---\n\n## 2. Requisitos & Cenários de Teste\n\n> Origem: RN-01, RN-02, RN-12. Horizonte: **H1**.\n> Antes de escrever: ver [requisitos-transversais](../requisitos-transversais.md).\n\n### 2.1 Personas & objetivos\n\n| Persona | Objetivo | JTBD |\n|---|---|---|\n| Coordenador de Cobrança | Ter a carteira consolidada e confiável sem varredura manual | JTBD-01 |\n| Coordenador de Cobrança | Atualizar o status de regularização intraciclo para não abordar quem já regularizou | JTBD-07 |\n| Atendente de Cobrança | Enxergar tudo de um contribuinte em um lugar antes do contato | JTBD-01, JTBD-04 |\n\n### 2.2 Requisitos Funcionais\n\n| ID | Enunciado | Prioridade | RNs | Persona |\n|---|---|---|---|---|\n| RF-01 | Consolidar automática e periodicamente débitos de CCF, MPI/Big Data, IPVA, ITCD e SNE (N1.1, US2) | Must | RN-01, RN-12 | Coordenador |\n| RF-02 | Vincular débitos ao contribuinte e resolver sobreposição entre fontes (visão única, N1.7) | Must | RN-01 | Ambas |\n| RF-03 | Atualizar status de regularização/parcelamento intraciclo e encerrar ações ao regularizar (N1.8, US5) | Must | RN-02 | Coordenador |\n| RF-04 | Monitorar parcelamentos e alertar inadimplência parcial (risco de rompimento) (N1.8, US1) | Must | RN-02 | Ambas |\n| RF-05 | Exibir visão única do contribuinte em tela com abas (N1.7) | Must | RN-01 | Atendente |\n| RF-06 | Operar a transição MPI→Big Data sem ruptura da carteira (US12) | Should | RN-12 | Coordenador |\n| RF-07 | Expor status de cada integração (última sync, volume, erros) | Should | RN-10 | Coordenador |\n\n**Transversais aplicáveis:** RF-T-02 (busca/filtro), RF-T-03 (visão única — esta feature é a **lar**), RF-T-01 (exportação).\n\n### 2.3 Requisitos Não-Funcionais\n\n#### Performance\n- **RNF-P-01** — A consolidação completa da base (~1,8 mi contribuintes) deve caber na janela do ciclo (diária *(inferência)*) sem degradar T-ING-02.\n\n#### Conformidade\n- **RNF-C-01** — Esta feature é a **lar** de RNF-T-CONF-01 (validação de CPF/CNPJ na entrada) e RNF-T-CONF-02 (continuidade na transição de fonte).\n\n**Transversais aplicáveis:** RNF-T-PERF-01, RNF-T-PERF-02, RNF-T-DISP-01 (degradação por fonte — esta feature é a lar), RNF-T-OBS-01 (status de integração — lar), RNF-T-AUD-01, RNF-T-CONF-01/02 (lar).\n\n### 2.4 Cenários de Teste\n\n#### CT-01 — Consolidação periódica (verifica RF-01)\n- **Dado** fontes CCF e IPVA com débitos novos\n- **Quando** o ciclo de sincronização executa\n- **Então** os débitos aparecem consolidados na carteira, vinculados aos contribuintes, com fonte de origem registrada.\n\n#### CT-02 — Documento inválido rejeitado (verifica RF-02 / RNF-T-CONF-01)\n- **Dado** um registro com CPF de 10 dígitos\n- **Quando** a ingestão processa o registro\n- **Então** o registro é rejeitado, não gravado, e consta no log de rejeições.\n\n#### CT-03 — Regularização encerra abordagem (verifica RF-03 / RN-02)\n- **Dado** um débito em cobrança regularizado no CCF\n- **Quando** a atualização intraciclo executa\n- **Então** o status muda para regularizado e o contribuinte deixa de ser abordado naquele ciclo.\n\n#### CT-04 — Alerta de parcelamento em risco (verifica RF-04)\n- **Dado** um parcelamento com parcelas em atraso acima do limite\n- **Quando** o monitoramento roda\n- **Então** o sistema gera alerta de risco de rompimento na carteira/visão única.\n\n#### CT-05 — Degradação segura (verifica RNF-T-DISP-01)\n- **Dado** o MPI indisponível no ciclo\n- **Quando** a sincronização executa\n- **Então** as demais fontes consolidam normalmente e a fonte em falha é sinalizada em T-ING-01.\n\n#### CT-06 — Transição de fonte (verifica RF-06 / RN-12)\n- **Dado** a fonte ativa alternada de MPI para Big Data\n- **Quando** o ciclo executa com a nova fonte\n- **Então** a carteira mantém os mesmos contribuintes elegíveis, sem ruptura.\n\n---\n\n## 3. Dados\n\n> Modelo conceitual desta feature — referencia o transversal. Eixo `processo`: entidades derivam das atividades do fluxo (1.1).\n\n### 3.1 Entidades canônicas usadas\n- **Contribuinte** (ver [../modelo-dados.md](../modelo-dados.md)) — vinculado e enriquecido (visão única).\n- **Débito** — consolidado de múltiplas fontes; esta feature é a **lar**.\n- **Parcelamento** — monitorado quanto à inadimplência; lar.\n\n### 3.2 Entidades próprias da feature\n\n#### Execução de Sincronização  <!-- deriva de: atividade \"Conectar/Consolidar\"; referencia Débito de ../modelo-dados.md -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| fonte | texto | CCF / MPI / Big Data / IPVA / ITCD / SNE |\n| inicio / fim | data | Janela da execução |\n| registros_lidos | número | Volume processado |\n| registros_rejeitados | número | Inválidos (RNF-T-CONF-01) |\n| status | texto | OK / falha / parcial |\n\n#### Log de Rejeição  <!-- deriva de: decisão \"Documento válido?\" -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| documento | texto | Identificador rejeitado |\n| motivo | texto | Ex.: dígitos inválidos |\n| execucao_ref | referência | → Execução de Sincronização |\n\n### 3.3 Relações\n- Execução de Sincronização 1:N Débito (consolida) — entidades canônicas de ../modelo-dados.md.\n- Execução de Sincronização 1:N Log de Rejeição.\n\n---\n\n## Questões em aberto\n- ⚠ NÃO IDENTIFICADO — definir: frequência exata do ciclo (diária assumida) e regra de sobreposição entre fontes.\n\n## Fontes\n- Levantamento de Necessidades 2.6 (N1.1, N1.7, N1.8); Planning_Poker (US 1, 5, 12); Potenciais oportunidades P2.6.\n\n## Relacionado\n- [Visão do produto](../visao.md)\n- [Modelo de dados (transversal)](../modelo-dados.md)\n- [Requisitos transversais](../requisitos-transversais.md)\n- [Telas comuns (arquétipos)](../telas-comuns.md)\n- [Qualificação da Carteira](qualificacao-carteira.md)\n- [Cobrança Qualificada](cobranca-qualificada.md)\n- [Índice do wiki](../index.md)\n"}, "requisitos/monitoramento-kpis": {"title": "Monitoramento, KPIs e Grupo de Controle — Contrato", "path": "refined/Requisitos/monitoramento-kpis.md", "content": "# Monitoramento, KPIs e Grupo de Controle — Contrato\n\n> Documento único da Camada de Requisitos desta feature (3 capítulos).\n>\n> **Pense transversalmente.** Consulte: [Modelo de dados](../modelo-dados.md), [Requisitos transversais](../requisitos-transversais.md), [Telas comuns](../telas-comuns.md).\n>\n> **Eixo:** `processo` — fluxo de **apurar KPIs do ciclo, calcular o efeito incremental via grupo de controle e gerar insumos para a revisão da estratégia**.\n\n> **Regra de não-sobreposição:** persona+objetivo → §2.1; o que faz + RN → §2.2; prova → §2.4; entidades → [modelo-dados](../modelo-dados.md).\n\n---\n\n## 1. Telas & Fluxos\n\n### 1.1 Fluxo (Mermaid)\n\n```mermaid\nflowchart LR\n    Inicio([Fim de ciclo / atualização contínua]) --> A[Apurar regularizações por origem RN-08]\n    A --> B[Calcular KPIs por tributo/canal/instrumento/atendente]\n    B --> GC[Comparar carteira cobrada x grupo de controle RN-09]\n    GC --> INC[Calcular efeito incremental NSM]\n    INC --> P{Atingiu metas formais?}\n    P -->|não| AN[Gerar insumos analíticos p/ revisão N1.9/N2.7]\n    P -->|sim| Pub[Publicar painel por perfil RN-11]\n    AN --> Pub\n    Pub --> Fim([Decisão de ajuste de estratégia])\n```\n\n### 1.2 Telas detalhadas\n\n#### T-MON-01 — Painel Institucional de Cobrança\n- **Arquétipo:** A1 (Painel de Indicadores)\n- **Objetivo:** visão gerencial em tempo quase-real do ciclo do crédito (visão por perfil, RN-11).\n\n```wireframe\n# Painel Institucional\n[Ciclo v] [Tributo v] [Canal v] [Atendente v]\n[[ Identificados | Notificados | Regularizados | Incremental vs controle ]]\n(!) meta não atingida (ICMS/IPVA/ITCD)\n[~ tendência de regularização por ciclo ~]\ncard \"Por dimensão\":\n  | Dimensão | Regularizado | Meta | Δ |\n  | tributo | valor | meta | delta |\n[Exportar] [Trocar visão (coordenador/atendente)]\n```\n- **Conteúdo:** funil do crédito (identificado→notificado→regularizado→a regularizar); incremental vs. controle; metas por tributo.\n- **Ações:** filtrar, exportar (RF-T-01), trocar visão por perfil.\n- **Estados:** ciclo inicial (sem histórico); meta atingida/não.\n- **Navegação:** detalha em T-MON-02; configura em T-MON-03.\n- **Componentes:** toolbar, select, card, chart, table, button.\n\n#### T-MON-02 — Detalhe de Comunicações & Regularizações\n- **Arquétipo:** A2 (Lista / Fila com Filtros)\n- **Objetivo:** rastrear, no detalhe, a origem das regularizações e o desempenho das ações.\n\n```wireframe\n# Regularizações & Origem\n[Buscar____] [Origem v] [Canal v] [Instrumento v] [Período v]\n| Contribuinte | Valor | Origem | Canal | Instrumento | Data |\n| reg | reg | reg | reg | reg | reg |\n[Exportar]\n```\n- **Conteúdo:** regularizações marcadas por origem (espontânea vs. cobrança por canal/instrumento, RN-08).\n- **Ações:** filtrar, exportar.\n- **Estados:** vazio; consolidado.\n- **Navegação:** de T-MON-01.\n- **Componentes:** toolbar, input, select, table, button.\n\n#### T-MON-03 — Configuração de KPIs, Metas e Grupo de Controle\n- **Arquétipo:** A3 (Formulário de Configuração)\n- **Objetivo:** instrumentar KPIs, metas formais por tributo e parâmetros do grupo de controle (RN-09).\n\n```wireframe\n# KPIs, Metas & Grupo de Controle\ncard \"Metas por tributo\":\n  [ICMS meta____] [IPVA meta____] [ITCD meta____]\ncard \"Grupo de controle\":\n  [Tamanho/% ____] [Critério de sorteio v]\n(!) histórico de metas e versões\n[Salvar metas] [Configurar grupo de controle]\n```\n- **Conteúdo:** definição de KPIs e dimensões; metas por tributo; parâmetros do grupo de controle.\n- **Ações:** salvar metas (versionado); configurar grupo de controle.\n- **Estados:** sem metas definidas; vigente.\n- **Navegação:** de T-MON-01; coordena com Qualificação (que executa o sorteio).\n- **Componentes:** toolbar, card, input, select, banner, button.\n\n### 1.3 Diagrama de navegação (Mermaid)\n\n```mermaid\nflowchart TD\n    T_MON_01[T-MON-01 — Painel Institucional] -->|detalhar| T_MON_02[T-MON-02 — Regularizações]\n    T_MON_01 -->|configurar| T_MON_03[T-MON-03 — KPIs/Metas/Controle]\n    T_MON_03 -->|voltar| T_MON_01\n    T_MON_02 -->|voltar| T_MON_01\n```\n\n---\n\n## 2. Requisitos & Cenários de Teste\n\n> Origem: RN-08, RN-09, RN-11, RN-02. Horizonte: **H1** (grupo de controle automático: **H2** se depender de score).\n\n### 2.1 Personas & objetivos\n\n| Persona | Objetivo | JTBD |\n|---|---|---|\n| Coordenador de Cobrança | Acompanhar KPIs em tempo real e medir o efeito incremental da cobrança | JTBD-06 |\n| Atendente de Cobrança | Ver indicadores individuais (não comparativos) do próprio trabalho | JTBD-06 |\n\n### 2.2 Requisitos Funcionais\n\n| ID | Enunciado | Prioridade | RNs | Persona |\n|---|---|---|---|---|\n| RF-01 | Gerar painel com KPIs em tempo quase-real do ciclo do crédito (N1.6, US8) | Must | RN-02, RN-11 | Coordenador |\n| RF-02 | Instrumentar KPIs por tributo, canal, instrumento e atendente, com metas formais (US9, US10) | Must | RN-08 | Coordenador |\n| RF-03 | Identificar a origem da regularização (ativa vs. espontânea) (N1.6) | Must | RN-08 | Coordenador |\n| RF-04 | Calcular o efeito incremental comparando carteira cobrada x grupo de controle (US11) | Must | RN-09 | Coordenador |\n| RF-05 | Incluir IPVA e ITCD no monitoramento com metas (US10) | Should | RN-08 | Coordenador |\n| RF-06 | Oferecer visões distintas por perfil (coordenador completa; atendente individual) (US8) | Must | RN-11 | Ambas |\n| RF-07 | Gerar insumos analíticos para revisão da estratégia (N1.9, N2.7) | Should | RN-08 | Coordenador |\n\n**Transversais aplicáveis:** RF-T-01 (exportação), RF-T-02 (busca/filtro), RF-T-04 (marcação de origem — consumida).\n\n### 2.3 Requisitos Não-Funcionais\n\n#### Performance\n- **RNF-P-01** — Painel atualizado em tempo quase-real a partir do CCF/Oracle (diverge de RNF-T-PERF-01 ao exigir pipeline contínuo).\n\n**Transversais aplicáveis:** RNF-T-PERF-01, RNF-T-SEG-01 (visão por perfil), RNF-T-OBS-01, RNF-T-AUD-01.\n\n### 2.4 Cenários de Teste\n\n#### CT-01 — KPI em tempo quase-real (verifica RF-01)\n- **Dado** regularizações ocorridas no dia\n- **Quando** o pipeline atualiza\n- **Então** o painel reflete os novos valores sem extração manual.\n\n#### CT-02 — Origem da regularização (verifica RF-03/RN-08)\n- **Dado** um contribuinte que regularizou após notificação de e-mail\n- **Quando** o KPI é apurado\n- **Então** a regularização é contada como \"resposta à cobrança / canal e-mail\".\n\n#### CT-03 — Efeito incremental (verifica RF-04/RN-09)\n- **Dado** uma carteira cobrada e um grupo de controle do mesmo ciclo\n- **Quando** o cálculo executa\n- **Então** o efeito incremental = taxa da carteira cobrada − taxa do grupo de controle.\n\n#### CT-04 — Visão por perfil (verifica RF-06/RNF-T-SEG-01)\n- **Dado** um atendente acessando o painel\n- **Quando** ele abre a visão\n- **Então** vê apenas indicadores próprios, sem comparativo entre atendentes.\n\n#### CT-05 — Cobertura IPVA/ITCD (verifica RF-05)\n- **Dado** metas configuradas para IPVA e ITCD\n- **Quando** o painel é apurado\n- **Então** os três tributos (ICMS, IPVA, ITCD) aparecem com suas metas e resultados.\n\n---\n\n## 3. Dados\n\n> Eixo `processo`: entidades derivam das atividades de apuração.\n\n### 3.1 Entidades canônicas usadas\n- **Indicador (KPI)** (ver [../modelo-dados.md](../modelo-dados.md)) — esta feature é a **lar**.\n- **Débito** (origem_regularizacao), **Carteira** (grupo_controle), **Comunicação**, **Contribuinte** — referenciados.\n\n### 3.2 Entidades próprias da feature\n\n#### Apuração de Ciclo  <!-- deriva de: atividade \"Apurar/Comparar\"; referencia Indicador/Carteira -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| id | identificador | Chave |\n| ciclo | texto | Período |\n| taxa_cobrada | número | Regularização da carteira cobrada |\n| taxa_controle | número | Regularização do grupo de controle |\n| efeito_incremental | número | Diferença (NSM) |\n\n#### Meta  <!-- deriva de: atividade \"Metas formais\"; referencia Indicador -->\n| Campo | Tipo | Descrição |\n|---|---|---|\n| tributo | texto | ICMS / IPVA / ITCD |\n| valor_meta | número | Meta do ciclo |\n| versao | texto | Versionada (RNF-T-AUD-02) |\n\n### 3.3 Relações\n- Apuração de Ciclo 1:N Indicador; Meta 1:1 Indicador (por dimensão tributo). Entidades canônicas de ../modelo-dados.md.\n\n---\n\n## Questões em aberto\n- ⚠ NÃO IDENTIFICADO — definir: modelo de atribuição causal por canal e janela (30d assumido); fonte do pipeline em tempo real (CCF/Oracle confirmado?).\n\n## Fontes\n- Levantamento de Necessidades 2.6 (N1.6, N1.9, N2.6, N2.7); Planning_Poker (US 8, 9, 10, 11); Executivo Soluções.\n\n## Relacionado\n- [Visão do produto](../visao.md)\n- [Modelo de dados (transversal)](../modelo-dados.md)\n- [Requisitos transversais](../requisitos-transversais.md)\n- [Telas comuns (arquétipos)](../telas-comuns.md)\n- [Réguas de Cobrança](reguas-cobranca.md)\n- [Qualificação da Carteira](qualificacao-carteira.md)\n- [Índice do wiki](../index.md)\n"}, "requisitos/qualificacao-carteira": {"title": "Qualificação e Parametrização da Carteira — Contrato", "path": "refined/Requisitos/qualificacao-carteira.md", "content": "# Qualificação e Parametrização da Carteira — Contrato\n\n> Documento único da Camada de Requisitos desta feature (3 capítulos).\n>\n> **Pense transversalmente.** Consulte: [Modelo de dados](../modelo-dados.md), [Requisitos transversais](../requisitos-transversais.md), [Telas comuns](../telas-comuns.md).\n>\n> **Eixo:** `processo` — fluxo de **definir critérios parametrizáveis, segmentar a carteira (massificada vs. qualificada), reservar grupo de controle e publicar versões auditáveis**.\n\n> **Regra de não-sobreposição:** persona+objetivo → §2.1; o que faz + RN → §2.2; prova → §2.4; entidades canônicas → [modelo-dados](../modelo-dados.md).\n\n---\n\n## 1. Telas & Fluxos\n\n### 1.1 Fluxo (Mermaid)\n\n```mermaid\nflowchart LR\n    Inicio([Novo ciclo / revisão de estratégia]) --> A[Definir critérios: valor, tributo, atraso, instrumento, exclusões, threshold de score RN-03]\n    A --> SC{Score de liquidez disponível?}\n    SC -->|sim| WS[Incluir score como critério RN-AI-01]\n    SC -->|não| WD[Usar só critérios determinísticos fallback]\n    WS --> SEG[Segmentar base: massificada vs qualificada RN-04]\n    WD --> SEG\n    SEG --> GC[Sortear grupo de controle RN-09]\n    GC --> PV[Validar e publicar versão dos critérios RNF-T-AUD-02]\n    PV --> CART([Carteiras formadas e disponíveis p/ réguas e fila])\n```\n\n### 1.2 Telas detalhadas\n\n#### T-QC-01 — Configuração de Critérios de Qualificação\n- **Arquétipo:** A3 (Formulário de Configuração + versionamento)\n- **Objetivo:** parametrizar e versionar os critérios de formação de carteira (RN-03).\n\n```wireframe\n# Critérios de Qualificação\ncard \"Parâmetros\":\n  [Valor mínimo____] [Tributo v]\n  [Tempo de atraso (dias)____] [Instrumento v]\n  [Threshold de score____]\n  - excluir devedores contumazes\n  - reservar grupo de controle (%)\n(!) regras inválidas/conflitantes\n[Tipo alvo v: massificada/qualificada]\n[Validar] [Publicar versão] [Ver histórico de versões]\n```\n- **Conteúdo:** condições parametrizáveis; campo de threshold de score (habilitado se score disponível); % de grupo de controle.\n- **Ações:** validar, publicar versão (imutável), ver histórico (RNF-T-AUD-02).\n- **Estados:** rascunho; conflito de regras; publicado.\n- **Navegação:** abre prévia (T-QC-02).\n- **Componentes:** toolbar, card, input, select, checkbox, banner, button.\n\n#### T-QC-02 — Prévia da Carteira Segmentada\n- **Arquétipo:** A2 (Lista / Fila com Filtros)\n- **Objetivo:** revisar o resultado da aplicação dos critérios antes de publicar.\n\n```wireframe\n# Prévia da Carteira\n[[ Massificada: n | Qualificada: n | Grupo de controle: n ]]\n[Buscar____] [Segmento v] [Tributo v]\n| Contribuinte | Tributo | Valor | Score | Segmento | Controle? |\n| reg | reg | reg | reg | reg | reg |\n[Confirmar segmentação] [Exportar prévia]\n```\n- **Conteúdo:** contagens por segmento e grupo de controle; lista com segmento atribuído.\n- **Ações:** confirmar; exportar (RF-T-01); ajustar e revalidar.\n- **Estados:** prévia vazia (critérios muito restritivos); pronta.\n- **Navegação:** de T-QC-01; alimenta Réguas e Cobrança Qualificada.\n- **Componentes:** toolbar, card, input, select, table, button.\n\n### 1.3 Diagrama de navegação (Mermaid)\n\n```mermaid\nflowchart TD\n    T_QC_01[T-QC-01 — Critérios] -->|gerar prévia| T_QC_02[T-QC-02 — Prévia Segmentada]\n    T_QC_02 -->|ajustar| T_QC_01\n    T_QC_02 -->|confirmar| T_REG_02[Réguas — Execução]\n    T_QC_02 -->|confirmar| T_CQ_02[Cobrança Qualificada — Fila]\n```\n\n---\n\n## 2. Requisitos & Cenários de Teste\n\n> Origem: RN-03, RN-04, RN-09, RN-AI-01. Horizonte: **H1** (score: **H2**).\n\n### 2.1 Personas & objetivos\n\n| Persona | Objetivo | JTBD |\n|---|---|---|\n| Coordenador de Cobrança | Selecionar quem cobrar por critérios auditáveis e replicáveis | JTBD-02 |\n| Coordenador de Cobrança | Medir efeito incremental reservando grupo de controle automaticamente | JTBD-06 |\n\n### 2.2 Requisitos Funcionais\n\n| ID | Enunciado | Prioridade | RNs | Persona |\n|---|---|---|---|---|\n| RF-01 | Parametrizar critérios de qualificação (valor, tributo, atraso, instrumento, exclusões) (N1.2, US3) | Must | RN-03 | Coordenador |\n| RF-02 | Versionar critérios; registrar versão aplicada a cada carteira (N1.2, US3) | Must | RN-03 | Coordenador |\n| RF-03 | Segmentar a base entre massificada e qualificada por valor/risco/histórico (N1.4, N2.4) | Must | RN-04 | Coordenador |\n| RF-04 | Sortear automaticamente o grupo de controle por ciclo (N — diagnóstico) | Must | RN-09 | Coordenador |\n| RF-05 | Incluir o score de liquidez como critério/threshold quando disponível (N1.2, US14) | Should | RN-AI-01 | Coordenador |\n| RF-06 | Gerar prévia da carteira segmentada antes de publicar | Should | RN-03, RN-04 | Coordenador |\n\n**Transversais aplicáveis:** RF-T-01 (exportação), RF-T-02 (busca/filtro), RF-T-03 (visão única).\n\n### 2.3 Requisitos Não-Funcionais\n\n#### Auditoria\n- **RNF-A-01** — Esta feature é a **lar** de RNF-T-AUD-02 (versionamento de critérios; versão imutável após publicação).\n\n**Transversais aplicáveis:** RNF-T-AUD-01, RNF-T-AUD-02 (lar), RNF-T-SEG-01, RNF-T-PERF-02, RNF-T-DISP-01 (fallback de score).\n\n### 2.4 Cenários de Teste\n\n#### CT-01 — Critério parametrizado forma carteira (verifica RF-01/RF-03)\n- **Dado** critérios \"ICMS, valor ≥ R$ 500 mil, atraso ≥ 90d, excluir contumazes\"\n- **Quando** o coordenador gera a prévia\n- **Então** apenas contribuintes que atendem os critérios entram na carteira qualificada.\n\n#### CT-02 — Versionamento imutável (verifica RF-02 / RNF-T-AUD-02)\n- **Dado** uma versão de critérios publicada e aplicada a uma carteira\n- **Quando** o coordenador edita os critérios\n- **Então** uma nova versão é criada; a carteira existente mantém a versão original registrada.\n\n#### CT-03 — Grupo de controle sorteado (verifica RF-04 / RN-09)\n- **Dado** uma carteira com % de grupo de controle configurado\n- **Quando** a segmentação executa\n- **Então** o subconjunto sorteado é marcado como controle e excluído das ações de cobrança.\n\n#### CT-04 — Score como critério com fallback (verifica RF-05 / RN-AI-01)\n- **Dado** o score de liquidez indisponível\n- **Quando** o coordenador publica critérios que usam threshold de score\n- **Então** a segmentação opera apenas com os critérios determinísticos e marca os contribuintes como \"sem score\".\n\n#### CT-05 — Desempate massificada/qualificada (verifica RF-03 / RN-04)\n- **Dado** um contribui
