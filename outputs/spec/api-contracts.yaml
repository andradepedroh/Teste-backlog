                    - chaveOrigem: MPI-2026-000123
                      lista: debitos
                      situacao: ACEITO
                    - chaveOrigem: MPI-2026-000124
                      lista: debitos
                      situacao: REJEITADO
                      motivo: DOC_INVALIDO
                      detalhe: Dígito verificador do CPF não confere.
