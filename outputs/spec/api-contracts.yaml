                    codigo: ERRO_INTERNO
components:
  securitySchemes:
    OAuthFonte:
      type: oauth2
      description: 'OAuth 2.0 com um usuário de integração por fonte e REST API Access Policy: cada fonte só alcança o próprio
        endpoint (SEC-001). O usuário de integração não tem papel de aplicação.'
      flows:
        clientCredentials:
          tokenUrl: https://instancia-dev.service-now.com/oauth_token.do
          scopes:
            ingestao.ccf: Enviar lotes da fonte Conta Corrente Fiscal (CCF)
            ingestao.mpi: Enviar lotes da fonte MPI (legado em descontinuação)
            ingestao.bigdata: Enviar lotes da fonte Big Data (P2.2)
            ingestao.ipva: Enviar lotes da fonte Sistema IPVA
            ingestao.itcd: Enviar lotes da fonte GIA-ITCD
            ingestao.sne: Enviar lotes da fonte SNE / DT-e
            ingestao.score: Enviar lotes da fonte UFMT (modelo de score)
    OAuthProvedor:
      type: oauth2
      description: Credencial OAuth 2.0 própria do provedor de mensagens, só para o retorno de status (SEC-008). Mecanismo
        a confirmar com o provedor escolhido (GAP-004).
      flows:
        clientCredentials:
          tokenUrl: https://instancia-dev.service-now.com/oauth_token.do
          scopes:
            provedor.status: Informar status de entrega de mensagens
  parameters:
    IdLoteOrigem:
      name: idLoteOrigem
      in: path
      required: true
      description: Identificador do lote na origem, o mesmo usado na abertura.
      schema:
        type: string
        minLength: 1
        maxLength: 60
        pattern: ^[A-Za-z0-9._-]+$
      example: LOTE-20261113-01
    Sequencia:
      name: sequencia
      in: path
      required: true
      description: Número do pacote dentro do lote, a partir de 1, sem pular.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
      example: 1
  schemas:
    Problem:
      type: object
      description: Erro da requisição inteira no formato RFC 7807 (Problem Details — o padrão de erro em JSON da IETF), com
        mensagem em português e sem detalhe interno (SEC-016).
      required:
      - type
      - title
      - status
      - codigo
      properties:
        type:
          type: string
          format: uri
          description: Identificador do tipo do erro.
          example: urn:x_cbi:erro:lote-nao-encontrado
        title:
          type: string
          description: Resumo curto do erro, em português.
          example: Lote não encontrado
        status:
          type: integer
          description: Código HTTP repetido no corpo.
          example: 404
        detail:
          type: string
          description: O que aconteceu nesta chamada e o que fazer, em português.
          example: Não existe lote aberto com este identificador para esta fonte.
        instance:
          type: string
          description: Caminho da requisição que falhou.
          example: /ingestao/ccf/lotes/LOTE-20261113-01/pacotes/1
        codigo:
          type: string
          enum:
          - CORPO_INVALIDO
          - NAO_AUTENTICADO
          - ACESSO_NEGADO
          - LOTE_NAO_ENCONTRADO
          - LOTE_JA_FECHADO
          - FECHAMENTO_DIVERGENTE
          - PACOTE_DIVERGENTE
          - PACOTE_GRANDE_DEMAIS
          - SEQUENCIA_INVALIDA
          - PACOTES_FALTANTES
          - COMUNICACAO_NAO_ENCONTRADA
          - LIMITE_EXCEDIDO
          - ERRO_INTERNO
          description: Código tipado do erro — lista fechada; o parceiro decide o que fazer por este código, nunca pelo texto.
          example: LOTE_NAO_ENCONTRADO
        x-rn-violada:
          type: string
          description: Regra de negócio violada, quando houver.
          example: RN-NOVO-ING-005
        campo:
          type: string
          description: Campo com problema, quando o erro é de um campo.
          example: idLoteOrigem
        sequenciaEsperada:
          type: integer
          description: Número do próximo pacote esperado (só em SEQUENCIA_INVALIDA).
          example: 3
        pacotesFaltantes:
          type: array
          items:
            type: integer
          maxItems: 1000
          description: Números dos pacotes que não chegaram (só em PACOTES_FALTANTES).
          example:
          - 2
    AberturaLote:
      type: object
      description: 'Dados para abrir um lote. O identificador do lote na origem é a chave: abrir de novo o mesmo lote devolve
        o lote já aberto, sem criar outro.'
      additionalProperties: false
      required:
      - idLoteOrigem
      - dataReferencia
      properties:
        idLoteOrigem:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9._-]+$
          description: Identificador do lote no sistema de origem. Letras, números, ponto, hífen e sublinhado.
          example: LOTE-20261113-01
        dataReferencia:
          type: string
          format: date
          description: Dia de referência dos dados do lote.
          example: '2026-11-13'
        pacotesPrevistos:
          type: integer
          minimum: 1
          maximum: 100000
          description: Quantos pacotes a fonte pretende enviar, se já souber. Serve para recusar pacote fora da faixa logo
            na chegada.
          example: 3
    AberturaLoteScore:
      type: object
      description: 'Abertura do lote de score: igual à das outras fontes, mais a versão do modelo.'
      additionalProperties: false
      required:
      - idLoteOrigem
      - dataReferencia
      properties:
        idLoteOrigem:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9._-]+$
          description: Identificador do lote no sistema de origem. Letras, números, ponto, hífen e sublinhado.
          example: LOTE-20261113-01
        dataReferencia:
          type: string
          format: date
          description: Dia de referência dos dados do lote.
          example: '2026-11-13'
        pacotesPrevistos:
          type: integer
          minimum: 1
          maximum: 100000
          description: Quantos pacotes a fonte pretende enviar, se já souber. Serve para recusar pacote fora da faixa logo
            na chegada.
          example: 3
        versaoModelo:
          type: string
          maxLength: 20
          description: Versão do modelo de score usada no lote. Pode vir na abertura ou no fechamento; sem ela o lote não
            fecha (RF-MOD-SCORE-01).
          example: '2.1'
    Lote:
      type: object
      description: 'Situação de um lote: quantos pacotes chegaram e quantos registros foram aceitos ou rejeitados até agora.'
      required:
      - idLoteOrigem
      - fonte
      - situacao
      - pacotesRecebidos
      - lidos
      - aceitos
      - rejeitados
      - inicio
      properties:
        idLoteOrigem:
          type: string
          maxLength: 60
          example: LOTE-20261113-01
        fonte:
          type: string
          maxLength: 20
          description: Código da fonte dona do lote.
          example: ccf
        situacao:
          type: string
          enum:
          - EM_ANDAMENTO
          - OK
          - PARCIAL
          - FALHA
          description: 'EM_ANDAMENTO: aberto, recebendo pacotes. OK: fechado sem rejeição. PARCIAL: fechado com registros
            rejeitados. FALHA: não fechou até o prazo da fonte (o fechamento do ciclo marca).'
          example: EM_ANDAMENTO
        pacotesPrevistos:
          type: integer
          nullable: true
          example: 3
        pacotesRecebidos:
          type: integer
          example: 0
        lidos:
          type: integer
          description: Registros recebidos em todos os pacotes.
          example: 0
        aceitos:
          type: integer
          example: 0
        rejeitados:
          type: integer
          example: 0
        inicio:
          type: string
          format: date-time
          example: '2026-11-13T02:00:00-04:00'
        fim:
          type: string
          format: date-time
          nullable: true
          example: null
    RegistroDebito:
      type: object
      description: Um débito enviado pela fonte. O mesmo idOrigem da mesma fonte atualiza o débito (por exemplo, valor novo
        ou regularização), nunca cria outro.
      additionalProperties: false
      required:
      - idOrigem
      - documento
      - nome
      - tributo
      - valor
      - vencimento
      - situacao
      properties:
        idOrigem:
          type: string
          minLength: 1
          maxLength: 40
          description: 'Identificador do registro no sistema de origem. É a chave natural: o mesmo identificador da mesma
            fonte atualiza o registro, nunca duplica (RN-NOVO-ING-005).'
          example: CCF-2026-000123
        documento:
          type: string
          pattern: ^([0-9]{11}|[0-9]{14})$
          maxLength: 14
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), só números. Documento com dígito verificador inválido é rejeitado
            com DOC_INVALIDO (RN-NOVO-ING-004).
          example: '52998224725'
        nome:
          type: string
          minLength: 1
          maxLength: 150
          description: Nome ou razão social do contribuinte.
          example: Contribuinte Sintético da Silva
        tributo:
          type: string
          enum:
          - ICMS_NORMAL
          - ICMS_ST
          - IPVA
          - ITCD
          description: Tributo do débito.
          example: ICMS_NORMAL
        valor:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 999999999999.99
          description: Valor em aberto, em reais.
          example: 1520.75
        vencimento:
          type: string
          format: date
          example: '2026-09-10'
        instrumento:
          type: string
          enum:
          - AUTO_INFRACAO
          - DECLARACAO
          - OUTRO
          description: Como o débito foi constituído.
          example: DECLARACAO
        situacao:
          type: string
          enum:
          - EM_ABERTO
          - PARCELADO
          - REGULARIZADO
          description: Situação do débito na origem. REGULARIZADO encerra a abordagem no ciclo (RN-NOVO-ING-002).
          example: EM_ABERTO
        dataRegularizacao:
          type: string
          format: date
          description: Obrigatória quando a situação é REGULARIZADO.
          example: '2026-11-12'
        contumaz:
          type: boolean
          description: Marca de devedor contumaz vinda da fonte (usada na exclusão da carteira enquanto o Credep não é integrado).
          example: false
        dataAlteracao:
          type: string
          format: date-time
          description: Quando o débito mudou na origem (carga incremental da CCF).
          example: '2026-11-12T18:40:00-04:00'
    RegistroParcelamento:
      type: object
      description: Um parcelamento enviado pela CCF. O número de parcelas em atraso alimenta o alerta de parcelamento em risco
        (RF-MOD-INGESTAO-10).
      additionalProperties: false
      required:
      - idOrigem
      - numero
      - documento
      - tributo
      - parcelasTotal
      - valor
      - situacao
      properties:
        idOrigem:
          type: string
          minLength: 1
          maxLength: 40
          description: 'Identificador do registro no sistema de origem. É a chave natural: o mesmo identificador da mesma
            fonte atualiza o registro, nunca duplica (RN-NOVO-ING-005).'
          example: CCF-2026-000123
        numero:
          type: string
          maxLength: 20
          description: Número do parcelamento na origem.
          example: PAR-2026-00042
        documento:
          type: string
          pattern: ^([0-9]{11}|[0-9]{14})$
          maxLength: 14
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), só números. Documento com dígito verificador inválido é rejeitado
            com DOC_INVALIDO (RN-NOVO-ING-004).
          example: '52998224725'
        tributo:
          type: string
          enum:
          - ICMS_NORMAL
          - ICMS_ST
          - IPVA
          - ITCD
          example: ICMS_NORMAL
        parcelasTotal:
          type: integer
          minimum: 1
          maximum: 999
          example: 24
        parcelasPagas:
          type: integer
          minimum: 0
          maximum: 999
          example: 10
        parcelasEmAtraso:
          type: integer
          minimum: 0
          maximum: 999
          example: 2
        valor:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 999999999999.99
          example: 48000.0
        situacao:
          type: string
          enum:
          - ATIVO
          - EM_RISCO
          - ENCERRADO
          example: EM_RISCO
    RegistroSinalizacao:
      type: object
      description: 'Uma sinalização de cobrança coercitiva (protesto, notificação) enviada pela SNE. É só informativa: o produto
        mostra no dossiê e não oferece ação sobre ela (RN-NOVO-ING-007).'
      additionalProperties: false
      required:
      - idOrigem
      - documento
      - tipo
      - data
      - ativa
      properties:
        idOrigem:
          type: string
          minLength: 1
          maxLength: 40
          description: 'Identificador do registro no sistema de origem. É a chave natural: o mesmo identificador da mesma
            fonte atualiza o registro, nunca duplica (RN-NOVO-ING-005).'
          example: CCF-2026-000123
        documento:
          type: string
          pattern: ^([0-9]{11}|[0-9]{14})$
          maxLength: 14
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), só números. Documento com dígito verificador inválido é rejeitado
            com DOC_INVALIDO (RN-NOVO-ING-004).
          example: '52998224725'
        idDebitoOrigem:
          type: string
          maxLength: 40
          description: Débito a que a sinalização se refere, quando houver.
          example: SNE-DEB-778
        tipo:
          type: string
          enum:
          - PROTESTO_PGE
          - NOTIFICACAO_COERCITIVA
          - OUTRO
          example: PROTESTO_PGE
        data:
          type: string
          format: date
          example: '2026-10-30'
        ativa:
          type: boolean
          description: false quando a fonte encerra a sinalização; ela passa para o histórico.
          example: true
        descricao:
          type: string
          maxLength: 300
          example: Protesto enviado pela PGE
    RegistroScore:
      type: object
      description: O score de liquidez de um contribuinte. Documento sem contribuinte na base é rejeitado com CONTRIB_NAO_ENCONTRADO.
      additionalProperties: false
      required:
      - documento
      - valor
      properties:
        documento:
          type: string
          pattern: ^([0-9]{11}|[0-9]{14})$
          maxLength: 14
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), só números. Documento com dígito verificador inválido é rejeitado
            com DOC_INVALIDO (RN-NOVO-ING-004).
          example: '52998224725'
        valor:
          type: number
          format: double
          minimum: 0
          maximum: 1000
          description: Valor do score. A escala exata depende do modelo da UFMT (ver questões em aberto).
          example: 712.5
    ResultadoRegistro:
      type: object
      description: 'O que aconteceu com um registro do pacote: aceito, ou rejeitado com o motivo da lista fechada (RN-NOVO-ING-004).'
      required:
      - chaveOrigem
      - situacao
      properties:
        chaveOrigem:
          type: string
          maxLength: 60
          description: idOrigem do registro (ou o documento, no score).
          example: CCF-2026-000124
        lista:
          type: string
          enum:
          - debitos
          - parcelamentos
          - sinalizacoes
          - scores
          example: debitos
        situacao:
          type: string
          enum:
          - ACEITO
          - REJEITADO
          example: REJEITADO
        motivo:
          type: string
          enum:
          - DOC_INVALIDO
          - CAMPO_AUSENTE
          - CONTRIB_NAO_ENCONTRADO
          - FORMATO_INVALIDO
          - OUTRO
          description: Só quando REJEITADO.
          example: DOC_INVALIDO
        detalhe:
          type: string
          maxLength: 300
          description: Explicação curta em português, sem dado pessoal.
          example: Dígito verificador do CPF não confere.
    ResultadoPacote:
      type: object
      description: 'Resposta a um pacote: contagem e o resultado de cada registro. Reenviar o mesmo pacote devolve esta mesma
        resposta, sem gravar de novo.'
      required:
      - idLoteOrigem
      - sequencia
      - recebidos
      - aceitos
      - rejeitados
      - resultados
      properties:
        idLoteOrigem:
          type: string
          maxLength: 60
          example: LOTE-20261113-01
        sequencia:
          type: integer
          example: 1
        reenvio:
          type: boolean
          description: true quando este pacote já tinha sido recebido e nada foi gravado de novo.
          example: false
        recebidos:
          type: integer
          example: 2
        aceitos:
          type: integer
          example: 1
        rejeitados:
          type: integer
          example: 1
        resultados:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ResultadoRegistro'
          example:
          - chaveOrigem: CCF-2026-000124
            lista: debitos
            situacao: REJEITADO
            motivo: DOC_INVALIDO
            detalhe: Dígito verificador do CPF não confere.
    FechamentoLote:
      type: object
      description: 'Fechamento do lote: a fonte informa quantos pacotes enviou.'
      additionalProperties: false
      required:
      - pacotesEnviados
      properties:
        pacotesEnviados:
          type: integer
          minimum: 0
          maximum: 100000
          description: Total de pacotes enviados no lote. Zero vale para dia sem dados.
          example: 3
    FechamentoLoteMpi:
      type: object
      description: 'Fechamento do lote do MPI: além do total de pacotes, o percentual de regras já migradas para o Big Data.'
      additionalProperties: false
      required:
      - pacotesEnviados
      properties:
        pacotesEnviados:
          type: integer
          minimum: 0
          maximum: 100000
          example: 3
        percentualMigracao:
          type: number
          minimum: 0
          maximum: 100
          description: Percentual das regras do MPI já migradas para o Big Data; aparece na fonte MPI (RF-MOD-INGESTAO-11).
          example: 60
    FechamentoLoteScore:
      type: object
      description: 'Fechamento do lote de score: a versão do modelo é obrigatória se não veio na abertura. Sem ela o sistema
        recusa o fechamento e informa o campo.'
      additionalProperties: false
      required:
      - pacotesEnviados
      properties:
        pacotesEnviados:
          type: integer
          minimum: 0
          maximum: 100000
          example: 3
        versaoModelo:
          type: string
          maxLength: 20
          example: '2.1'
    EventoEntrega:
      type: object
      description: Status de entrega informado pelo provedor de mensagens para uma comunicação já enviada.
      additionalProperties: false
      required:
      - idProvedor
      - situacao
      - dataEvento
      properties:
        idProvedor:
          type: string
          minLength: 1
          maxLength: 60
          description: Identificador que o provedor devolveu no envio.
          example: msg-8f3a2c
        canal:
          type: string
          enum:
          - EMAIL
          - SMS
          - WHATSAPP
          example: SMS
        situacao:
          type: string
          enum:
          - ENTREGUE
          - LIDO
          - FALHA
          example: ENTREGUE
        dataEvento:
          type: string
          format: date-time
          example: '2026-11-13T09:15:00-04:00'
        detalhe:
          type: string
          maxLength: 300
          description: Motivo da falha, quando houver, sem dado pessoal.
          example: Número inexistente
    ResultadoEventoEntrega:
      type: object
      description: 'Resposta ao status: a situação atual da comunicação e se ela mudou. Status repetido ou mais antigo que
        o atual não muda nada.'
      required:
      - idProvedor
      - situacaoAtual
      - alterado
      properties:
        idProvedor:
          type: string
          maxLength: 60
          example: msg-8f3a2c
        situacaoAtual:
          type: string
          enum:
          - ENVIADO
          - ENTREGUE
          - LIDO
          - FALHA
          - FALHA_DEFINITIVA
          example: ENTREGUE
        alterado:
          type: boolean
          example: true
    PacoteCcf:
