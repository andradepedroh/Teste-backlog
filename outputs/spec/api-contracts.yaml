# Contratos de API da Cobrança Inteligente — gerado por spec-api-contracts. Não editar à mão: regerar.
openapi: 3.0.3
info:
  title: APIs da Cobrança Inteligente — SEFAZ-MT
  version: 1.0.0
  description: 'Contrato das APIs que os sistemas parceiros chamam na aplicação Cobrança Inteligente (escopo x_cbi_ no ServiceNow).
    São dois grupos: as 7 APIs de ingestão, uma por fonte, em que cada fonte abre um lote, envia pacotes numerados de registros
    e fecha o lote; e o retorno de status de entrega do provedor de mensagens. As telas usam a interface nativa do ServiceNow
    e não têm API própria neste contrato. Erro da requisição inteira vem no formato RFC 7807 com código tipado; erro de um
    registro vem dentro da resposta 200 do pacote, com o motivo.'
  contact:
    name: Equipe da Cobrança Inteligente
  license:
    name: Uso interno SEFAZ-MT
    url: https://www.sefaz.mt.gov.br
servers:
- url: https://{instancia}.service-now.com/api/x_cbi/v1
  description: Instância ServiceNow da SEFAZ-MT; o nome da instância muda por ambiente (desenvolvimento, homologação, produção).
  variables:
    instancia:
      default: instancia-dev
      description: Nome da instância ServiceNow do ambiente.
tags:
- name: Ingestão — Conta Corrente Fiscal (CCF)
  description: Recebe débitos e parcelamentos de ICMS da fonte Conta Corrente Fiscal (CCF) (integração INT-01). Maior volume;
    carga incremental por data de alteração (ETF §6.3).
- name: Ingestão — MPI (legado em descontinuação)
  description: Recebe débitos de ICMS ST da fonte MPI (legado em descontinuação) (integração INT-02). No fechamento a fonte
    informa quanto das regras já migrou para o Big Data (RF-MOD-INGESTAO-11).
- name: Ingestão — Big Data (P2.2)
  description: Recebe débitos migrados do MPI da fonte Big Data (P2.2) (integração INT-03). Débito que já veio pelo MPI com
    a mesma chave natural conta uma vez só (RN-NOVO-ING-003).
- name: Ingestão — Sistema IPVA
  description: Recebe débitos de IPVA da fonte Sistema IPVA (integração INT-04). Volume alto; maioria de pessoa física.
- name: Ingestão — GIA-ITCD
  description: Recebe débitos de ITCD da fonte GIA-ITCD (integração INT-05). Menor volume; o ITCD não tem score.
- name: Ingestão — SNE / DT-e
  description: 'Recebe débitos e sinalizações de cobrança coercitiva da fonte SNE / DT-e (integração INT-06). A sinalização
    é só informativa: aparece no dossiê, sem ação disponível (RN-NOVO-ING-007).'
- name: Ingestão — UFMT (modelo de score)
  description: Recebe o score de liquidez por contribuinte da fonte UFMT (modelo de score) (integração INT-07). Cada lote
    traz a versão do modelo; ao fechar, o score de cada contribuinte encontrado vira o vigente (RF-MOD-SCORE-01).
- name: Retorno do provedor de mensagens
  description: Recebe do provedor o status de entrega das mensagens enviadas pela régua (integração INT-09).
security:
- OAuthFonte: []
paths:
  /ingestao/ccf/lotes:
    post:
      operationId: abrirLoteCcf
      tags:
      - Ingestão — Conta Corrente Fiscal (CCF)
      summary: Abrir um lote de carga da fonte Conta Corrente Fiscal (CCF)
      description: Abre um lote para a fonte Conta Corrente Fiscal (CCF) enviar débitos e parcelamentos de ICMS e devolve
        o lote criado. Se o mesmo identificador de lote já estiver aberto, devolve o lote existente (200) sem criar outro;
        se já estiver fechado, recusa com 409. Maior volume; carga incremental por data de alteração (ETF §6.3). Integração
        INT-01.
      security:
      - OAuthFonte:
        - ingestao.ccf
      requestBody:
        required: true
        description: Corpo em JSON conforme o schema abaixo; campos fora do contrato são recusados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AberturaLote'
            examples:
              abertura:
                summary: Abertura do lote do dia
                value:
                  idLoteOrigem: LOTE-20261113-01
                  dataReferencia: '2026-11-13'
                  pacotesPrevistos: 3
      responses:
        '201':
          description: Lote aberto. O cabeçalho Location aponta para o lote.
          headers:
            Location:
              description: Caminho do lote criado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lote'
              examples:
                criado:
                  summary: Lote novo
                  value:
                    idLoteOrigem: LOTE-20261113-01
                    fonte: ccf
                    situacao: EM_ANDAMENTO
                    pacotesPrevistos: 3
                    pacotesRecebidos: 0
                    lidos: 0
                    aceitos: 0
                    rejeitados: 0
                    inicio: '2026-11-13T02:00:00-04:00'
                    fim: null
        '200':
          description: O lote com este identificador já estava aberto; nada foi criado e o lote existente volta na resposta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lote'
        '400':
          description: 'Corpo inválido: falta campo obrigatório ou um campo está fora do formato.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CORPO_INVALIDO:
                  summary: Corpo da requisição inválido
                  value:
                    type: urn:x_cbi:erro:corpo-invalido
                    title: Corpo da requisição inválido
                    status: 400
                    detail: O corpo não é um JSON válido, falta campo obrigatório da requisição ou um campo está fora do formato.
                      O campo com problema vem em «campo».
                    codigo: CORPO_INVALIDO
                    campo: idLoteOrigem
        '401':
          description: Token ausente, vencido ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NAO_AUTENTICADO:
                  summary: Não autenticado
                  value:
                    type: urn:x_cbi:erro:nao-autenticado
                    title: Não autenticado
                    status: 401
                    detail: O token OAuth está ausente, vencido ou inválido. Peça um token novo e repita a chamada.
                    codigo: NAO_AUTENTICADO
        '403':
          description: O usuário de integração não pertence a esta fonte; nada foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ACESSO_NEGADO:
                  summary: Acesso negado a este endpoint
                  value:
                    type: urn:x_cbi:erro:acesso-negado
                    title: Acesso negado a este endpoint
                    status: 403
                    detail: 'O usuário de integração não tem permissão neste endpoint: cada fonte só envia pela própria API.
                      Nada foi gravado.'
                    codigo: ACESSO_NEGADO
                    x-rn-violada: RN-NOVO-ING-008
        '409':
          description: O lote com este identificador já foi fechado e não pode ser reaberto.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOTE_JA_FECHADO:
                  summary: Lote já fechado
                  value:
                    type: urn:x_cbi:erro:lote-ja-fechado
                    title: Lote já fechado
                    status: 409
                    detail: O lote já foi fechado. Um lote fechado não recebe pacotes nem pode ser reaberto; para corrigir
                      dados, envie um lote novo.
                    codigo: LOTE_JA_FECHADO
                    x-rn-violada: RN-NOVO-ING-005
        '429':
          description: O usuário de integração passou do limite de requisições; espere o tempo indicado e repita.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LIMITE_EXCEDIDO:
                  summary: Limite de requisições excedido
                  value:
                    type: urn:x_cbi:erro:limite-excedido
                    title: Limite de requisições excedido
                    status: 429
                    detail: O usuário de integração passou do limite de requisições. Espere o tempo de «Retry-After» e repita;
                      nada desta requisição foi gravado.
                    codigo: LIMITE_EXCEDIDO
          headers:
            Retry-After:
              description: Segundos a esperar antes de repetir a chamada.
              schema:
                type: integer
                minimum: 1
        '500':
          description: Erro inesperado; nada foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ERRO_INTERNO:
                  summary: Erro interno
                  value:
                    type: urn:x_cbi:erro:erro-interno
                    title: Erro interno
                    status: 500
                    detail: Erro inesperado ao processar a requisição. Nada desta requisição foi gravado; repita mais tarde.
                      O detalhe técnico fica só no log interno, ligado ao identificador do lote.
                    codigo: ERRO_INTERNO
  /ingestao/ccf/lotes/{idLoteOrigem}/pacotes/{sequencia}:
    put:
      operationId: enviarPacoteCcf
      tags:
      - Ingestão — Conta Corrente Fiscal (CCF)
      summary: Enviar um pacote de registros do lote da fonte Conta Corrente Fiscal (CCF)
      description: 'Grava um pacote numerado de débitos e parcelamentos de ICMS no lote e devolve, para cada registro, se
        foi aceito ou rejeitado com o motivo. Registro com erro não derruba o pacote: a resposta é 200 e o registro rejeitado
        vai para a lista de rejeitados, com o conteúdo original, para reprocesso (RN-NOVO-ING-004). Reenviar o mesmo número
        de pacote com o mesmo conteúdo devolve a mesma resposta e não grava nada de novo (RN-NOVO-ING-005). Pacote fora da
        sequência é recusado com 422 e a sequência esperada.'
      security:
      - OAuthFonte:
        - ingestao.ccf
      parameters:
      - $ref: '#/components/parameters/IdLoteOrigem'
      - $ref: '#/components/parameters/Sequencia'
      requestBody:
        required: true
        description: Corpo em JSON conforme o schema abaixo; campos fora do contrato são recusados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacoteCcf'
            examples:
              pacote:
                summary: Pacote com um registro válido e um inválido
                value:
                  debitos:
                  - idOrigem: CCF-2026-000123
                    documento: '11222333000181'
                    nome: Empresa Sintética Ltda
                    tributo: ICMS_NORMAL
                    valor: 1520.75
                    vencimento: '2026-09-10'
                    instrumento: DECLARACAO
                    situacao: EM_ABERTO
                  - idOrigem: CCF-2026-000124
                    documento: '52998224700'
                    nome: Contribuinte Sintético
                    tributo: ICMS_NORMAL
                    valor: 300.0
                    vencimento: '2026-08-10'
                    situacao: EM_ABERTO
                  parcelamentos:
                  - idOrigem: CCF-PAR-0042
                    numero: PAR-2026-00042
                    documento: '11222333000181'
                    tributo: ICMS_NORMAL
                    parcelasTotal: 24
                    parcelasPagas: 10
                    parcelasEmAtraso: 2
                    valor: 48000.0
                    situacao: EM_RISCO
      responses:
        '200':
          description: Pacote processado. Cada registro vem como aceito ou rejeitado com o motivo; em reenvio, «reenvio» vem
            true e nada foi gravado de novo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoPacote'
              examples:
                resultado:
                  summary: Um aceito e um rejeitado
                  value:
                    idLoteOrigem: LOTE-20261113-01
                    sequencia: 1
                    reenvio: false
                    recebidos: 2
                    aceitos: 1
                    rejeitados: 1
                    resultados:
                    - chaveOrigem: CCF-2026-000123
                      lista: debitos
                      situacao: ACEITO
                    - chaveOrigem: CCF-2026-000124
                      lista: debitos
                      situacao: REJEITADO
                      motivo: DOC_INVALIDO
                      detalhe: Dígito verificador do CPF não confere.
        '400':
          description: O corpo não é um pacote válido (JSON malformado, lista vazia ou lista que esta fonte não envia).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CORPO_INVALIDO:
                  summary: Corpo da requisição inválido
                  value:
                    type: urn:x_cbi:erro:corpo-invalido
                    title: Corpo da requisição inválido
                    status: 400
                    detail: O corpo não é um JSON válido, falta campo obrigatório da requisição ou um campo está fora do formato.
                      O campo com problema vem em «campo».
                    codigo: CORPO_INVALIDO
                    campo: idLoteOrigem
        '401':
          description: Token ausente, vencido ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NAO_AUTENTICADO:
                  summary: Não autenticado
                  value:
                    type: urn:x_cbi:erro:nao-autenticado
                    title: Não autenticado
                    status: 401
                    detail: O token OAuth está ausente, vencido ou inválido. Peça um token novo e repita a chamada.
                    codigo: NAO_AUTENTICADO
        '403':
          description: O usuário de integração não pertence a esta fonte; nada foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ACESSO_NEGADO:
                  summary: Acesso negado a este endpoint
                  value:
                    type: urn:x_cbi:erro:acesso-negado
                    title: Acesso negado a este endpoint
                    status: 403
                    detail: 'O usuário de integração não tem permissão neste endpoint: cada fonte só envia pela própria API.
                      Nada foi gravado.'
                    codigo: ACESSO_NEGADO
                    x-rn-violada: RN-NOVO-ING-008
        '404':
          description: Não há lote aberto com este identificador para esta fonte.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOTE_NAO_ENCONTRADO:
                  summary: Lote não encontrado
                  value:
                    type: urn:x_cbi:erro:lote-nao-encontrado
                    title: Lote não encontrado
                    status: 404
                    detail: Não existe lote aberto com este identificador para esta fonte. Abra o lote antes de enviar pacotes.
                    codigo: LOTE_NAO_ENCONTRADO
        '409':
          description: O lote já foi fechado, ou este número de pacote já foi gravado com outro conteúdo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOTE_JA_FECHADO:
                  summary: Lote já fechado
                  value:
                    type: urn:x_cbi:erro:lote-ja-fechado
                    title: Lote já fechado
                    status: 409
                    detail: O lote já foi fechado. Um lote fechado não recebe pacotes nem pode ser reaberto; para corrigir
                      dados, envie um lote novo.
                    codigo: LOTE_JA_FECHADO
                    x-rn-violada: RN-NOVO-ING-005
                PACOTE_DIVERGENTE:
                  summary: Pacote já recebido com outro conteúdo
                  value:
                    type: urn:x_cbi:erro:pacote-divergente
                    title: Pacote já recebido com outro conteúdo
                    status: 409
                    detail: Este número de pacote já foi gravado com conteúdo diferente. Reenvio só vale com o mesmo conteúdo;
                      para mudar dados, use o próximo número de pacote.
                    codigo: PACOTE_DIVERGENTE
                    x-rn-violada: RN-NOVO-ING-005
        '413':
          description: O pacote tem mais registros do que o máximo permitido; nada dele foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                PACOTE_GRANDE_DEMAIS:
                  summary: Pacote acima do tamanho máximo
                  value:
                    type: urn:x_cbi:erro:pacote-grande-demais
                    title: Pacote acima do tamanho máximo
                    status: 413
                    detail: O pacote passou do número máximo de registros por pacote. Divida em pacotes menores; o lote continua
                      aberto e nada deste pacote foi gravado.
                    codigo: PACOTE_GRANDE_DEMAIS
        '422':
          description: O número do pacote não é o esperado; a resposta informa a sequência esperada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                SEQUENCIA_INVALIDA:
                  summary: Pacote fora de sequência
                  value:
                    type: urn:x_cbi:erro:sequencia-invalida
                    title: Pacote fora de sequência
                    status: 422
                    detail: O número do pacote não é o esperado para este lote. A sequência esperada vem em «sequenciaEsperada»;
                      nada deste pacote foi gravado.
                    codigo: SEQUENCIA_INVALIDA
                    x-rn-violada: RN-NOVO-ING-005
                    sequenciaEsperada: 3
        '429':
          description: O usuário de integração passou do limite de requisições; espere o tempo indicado e repita.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LIMITE_EXCEDIDO:
                  summary: Limite de requisições excedido
                  value:
                    type: urn:x_cbi:erro:limite-excedido
                    title: Limite de requisições excedido
                    status: 429
                    detail: O usuário de integração passou do limite de requisições. Espere o tempo de «Retry-After» e repita;
                      nada desta requisição foi gravado.
                    codigo: LIMITE_EXCEDIDO
          headers:
            Retry-After:
              description: Segundos a esperar antes de repetir a chamada.
              schema:
                type: integer
                minimum: 1
        '500':
          description: Erro inesperado; nada deste pacote foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ERRO_INTERNO:
                  summary: Erro interno
                  value:
                    type: urn:x_cbi:erro:erro-interno
                    title: Erro interno
                    status: 500
                    detail: Erro inesperado ao processar a requisição. Nada desta requisição foi gravado; repita mais tarde.
                      O detalhe técnico fica só no log interno, ligado ao identificador do lote.
                    codigo: ERRO_INTERNO
  /ingestao/ccf/lotes/{idLoteOrigem}/fechamento:
    put:
      operationId: fecharLoteCcf
      tags:
      - Ingestão — Conta Corrente Fiscal (CCF)
      summary: Fechar o lote da fonte Conta Corrente Fiscal (CCF)
      description: 'Fecha o lote informando quantos pacotes foram enviados e devolve o resumo final: OK quando nenhum registro
        foi rejeitado, PARCIAL quando houve rejeição. Fechar de novo com o mesmo total devolve o mesmo resumo. Se faltar pacote,
        recusa com 422 e lista os que faltam; o lote continua aberto até o prazo da fonte, quando o fechamento do ciclo o
        marca como FALHA e mantém a última carga válida (RN-NOVO-ING-006).'
      security:
      - OAuthFonte:
        - ingestao.ccf
      parameters:
      - $ref: '#/components/parameters/IdLoteOrigem'
      requestBody:
        required: true
        description: Corpo em JSON conforme o schema abaixo; campos fora do contrato são recusados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FechamentoLote'
            examples:
              fechamento:
                summary: Fechamento com 3 pacotes
                value:
                  pacotesEnviados: 3
      responses:
        '200':
          description: Lote fechado (ou já fechado com o mesmo total). O resumo traz a situação final e as contagens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lote'
              examples:
                fechado:
                  summary: Lote fechado com rejeição
                  value:
                    idLoteOrigem: LOTE-20261113-01
                    fonte: ccf
                    situacao: PARCIAL
                    pacotesPrevistos: 3
                    pacotesRecebidos: 3
                    lidos: 2900
                    aceitos: 2898
                    rejeitados: 2
                    inicio: '2026-11-13T02:00:00-04:00'
                    fim: '2026-11-13T02:40:00-04:00'
        '400':
          description: Corpo inválido ou campo obrigatório ausente (no score, a versão do modelo).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CORPO_INVALIDO:
                  summary: Corpo da requisição inválido
                  value:
                    type: urn:x_cbi:erro:corpo-invalido
                    title: Corpo da requisição inválido
                    status: 400
                    detail: O corpo não é um JSON válido, falta campo obrigatório da requisição ou um campo está fora do formato.
                      O campo com problema vem em «campo».
                    codigo: CORPO_INVALIDO
                    campo: idLoteOrigem
        '401':
          description: Token ausente, vencido ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NAO_AUTENTICADO:
                  summary: Não autenticado
                  value:
                    type: urn:x_cbi:erro:nao-autenticado
                    title: Não autenticado
                    status: 401
                    detail: O token OAuth está ausente, vencido ou inválido. Peça um token novo e repita a chamada.
                    codigo: NAO_AUTENTICADO
        '403':
          description: O usuário de integração não pertence a esta fonte; nada foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ACESSO_NEGADO:
                  summary: Acesso negado a este endpoint
                  value:
                    type: urn:x_cbi:erro:acesso-negado
                    title: Acesso negado a este endpoint
                    status: 403
                    detail: 'O usuário de integração não tem permissão neste endpoint: cada fonte só envia pela própria API.
                      Nada foi gravado.'
                    codigo: ACESSO_NEGADO
                    x-rn-violada: RN-NOVO-ING-008
        '404':
          description: Não há lote com este identificador para esta fonte.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOTE_NAO_ENCONTRADO:
                  summary: Lote não encontrado
                  value:
                    type: urn:x_cbi:erro:lote-nao-encontrado
                    title: Lote não encontrado
                    status: 404
                    detail: Não existe lote aberto com este identificador para esta fonte. Abra o lote antes de enviar pacotes.
                    codigo: LOTE_NAO_ENCONTRADO
        '409':
          description: O lote já foi fechado informando outro total de pacotes; vale o primeiro fechamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FECHAMENTO_DIVERGENTE:
                  summary: Lote fechado com outro total de pacotes
                  value:
                    type: urn:x_cbi:erro:fechamento-divergente
                    title: Lote fechado com outro total de pacotes
                    status: 409
                    detail: O lote já foi fechado informando outra quantidade de pacotes. O primeiro fechamento vale.
                    codigo: FECHAMENTO_DIVERGENTE
                    x-rn-violada: RN-NOVO-ING-005
        '422':
          description: O total informado não bate com os pacotes recebidos; a resposta lista os que faltam.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                PACOTES_FALTANTES:
                  summary: Faltam pacotes para fechar o lote
                  value:
                    type: urn:x_cbi:erro:pacotes-faltantes
                    title: Faltam pacotes para fechar o lote
                    status: 422
                    detail: A quantidade de pacotes informada no fechamento não bate com os pacotes recebidos. Os números
                      que faltam vêm em «pacotesFaltantes»; o lote continua aberto para o reenvio.
