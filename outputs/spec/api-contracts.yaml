                summary: Pacote com um registro válido e um inválido
                value:
                  debitos:
                  - idOrigem: ITCD-2026-000123
                    documento: '11222333000181'
                    nome: Empresa Sintética Ltda
                    tributo: ITCD
                    valor: 1520.75
                    vencimento: '2026-09-10'
                    instrumento: DECLARACAO
                    situacao: EM_ABERTO
