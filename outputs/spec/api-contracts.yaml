  /provedor/eventos-entrega:
    post:
      operationId: registrarEventoEntrega
      tags:
      - Retorno do provedor de mensagens
      summary: Receber o status de entrega de uma mensagem
      description: O provedor de e-mail, SMS e WhatsApp informa se uma mensagem foi entregue, lida ou falhou, e o sistema
        atualiza a comunicação. Status repetido, ou mais antigo que o atual, não muda nada e devolve 200 com alterado=false.
        Identificador desconhecido é recusado com 404 e o evento fica registrado para análise. Sem retorno do provedor, a
        comunicação fica como Enviada (integração INT-09).
      security:
      - OAuthProvedor:
        - provedor.status
      requestBody:
        required: true
        description: Corpo em JSON conforme o schema abaixo; campos fora do contrato são recusados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoEntrega'
            examples:
              entregue:
                summary: Mensagem entregue
                value:
                  idProvedor: msg-8f3a2c
                  canal: SMS
                  situacao: ENTREGUE
                  dataEvento: '2026-11-13T09:15:00-04:00'
      responses:
        '200':
          description: Status recebido. «alterado» diz se a comunicação mudou de situação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoEventoEntrega'
              examples:
                mudou:
                  summary: Enviado → Entregue
                  value:
                    idProvedor: msg-8f3a2c
                    situacaoAtual: ENTREGUE
                    alterado: true
                repetido:
                  summary: Status repetido, nada muda
