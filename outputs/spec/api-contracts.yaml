                    detail: O usuário de integração passou do limite de requisições. Espere o tempo de «Retry-After» e repita;
                      nada desta requisição foi gravado.
                    codigo: LIMITE_EXCEDIDO
          headers:
            Retry-After:
              description: Segundos a esperar antes de repetir a chamada.
