        recusa com 422 e lista os que faltam; o lote continua aberto até o prazo da fonte, quando o fechamento do ciclo o
        marca como FALHA e mantém a última carga válida (RN-NOVO-ING-006). Sem a versão do modelo (na abertura ou aqui), recusa
        com 400 e informa o campo ausente; ao fechar, o score de cada contribuinte encontrado passa a ser o vigente.'
