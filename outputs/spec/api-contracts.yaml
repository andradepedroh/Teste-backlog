        registro, se foi aceito ou rejeitado com o motivo. Registro com erro não derruba o pacote: a resposta é 200 e o registro
        rejeitado vai para a lista de rejeitados, com o conteúdo original, para reprocesso (RN-NOVO-ING-004). Reenviar o mesmo
        número de pacote com o mesmo conteúdo devolve a mesma resposta e não grava nada de novo (RN-NOVO-ING-005). Pacote
        fora da sequência é recusado com 422 e a sequência esperada.'
      security:
      - OAuthFonte:
        - ingestao.sne
      parameters:
      - $ref: '#/components/parameters/IdLoteOrigem'
      - $ref: '#/components/parameters/Sequencia'
      requestBody:
        required: true
        description: Corpo em JSON conforme o schema abaixo; campos fora do contrato são recusados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacoteSne'
            examples:
              pacote:
                summary: Pacote com um registro válido e um inválido
                value:
                  debitos:
                  - idOrigem: SNE-2026-000123
                    documento: '11222333000181'
                    nome: Empresa Sintética Ltda
                    tributo: ICMS_NORMAL
                    valor: 1520.75
                    vencimento: '2026-09-10'
                    instrumento: DECLARACAO
                    situacao: EM_ABERTO
                  - idOrigem: SNE-2026-000124
                    documento: '52998224700'
                    nome: Contribuinte Sintético
                    tributo: ICMS_NORMAL
                    valor: 300.0
                    vencimento: '2026-08-10'
                    situacao: EM_ABERTO
                  sinalizacoes:
                  - idOrigem: SNE-SIN-0007
                    documento: '11222333000181'
                    tipo: PROTESTO_PGE
                    data: '2026-10-30'
                    ativa: true
                    descricao: Protesto enviado pela PGE
      responses:
        '200':
          description: Pacote processado. Cada registro vem como aceito ou rejeitado com o motivo; em reenvio, «reenvio» vem
            true e nada foi gravado de novo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoPacote'
              examples:
                resultado:
                  summary: Um aceito e um rejeitado
                  value:
                    idLoteOrigem: LOTE-20261113-01
                    sequencia: 1
                    reenvio: false
                    recebidos: 2
                    aceitos: 1
                    rejeitados: 1
                    resultados:
                    - chaveOrigem: SNE-2026-000123
                      lista: debitos
                      situacao: ACEITO
                    - chaveOrigem: SNE-2026-000124
                      lista: debitos
                      situacao: REJEITADO
                      motivo: DOC_INVALIDO
                      detalhe: Dígito verificador do CPF não confere.
        '400':
          description: O corpo não é um pacote válido (JSON malformado, lista vazia ou lista que esta fonte não envia).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CORPO_INVALIDO:
                  summary: Corpo da requisição inválido
                  value:
                    type: urn:x_cbi:erro:corpo-invalido
                    title: Corpo da requisição inválido
                    status: 400
                    detail: O corpo não é um JSON válido, falta campo obrigatório da requisição ou um campo está fora do formato.
                      O campo com problema vem em «campo».
                    codigo: CORPO_INVALIDO
                    campo: idLoteOrigem
        '401':
          description: Token ausente, vencido ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NAO_AUTENTICADO:
                  summary: Não autenticado
                  value:
                    type: urn:x_cbi:erro:nao-autenticado
                    title: Não autenticado
                    status: 401
                    detail: O token OAuth está ausente, vencido ou inválido. Peça um token novo e repita a chamada.
                    codigo: NAO_AUTENTICADO
        '403':
          description: O usuário de integração não pertence a esta fonte; nada foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ACESSO_NEGADO:
                  summary: Acesso negado a este endpoint
                  value:
                    type: urn:x_cbi:erro:acesso-negado
                    title: Acesso negado a este endpoint
                    status: 403
                    detail: 'O usuário de integração não tem permissão neste endpoint: cada fonte só envia pela própria API.
                      Nada foi gravado.'
                    codigo: ACESSO_NEGADO
                    x-rn-violada: RN-NOVO-ING-008
        '404':
          description: Não há lote aberto com este identificador para esta fonte.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOTE_NAO_ENCONTRADO:
                  summary: Lote não encontrado
                  value:
                    type: urn:x_cbi:erro:lote-nao-encontrado
                    title: Lote não encontrado
                    status: 404
                    detail: Não existe lote aberto com este identificador para esta fonte. Abra o lote antes de enviar pacotes.
                    codigo: LOTE_NAO_ENCONTRADO
        '409':
          description: O lote já foi fechado, ou este número de pacote já foi gravado com outro conteúdo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOTE_JA_FECHADO:
                  summary: Lote já fechado
                  value:
                    type: urn:x_cbi:erro:lote-ja-fechado
                    title: Lote já fechado
                    status: 409
                    detail: O lote já foi fechado. Um lote fechado não recebe pacotes nem pode ser reaberto; para corrigir
                      dados, envie um lote novo.
                    codigo: LOTE_JA_FECHADO
                    x-rn-violada: RN-NOVO-ING-005
                PACOTE_DIVERGENTE:
                  summary: Pacote já recebido com outro conteúdo
                  value:
                    type: urn:x_cbi:erro:pacote-divergente
                    title: Pacote já recebido com outro conteúdo
                    status: 409
                    detail: Este número de pacote já foi gravado com conteúdo diferente. Reenvio só vale com o mesmo conteúdo;
                      para mudar dados, use o próximo número de pacote.
                    codigo: PACOTE_DIVERGENTE
                    x-rn-violada: RN-NOVO-ING-005
        '413':
          description: O pacote tem mais registros do que o máximo permitido; nada dele foi gravado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                PACOTE_GRANDE_DEMAIS:
                  summary: Pacote acima do tamanho máximo
                  value:
                    type: urn:x_cbi:erro:pacote-grande-demais
                    title: Pacote acima do tamanho máximo
                    status: 413
                    detail: O pacote passou do número máximo de registros por pacote. Divida em pacotes menores; o lote continua
                      aberto e nada deste pacote foi gravado.
                    codigo: PACOTE_GRANDE_DEMAIS
        '422':
          description: O número do pacote não é o esperado; a resposta informa a sequência esperada.
          content:
            application/problem+json:
