        rejeitados, com o conteúdo original, para reprocesso (RN-NOVO-ING-004). Reenviar o mesmo número de pacote com o mesmo
        conteúdo devolve a mesma resposta e não grava nada de novo (RN-NOVO-ING-005). Pacote fora da sequência é recusado
        com 422 e a sequência esperada.'
