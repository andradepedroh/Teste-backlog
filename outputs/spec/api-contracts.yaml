                    reenvio: false
                    recebidos: 2
                    aceitos: 1
                    rejeitados: 1
                    resultados:
                    - chaveOrigem: BIGDATA-2026-000123
                      lista: debitos
                      situacao: ACEITO
                    - chaveOrigem: BIGDATA-2026-000124
                      lista: debitos
                      situacao: REJEITADO
                      motivo: DOC_INVALIDO
                      detalhe: Dígito verificador do CPF não confere.
